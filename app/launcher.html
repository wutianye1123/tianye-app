      { id:'轻松水族馆', name:'轻松水族馆', desc:'放松养鱼水族馆，打造属于你的水下世界，观赏美丽的鱼群悠游。', icon:'🐠', file:'轻松水族馆.html', tags:['休闲','放松','模拟'], genre:'休闲游戏' },
      { id:'超级钟表', name:'超级钟表', desc:'创意时钟互动，独特的时钟展示与互动体验。', icon:'⏰', file:'超级钟表.html', tags:['创意','互动','工具'], genre:'创意工具' },
      { id:'音乐生成器', name:'音乐生成器', desc:'创意音乐制作工具，自由组合音符和节拍，创作属于你的音乐作品。', icon:'🎵', file:'音乐生成器.html', tags:['音乐','创意','工具'], genre:'创意工具' },
      { id:'CS对战', name:'CS 对战', desc:'反恐精英FPS对战，经典5v5爆破模式，精准射击、团队协作，体验极致枪战快感。', icon:'💣', file:'index.html', tags:['FPS','射击','对战','联机'], genre:'射击游戏' },
      { id:'废品机械师', name:'废品机械师', desc:'创意建造游戏，使用各种零件组装车辆、飞机和火箭，自定义连接和动力系统，驾驶你的发明探索世界。', icon:'🔧', file:'index.html', tags:['建造','3D','物理','创意'], genre:'建造游戏' },
      { id:'FPV练习', name:'FPV 穿越机', desc:'FPV穿越机模拟器，支持DJI遥控器3，真实Acro物理引擎，赛道竞速与悬停训练。', icon:'🚁', file:'FPV练习.html', tags:['模拟','3D','FPV','飞行'], genre:'模拟游戏' },
      { id:'沙雕赛车', name:'沙雕赛车', desc:'爆笑3D赛车游戏，你的车会不断掉零件、方向盘飞走、油门卡死，看看你能不能开着只剩底盘的破车冲过终点线！', icon:'🏎️', file:'index.html', tags:['赛车','3D','搞笑','休闲'], genre:'休闲游戏' },
      { id:'地平线', name:'地平线', desc:'开放世界驾驶，山路漂移、海岸公路、测速挑战，体验自由驰骋的速度与激情。', icon:'🏁', file:'index.html', tags:['赛车','3D','开放世界','驾驶'], genre:'赛车游戏' },
      { id:'physics_ammo_break', name:'物理破碎', desc:'Ammo.js物理引擎演示，投掷球体击碎场景中的物体，体验真实的凸体破碎效果。', icon:'💥', file:'index.html', tags:['物理','3D','演示'], genre:'休闲游戏' },
      { id:'钓鱼游戏', name:'俄罗斯钓鱼', desc:'3D钓鱼模拟游戏，在湖畔、河流、码头等多个场景中体验真实钓鱼。收集图鉴，升级装备，钓到传说中的大鱼！', icon:'🎣', file:'index.html', tags:['模拟','3D','钓鱼','休闲'], genre:'模拟游戏' },
      { id:'星露谷物语', name:'星露谷物语', desc:'像素风农场模拟RPG，种植作物、浇水施肥、收获出售，体验悠闲的田园生活！支持四季更替、天气系统和商店经济。', icon:'🌾', file:'星露谷物语.html', tags:['模拟','农场','像素','RPG'], genre:'模拟游戏' }
    ];

    const sidebar = document.getElementById('sidebar');
    const welcomeScreen = document.getElementById('welcomeScreen');
    const gameDetail = document.getElementById('gameDetail');
    const searchInput = document.getElementById('searchInput');
    const welcomeStats = document.getElementById('welcomeStats');

    // 统计标签
    const allTags = [...new Set(games.flatMap(g => g.tags))].sort();
    welcomeStats.innerHTML = `<span class="stat">${games.length} 款游戏</span><span class="stat-divider">|</span><span class="stat">${allTags.length} 个分类</span>`;

    // 游玩时长
    function getPlayTimes() {
      if (window.electronAPI && window.electronAPI.getPlayTimes) {
        try { return window.electronAPI.getPlayTimes(); } catch(e) {}
      }
      return {};
    }

    function formatPlayTime(seconds) {
      if (!seconds) return '';
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      if (h > 0) return h + '小时' + (m > 0 ? m + '分钟' : '');
      if (m > 0) return m + '分钟' + (s > 0 ? s + '秒' : '');
      return s + '秒';
    }

    let selectedGame = null;

    function renderSidebar(filter = '') {
      sidebar.innerHTML = '';
      const filtered = games.filter(g =>
        g.name.toLowerCase().includes(filter.toLowerCase()) ||
        g.tags.some(t => t.includes(filter))
      );

      if (filtered.length === 0) {
        sidebar.innerHTML = '<div class="sidebar-empty">未找到游戏</div>';
        return;
      }

      const playTimes = getPlayTimes();

      filtered.forEach(game => {
        const pt = formatPlayTime(playTimes[game.id] || 0);
        const item = document.createElement('div');
        item.className = 'sidebar-item' + (selectedGame && selectedGame.id === game.id ? ' active' : '');
        item.innerHTML = `
          <div class="sidebar-icon">${game.icon}</div>
          <div class="sidebar-info">
            <span class="sidebar-name">${game.name}</span>
            <span class="sidebar-genre">${game.genre}${pt ? ' · ' + pt : ''}</span>
          </div>
          <svg class="sidebar-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9,6 15,12 9,18"/>
          </svg>
        `;
        item.addEventListener('click', () => selectGame(game));
        sidebar.appendChild(item);
      });
    }

    function selectGame(game) {
      selectedGame = game;
      // 更新侧边栏高亮
      document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
      event.currentTarget.classList.add('active');

      // 隐藏欢迎屏，显示详情
      welcomeScreen.style.display = 'none';
      gameDetail.style.display = 'flex';
      gameDetail.style.flexDirection = 'column';

      // 填充内容
      document.getElementById('detailName').textContent = game.name;
      document.getElementById('heroIcon').textContent = game.icon;
      document.getElementById('detailDesc').textContent = game.desc;

      // 标签
      const tagsEl = document.getElementById('detailTags');
      tagsEl.innerHTML = game.tags.map(t => `<span class="tag">${t}</span>`).join('');

      // 游戏信息
      const pt = getPlayTimes();
      const playTimeStr = formatPlayTime(pt[game.id] || 0) || '未游玩';
      const infoEl = document.getElementById('detailInfo');
      infoEl.innerHTML = `
        <div class="info-item"><span class="info-label">类型</span><span class="info-value">${game.genre}</span></div>
        <div class="info-item"><span class="info-label">视角</span><span class="info-value">${game.tags[1] || '—'}</span></div>
        <div class="info-item"><span class="info-label">标签</span><span class="info-value">${game.tags.join(' / ')}</span></div>
        <div class="info-item"><span class="info-label">游玩时长</span><span class="info-value">${playTimeStr}</span></div>
        <div class="info-item"><span class="info-label">状态</span><span class="info-value status-ready">就绪</span></div>
      `;

      // 播放按钮
      document.getElementById('playBtn').onclick = () => {
        const pvp = document.getElementById('mpPvPCheck')?.checked;
        const sep = game.file.includes('?') ? '&' : '?';
        const gamePath = `games/${game.id}/${game.file}${pvp ? sep + 'pvp=1' : ''}`;
        if (window.electronAPI && window.electronAPI.launchGame) {
          window.electronAPI.launchGame(gamePath);
        } else {
          window.open(gamePath, '_blank');
        }
      };

      // 动画
      gameDetail.classList.remove('fade-in');
      void gameDetail.offsetWidth;
      gameDetail.classList.add('fade-in');
    }

    // 搜索
    searchInput.addEventListener('input', (e) => {
      renderSidebar(e.target.value);
    });

    // ===== 联机系统 =====
    const mpPanel = document.getElementById('mpPanel');
    const mpBtn = document.getElementById('mpBtn');
    const mpCloseBtn = document.getElementById('mpCloseBtn');
    let mpState = 'idle'; // idle | hosting | joined
    let mpHostInfo = null; // { ip, port }
    let mpPlayers = [];
    let mpTeam = { host: 'red', join: 'red' };
    let mpNetMode = 'internet'; // 'internet' | 'lan'

    // 模式切换
    document.getElementById('mpModeInternet').addEventListener('click', () => {
      mpNetMode = 'internet';
      document.getElementById('mpModeInternet').style.cssText = 'flex:1;padding:8px;font-size:13px;background:rgba(102,126,234,0.25);border:2px solid #667eea;color:#667eea;';
      document.getElementById('mpModeLAN').style.cssText = 'flex:1;padding:8px;font-size:13px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#888;';
      if (document.getElementById('mpInternetRooms')) document.getElementById('mpInternetRooms').parentElement.style.display = '';
    });
    document.getElementById('mpModeLAN').addEventListener('click', () => {
      mpNetMode = 'lan';
      document.getElementById('mpModeLAN').style.cssText = 'flex:1;padding:8px;font-size:13px;background:rgba(34,197,94,0.25);border:2px solid #22c55e;color:#22c55e;';
      document.getElementById('mpModeInternet').style.cssText = 'flex:1;padding:8px;font-size:13px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#888;';
      if (document.getElementById('mpInternetRooms')) document.getElementById('mpInternetRooms').parentElement.style.display = 'none';
    });

    function selectMpTeam(panel, team) {
      mpTeam[panel] = team;
      const redBtn = document.getElementById(panel === 'host' ? 'mpHostTeamRed' : 'mpJoinTeamRed');
      const blueBtn = document.getElementById(panel === 'host' ? 'mpHostTeamBlue' : 'mpJoinTeamBlue');
      if (team === 'red') {
        redBtn.style.background = 'rgba(239,68,68,0.25)';
        blueBtn.style.background = 'rgba(59,130,246,0.1)';
      } else {
        blueBtn.style.background = 'rgba(59,130,246,0.25)';
        redBtn.style.background = 'rgba(239,68,68,0.1)';
      }
    }

    mpBtn.addEventListener('click', () => {
      mpPanel.style.display = mpPanel.style.display === 'none' ? 'block' : 'none';
    });
    mpCloseBtn.addEventListener('click', () => { mpPanel.style.display = 'none'; });

    // 全屏按钮
    document.getElementById('fullscreenBtn').addEventListener('click', () => {
      if (window.electronAPI && window.electronAPI.toggleFullScreen) {
        window.electronAPI.toggleFullScreen();
      }
    });

    // Tab 切换
    document.querySelectorAll('.mp-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        if (mpState !== 'idle') return;
        document.querySelectorAll('.mp-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.mp-tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab === 'host' ? 'mpHostTab' : 'mpJoinTab').classList.add('active');
        if (tab.dataset.tab === 'join') fetchInternetRooms();
      });
    });

    // 互联网房间列表
    let roomListTimer = null;
    async function fetchInternetRooms() {
      const el = document.getElementById('mpInternetRooms');
      if (!el) return;
      try {
        let rooms;
        if (window.electronAPI && window.electronAPI.mpRelayRooms) {
          rooms = await window.electronAPI.mpRelayRooms();
        } else {
          // HTTPS 页面必须走同源 /rooms（nginx 反代），HTTP 可直连中转服务器
          const roomsUrl = location.protocol === 'https:' ? '/rooms' : 'http://81.70.199.45:18766/rooms';
          const res = await fetch(roomsUrl);
          rooms = await res.json();
        }
        if (rooms.length === 0) {
          el.innerHTML = '<div style="color:#888;text-align:center;padding:12px;font-size:13px;">暂无在线房间<br><span style="color:#666;font-size:11px;">刷新中...</span></div>';
        } else {
          el.innerHTML = rooms.map(r =>
            `<div class="mp-internet-room" data-room="${r.roomId}" style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;margin:3px 0;background:rgba(102,126,234,0.1);border:1px solid rgba(102,126,234,0.25);border-radius:6px;cursor:pointer;transition:background 0.2s;" onmouseover="this.style.background='rgba(102,126,234,0.2)'" onmouseout="this.style.background='rgba(102,126,234,0.1)'">
              <div><span style="color:#a855f7;font-weight:600;">${r.hostName}</span>${r.gameName ? '<span style="color:#888;font-size:12px;margin-left:8px;">' + r.gameName + '</span>' : ''}</div>
              <div><span style="color:#22c55e;font-size:12px;">${r.players}人</span><span style="color:#666;font-size:12px;margin-left:8px;">房间 ${r.roomId}</span></div>
            </div>`
          ).join('');
          el.querySelectorAll('.mp-internet-room').forEach(item => {
            item.addEventListener('click', async () => {
              const roomId = item.dataset.room;
              document.getElementById('mpJoinRoomCode').value = roomId;
            });
          });
        }
      } catch (e) {
        el.innerHTML = '<div style="color:#f44;text-align:center;padding:12px;font-size:13px;">无法连接中转服务器</div>';
      }
    }
    // 自动刷新
    clearInterval(roomListTimer);
    roomListTimer = setInterval(fetchInternetRooms, 3000);

    // 监听消息
    if (window.electronAPI && window.electronAPI.onMpMessage) {
      window.electronAPI.onMpMessage((msg) => {
        if (msg.type === 'player-list') {
          // 一次性接收完整玩家列表，替换已有数据
          mpPlayers = msg.players.map(p => ({ id: p.id, name: p.name }));
          renderPlayerList();
        } else if (msg.type === 'player-join') {
          if (!mpPlayers.some(p => p.id === msg.id)) {
            mpPlayers.push({ id: msg.id, name: msg.name });
          }
          renderPlayerList();
        } else if (msg.type === 'player-leave') {
          mpPlayers = mpPlayers.filter(p => p.id !== msg.id);
          renderPlayerList();
        } else if (msg.type === 'disconnected') {
          mpState = 'idle';
          mpPlayers = [];
          showJoinForm();
        } else if (msg.type === 'game-start' && mpState === 'joined' && selectedGame) {
          // Host 开始了游戏，自动跳转
          const team = mpTeam.join;
          const sep = selectedGame.file.includes('?') ? '&' : '?';
          let params = '';
          if (msg.pvp) params += 'pvp=1';
          if (team) params += (params ? '&' : '') + 'team=' + team;
          const gamePath = `games/${selectedGame.id}/${selectedGame.file}${params ? sep + params : ''}`;
          if (window.electronAPI && window.electronAPI.launchGame) {
            window.electronAPI.launchGame(gamePath);
          }
        }
      });
    }

    function renderPlayerList() {
      const list = document.getElementById(mpState === 'hosting' ? 'mpPlayerList' : 'mpJoinPlayerList');
      if (!list) return;
      let html = '';
      if (mpState === 'hosting') {
        html += '<div class="mp-player-item"><span class="mp-player-dot host"></span> 你 (主机)</div>';
      }
      mpPlayers.forEach(p => {
        html += `<div class="mp-player-item"><span class="mp-player-dot"></span> ${p.name || 'Player ' + p.id}</div>`;
      });
      list.innerHTML = html;
    }

    // 创建房间
    document.getElementById('mpCreateBtn').addEventListener('click', async () => {
      if (!window.electronAPI || !window.electronAPI.mpHost) {
        alert('联机功能不可用'); return;
      }
      try {
        const name = document.getElementById('mpHostName').value.trim() || '玩家1';
        const mode = mpNetMode === 'internet' ? 'internet' : undefined;
        mpHostInfo = await window.electronAPI.mpHost({ name, gameName: selectedGame ? selectedGame.name : '', mode });
        if (mpHostInfo.error) { alert('创建房间失败: ' + mpHostInfo.error); return; }
        mpState = 'hosting';
        mpPlayers = [];
        document.getElementById('mpHostSetup').style.display = 'none';
        document.getElementById('mpHostInfo').style.display = 'block';
        if (mpHostInfo.roomId) {
          document.getElementById('mpRoomCode').textContent = mpHostInfo.roomId;
        } else {
          document.getElementById('mpRoomCode').textContent = (mpHostInfo.ip || '') + ':' + (mpHostInfo.port || '');
        }
        const tip = document.getElementById('mpCreateTip');
        tip.textContent = mpNetMode === 'internet' ? '互联网房间创建成功！分享房间号给好友' : '局域网房间创建成功！';
        tip.style.display = 'block';
        tip.style.opacity = '1';
        setTimeout(() => { tip.style.opacity = '0'; setTimeout(() => tip.style.display = 'none', 400); }, 3000);
      } catch (e) {
        alert('创建房间失败: ' + e.message);
      }
    });

    // 复制房间号
    document.getElementById('mpCopyCodeBtn').addEventListener('click', () => {
      const text = document.getElementById('mpRoomCode').textContent;
      navigator.clipboard.writeText(text).then(() => {
        document.getElementById('mpCopyCodeBtn').classList.add('copied');
        setTimeout(() => document.getElementById('mpCopyCodeBtn').classList.remove('copied'), 1500);
      });
    });

    // 主机开始联机游戏
    document.getElementById('mpStartBtn').addEventListener('click', () => {
      if (!selectedGame) return;
      const pvp = document.getElementById('mpPvPCheck').checked;
      const team = mpTeam.host;
      const sep = selectedGame.file.includes('?') ? '&' : '?';
      let params = '';
      if (pvp) params += 'pvp=1';
      if (team) params += (params ? '&' : '') + 'team=' + team;
      const gamePath = `games/${selectedGame.id}/${selectedGame.file}${params ? sep + params : ''}`;
      if (window.electronAPI && window.electronAPI.launchGame) {
        window.electronAPI.launchGame(gamePath);
      }
    });

    // 主机关闭房间
    document.getElementById('mpHostStopBtn').addEventListener('click', async () => {
      if (window.electronAPI && window.electronAPI.mpStop) {
        await window.electronAPI.mpStop();
      }
      mpState = 'idle';
      mpPlayers = [];
      document.getElementById('mpHostSetup').style.display = 'block';
      document.getElementById('mpHostInfo').style.display = 'none';
    });

    // 修复防火墙按钮（仅 Windows 显示）
    document.getElementById('mpFirewallBtn').addEventListener('click', async () => {
      if (window.electronAPI && window.electronAPI.mpAddFirewall) {
        const result = await window.electronAPI.mpAddFirewall();
        alert(result.ok ? (result.msg || '防火墙规则已添加！其他玩家现在可以连接了。') : result.msg);
      } else {
        alert('请在防火墙中允许此应用通过网络。');
      }
    });

    // 防火墙按钮：仅 Windows 显示
    if (navigator.platform && navigator.platform.startsWith('Win')) {
      document.getElementById('mpFirewallBtn').style.display = '';
    }

    // 加入房间
    document.getElementById('mpJoinBtn').addEventListener('click', async () => {
      if (!window.electronAPI || !window.electronAPI.mpJoin) {
        alert('联机功能不可用'); return;
      }
      const roomCode = document.getElementById('mpJoinRoomCode').value.trim();
      const name = document.getElementById('mpJoinName').value.trim() || '玩家2';
      const statusEl = document.getElementById('mpJoinStatus');

      if (!roomCode) {
        statusEl.textContent = '请输入房间号';
        statusEl.style.color = 'var(--red)';
        return;
      }
      statusEl.textContent = '连接中...';
      statusEl.style.color = 'var(--yellow)';

      try {
        await window.electronAPI.mpJoin(roomCode, 0, name);
        mpState = 'joined';
        mpPlayers = [];
        document.getElementById('mpJoinForm').style.display = 'none';
        document.getElementById('mpJoinConnected').style.display = 'block';
        renderPlayerList();
        statusEl.textContent = '已成功加入房间！';
        statusEl.style.color = 'var(--green)';
      } catch (e) {
        statusEl.textContent = '连接失败: ' + e.message;
        statusEl.style.color = 'var(--red)';
      }
    });

    function showJoinForm() {
      document.getElementById('mpJoinForm').style.display = 'block';
      document.getElementById('mpJoinConnected').style.display = 'none';
      document.getElementById('mpJoinStatus').textContent = '';
    }

    // 加入者断开
    document.getElementById('mpJoinStopBtn').addEventListener('click', async () => {
      if (window.electronAPI && window.electronAPI.mpStop) {
        await window.electronAPI.mpStop();
      }
      mpState = 'idle';
      mpPlayers = [];
      showJoinForm();
    });

    // 初始化
    renderSidebar();

    // ===== 启动动画 =====
    (function() {
      const splash = document.getElementById('splashScreen');
      // 非首次加载（从游戏返回）直接跳过动画
      if (window.electronAPI && !window.electronAPI.isFirstLoad()) {
        splash.remove();
        return;
      }
      const bar = document.getElementById('splashBar');
      const particles = document.getElementById('splashParticles');

      // 粒子效果
      for (let i = 0; i < 40; i++) {
        const p = document.createElement('div');
        p.className = 'splash-particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.top = Math.random() * 100 + '%';
        p.style.animationDelay = (Math.random() * 4) + 's';
        p.style.animationDuration = (3 + Math.random() * 4) + 's';
        p.style.width = p.style.height = (1 + Math.random() * 3) + 'px';
        particles.appendChild(p);
      }

      // 进度条动画（约4秒完成）
      let progress = 0;
      const interval = setInterval(() => {
        progress += Math.random() * 6 + 2;
        if (progress >= 100) {
          progress = 100;
          bar.style.width = '100%';
          clearInterval(interval);
          // 完成，停留后淡出
          setTimeout(() => {
            splash.classList.add('splash-exit');
            setTimeout(() => splash.remove(), 800);
          }, 500);
        } else {
          bar.style.width = progress + '%';
        }
      }, 150);
    })();
  </script>
  <!-- 网页版（非 Electron）联机兼容层：在 Electron 下会被 preload 注入的 electronAPI 跳过 -->
  <script src="web-api.js"></script>
</body>
</html>
