<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏中心</title>
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <!-- 启动动画 -->
  <div id="splashScreen" class="splash">
    <div class="splash-inner">
      <div class="splash-logo">
        <svg viewBox="0 0 120 120" width="100" height="100" class="splash-icon">
          <defs>
            <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#667eea"/>
              <stop offset="100%" stop-color="#a855f7"/>
            </linearGradient>
          </defs>
          <!-- Controller body -->
          <path d="M36,42 L84,42 Q96,42 97,54 L98,65 Q99,76 90,82 Q81,88 77,97 Q73,106 70,106 Q67,106 65,98 L62,88 L60,85 L58,88 L55,98 Q53,106 50,106 Q47,106 43,97 Q39,88 30,82 Q21,76 22,65 L23,54 Q24,42 36,42 Z"
                fill="none" stroke="url(#sg)" stroke-width="2.5" class="splash-body"/>
          <!-- Left stick -->
          <circle cx="42" cy="64" r="8" fill="none" stroke="url(#sg)" stroke-width="2" class="splash-stick-l"/>
          <circle cx="42" cy="63" r="3" fill="url(#sg)" opacity="0.5" class="splash-stick-l"/>
          <!-- D-pad -->
          <rect x="73" y="56" width="3" height="16" rx="1.5" fill="url(#sg)" class="splash-dpad"/>
          <rect x="66.5" y="62.5" width="16" height="3" rx="1.5" fill="url(#sg)" class="splash-dpad"/>
          <!-- Buttons -->
          <circle cx="60" cy="54" r="4" fill="none" stroke="#ef4444" stroke-width="1.8" class="splash-btn splash-btn-y"/>
          <circle cx="68" cy="62" r="4" fill="none" stroke="#22c55e" stroke-width="1.8" class="splash-btn splash-btn-b"/>
          <circle cx="60" cy="70" r="4" fill="none" stroke="#3b82f6" stroke-width="1.8" class="splash-btn splash-btn-a"/>
          <circle cx="52" cy="62" r="4" fill="none" stroke="#f59e0b" stroke-width="1.8" class="splash-btn splash-btn-x"/>
        </svg>
      </div>
      <div class="splash-text">
        <span class="splash-title">游戏中心</span>
      </div>
      <div class="splash-bar-track">
        <div class="splash-bar" id="splashBar"></div>
      </div>
    </div>
    <div class="splash-particles" id="splashParticles"></div>
  </div>

  <!-- 注册 / 登陆 -->
  <div id="frOnboardModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:100001;align-items:center;justify-content:center;">
    <div style="background:#1e293b;border:1px solid rgba(102,126,234,0.4);border-radius:14px;padding:28px;max-width:360px;width:90%;text-align:center;">
      <div style="font-size:40px;">👋</div>
      <h3 style="margin:10px 0 6px;">游戏中心账号</h3>
      <div style="display:flex;gap:8px;margin:6px 0 16px;">
        <button id="frTabRegister" class="mp-action-btn" style="flex:1;">注册</button>
        <button id="frTabLogin" class="mp-action-btn" style="flex:1;opacity:0.5;">登陆</button>
      </div>
      <div id="frAuthError" style="display:none;color:#ef4444;font-size:13px;margin-bottom:10px;min-height:16px;"></div>
      <input type="text" id="frAuthName" placeholder="昵称" maxlength="16" style="width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.05);color:#fff;outline:none;font-size:15px;text-align:center;margin-bottom:8px;">
      <input type="password" id="frAuthPass" placeholder="密码（至少 4 位）" style="width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.05);color:#fff;outline:none;font-size:15px;text-align:center;margin-bottom:8px;">
      <input type="password" id="frAuthPass2" placeholder="确认密码" style="width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.05);color:#fff;outline:none;font-size:15px;text-align:center;margin-bottom:8px;">
      <button id="frAuthSubmit" class="mp-action-btn" style="width:100%;margin-top:6px;">注册</button>
    </div>
  </div>

  <!-- 好友邀请浮窗 -->
  <div id="frInviteToast" style="display:none;position:fixed;bottom:20px;right:20px;background:#1e293b;border:1px solid #667eea;border-radius:10px;padding:14px 18px;z-index:100000;box-shadow:0 8px 24px rgba(0,0,0,0.4);max-width:300px;">
    <div id="frInviteText" style="margin-bottom:10px;font-size:14px;"></div>
    <button id="frInviteAccept" class="mp-action-btn" style="padding:6px 14px;font-size:13px;">接受</button>
    <button id="frInviteDecline" style="padding:6px 14px;font-size:13px;margin-left:6px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#ccc;border-radius:6px;cursor:pointer;">拒绝</button>
  </div>

  <!-- 好友面板（全局浮窗，导航栏"好友"按钮触发；不依赖选中的游戏） -->
  <div class="mp-panel" id="friendsPanel" style="display:none;position:fixed;top:72px;right:16px;width:420px;max-height:82vh;overflow-y:auto;z-index:99990;background:#1e293b;box-shadow:0 8px 24px rgba(0,0,0,0.4);">
    <div class="mp-panel-header">
      <h3>好友</h3>
      <button class="mp-close-btn" id="frCloseBtn">&times;</button>
    </div>
    <div style="margin-bottom:12px;">
      <span class="mp-label">我的好友码</span>
      <div style="display:flex;align-items:center;gap:8px;margin-top:4px;">
        <code id="frMyCode" style="flex:1;font-size:22px;letter-spacing:4px;color:#a855f7;">----</code>
        <button class="mp-copy-btn" id="frCopyCodeBtn" title="复制好友码" style="padding:6px 10px;font-size:12px;border-radius:6px;cursor:pointer;">复制</button>
      </div>
      <div class="mp-field" style="margin-top:8px;">
        <label>我的昵称</label>
        <div style="display:flex;gap:6px;">
          <input type="text" id="frMyName" maxlength="16" style="flex:1;padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.05);color:#fff;outline:none;">
          <button id="frSaveNameBtn" class="mp-action-btn" style="padding:8px 14px;">改名</button>
        </div>
      </div>
    </div>
    <div class="mp-field">
      <label>添加好友（输入 8 位好友码）</label>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <input type="text" id="frAddInput" inputmode="numeric" placeholder="8 位好友码" maxlength="8" style="width:100%;box-sizing:border-box;padding:16px;border-radius:6px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.05);color:#fff;outline:none;font-size:24px;letter-spacing:8px;text-align:center;">
        <button id="frAddBtn" class="mp-action-btn" style="padding:16px 14px;width:100%;">发送请求</button>
      </div>
    </div>
    <div id="frRequests" style="margin:8px 0;"></div>
    <div class="mp-field">
      <span class="mp-label">好友列表</span>
      <div id="frList" class="mp-player-list"></div>
    </div>
    <div style="margin-top:14px;border-top:1px solid rgba(255,255,255,0.1);padding-top:10px;display:flex;flex-direction:column;gap:8px;">
      <button id="frLogoutBtn" style="width:100%;padding:8px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.2);color:#ccc;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;">退出登陆</button>
      <button id="frDeleteAccountBtn" style="width:100%;padding:8px;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.4);color:#ef4444;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;">删除账号</button>
    </div>
  </div>

  <!-- 顶部导航栏 -->
  <nav class="navbar">
    <div class="navbar-brand">
      <svg class="brand-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="6" width="20" height="12" rx="4"/>
        <circle cx="8" cy="12" r="2"/>
        <circle cx="16" cy="12" r="2"/>
        <line x1="6" y1="9" x2="10" y2="9"/>
        <line x1="14" y1="9" x2="18" y2="9"/>
        <line x1="6" y1="15" x2="10" y2="15"/>
        <line x1="14" y1="15" x2="18" y2="15"/>
      </svg>
      <span class="brand-text">游戏中心</span>
    </div>
    <div class="navbar-search">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" class="search-icon">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="searchInput" placeholder="搜索游戏..." autocomplete="off">
    </div>
    <span id="relayStatus" style="display:flex;align-items:center;gap:6px;padding:6px 12px;font-size:12px;color:#94a3b8;"><span id="relayStatusDot" style="width:8px;height:8px;border-radius:50%;background:#f59e0b;"></span><span id="relayStatusText">连接中</span></span>
    <button id="friendsBtn" style="display:flex;align-items:center;gap:6px;padding:6px 14px;background:rgba(168,85,247,0.2);border:1px solid rgba(168,85,247,0.4);border-radius:6px;color:#a855f7;font-size:13px;cursor:pointer;font-family:inherit;">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      好友
    </button>
    <a href="/download/游戏中心-2.0.0-Mac.dmg" id="downloadBtn" style="display:flex;align-items:center;gap:6px;padding:6px 14px;background:rgba(102,126,234,0.2);border:1px solid rgba(102,126,234,0.4);border-radius:6px;color:#667eea;text-decoration:none;font-size:13px;cursor:pointer;transition:background 0.2s;" onmouseover="this.style.background='rgba(102,126,234,0.35)'" onmouseout="this.style.background='rgba(102,126,234,0.2)'">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      下载本地版
    </a>
  </nav>

  <div class="app-body">
    <!-- 左侧游戏列表 -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- 右侧详情区 -->
    <main class="content">
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-icon">
          <svg viewBox="0 0 512 512" width="120" height="120">
            <defs>
              <linearGradient id="wg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#667eea"/>
                <stop offset="100%" stop-color="#764ba2"/>
              </linearGradient>
            </defs>
            <rect width="512" height="512" rx="108" fill="url(#wg)" opacity="0.15"/>
            <path d="M160,175 L352,175 Q390,175 395,210 L398,250 Q400,280 380,298 Q360,316 352,340 Q344,364 338,382 Q328,405 310,405 Q292,405 285,388 L275,360 L268,342 L256,336 L244,342 L237,360 L227,388 Q220,405 202,405 Q184,405 174,382 Q168,364 160,340 Q152,316 132,298 Q112,280 114,250 L117,210 Q122,175 160,175 Z"
                  fill="url(#wg)" opacity="0.6"/>
            <circle cx="180" cy="250" r="18" fill="none" stroke="white" stroke-width="3" opacity="0.5"/>
            <circle cx="180" cy="248" r="8" fill="white" opacity="0.3"/>
            <rect x="326" y="235" width="10" height="32" rx="3" fill="white" opacity="0.5"/>
            <rect x="315" y="246" width="32" height="10" rx="3" fill="white" opacity="0.5"/>
            <circle cx="256" cy="225" r="9" fill="none" stroke="#ef4444" stroke-width="2.5" opacity="0.7"/>
            <circle cx="278" cy="248" r="9" fill="none" stroke="#22c55e" stroke-width="2.5" opacity="0.7"/>
            <circle cx="256" cy="271" r="9" fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0.7"/>
            <circle cx="234" cy="248" r="9" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0.7"/>
          </svg>
        </div>
        <h1>选择一个游戏开始游玩</h1>
        <p>从左侧列表选择游戏，或使用搜索栏快速查找</p>
        <div class="welcome-stats" id="welcomeStats"></div>
      </div>

      <div class="game-detail" id="gameDetail" style="display:none">
        <div class="detail-hero" id="detailHero">
          <div class="hero-overlay"></div>
          <div class="hero-content">
            <div class="hero-icon" id="heroIcon"></div>
            <div class="hero-info">
              <h1 id="detailName"></h1>
              <div class="hero-tags" id="detailTags"></div>
            </div>
          </div>
        </div>
        <div class="detail-body">
          <div class="detail-actions">
            <button class="play-btn" id="playBtn">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <polygon points="5,3 19,12 5,21"/>
              </svg>
              <span>开始游戏 ▶</span>
            </button>
            <button class="mp-btn" id="mpBtn">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
              联机游戏
            </button>
            <button class="fullscreen-btn" id="fullscreenBtn">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 3 21 3 21 9"/>
                <polyline points="9 21 3 21 3 15"/>
                <line x1="21" y1="3" x2="14" y2="10"/>
                <line x1="3" y1="21" x2="10" y2="14"/>
              </svg>
              全屏
            </button>
          </div>

          <!-- 联机面板 -->
          <div class="mp-panel" id="mpPanel" style="display:none">
            <div class="mp-panel-header">
              <h3>联机游戏</h3>
              <button class="mp-close-btn" id="mpCloseBtn">&times;</button>
            </div>
            <div style="display:flex;gap:8px;margin-bottom:12px;padding:0 4px;">
              <button id="mpModeInternet" class="mp-action-btn" style="flex:1;padding:8px;font-size:13px;background:rgba(102,126,234,0.25);border:2px solid #667eea;color:#667eea;">互联网联机</button>
              <button id="mpModeLAN" class="mp-action-btn" style="flex:1;padding:8px;font-size:13px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#888;">局域网联机</button>
            </div>
            <div class="mp-tabs">
              <button class="mp-tab active" data-tab="host">创建房间</button>
              <button class="mp-tab" data-tab="join">加入房间</button>
            </div>

            <!-- 创建房间 -->
            <div class="mp-tab-content active" id="mpHostTab">
              <div class="mp-host-info" id="mpHostInfo" style="display:none">
                <div class="mp-room-code">
                  <div id="mpCreateTip" style="display:none;opacity:0;transition:opacity 0.4s;background:rgba(34,197,94,0.15);color:#22c55e;padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:10px;border:1px solid rgba(34,197,94,0.3);"></div>
                  <span class="mp-label">房间号（分享给好友即可加入）</span>
                  <div class="mp-code-box" style="text-align:center;font-size:28px;letter-spacing:8px;padding:12px;">
                    <code id="mpRoomCode">----</code>
                    <button class="mp-copy-btn" id="mpCopyCodeBtn" title="复制房间号" style="vertical-align:middle;margin-left:8px;">
                      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    </button>
                  </div>
                </div>
                <div class="mp-players">
                  <span class="mp-label">玩家列表</span>
                  <div class="mp-player-list" id="mpPlayerList">
                    <div class="mp-player-item"><span class="mp-player-dot host"></span> 你 (主机)</div>
                  </div>
                </div>
                <button class="mp-start-btn" id="mpStartBtn">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
                  开始联机游戏
                </button>
                <button class="mp-stop-btn" id="mpHostStopBtn">关闭房间</button>
                <button class="mp-stop-btn" id="mpFirewallBtn" style="margin-top:8px;background:#e67e22;color:#fff;display:none;">修复防火墙（管理员）</button>
              </div>
              <div class="mp-host-setup" id="mpHostSetup">
                <div class="mp-field">
                  <label>你的昵称</label>
                  <input type="text" id="mpHostName" placeholder="输入昵称" maxlength="16" value="玩家1">
                </div>
                <div class="mp-field">
                  <label>选择队伍</label>
                  <div style="display:flex;gap:10px;">
                    <button id="mpHostTeamRed" class="mp-action-btn" style="flex:1;background:rgba(239,68,68,0.25);border:2px solid #ef4444;color:#ef4444;padding:8px 0;border-radius:8px;font-size:14px;cursor:pointer;" onclick="selectMpTeam('host','red')">红队</button>
                    <button id="mpHostTeamBlue" class="mp-action-btn" style="flex:1;background:rgba(59,130,246,0.1);border:2px solid #3b82f6;color:#3b82f6;padding:8px 0;border-radius:8px;font-size:14px;cursor:pointer;" onclick="selectMpTeam('host','blue')">蓝队</button>
                  </div>
                </div>
                <div style="margin-bottom:12px;display:flex;align-items:center;gap:8px;">
                  <input type="checkbox" id="mpPvPCheck" checked style="width:16px;height:16px;accent-color:#ef4444;cursor:pointer;flex-shrink:0;">
                  <label for="mpPvPCheck" style="margin:0;cursor:pointer;color:#ef4444;font-size:14px;font-weight:500;">PvP 玩家对打</label>
                </div>
                <button class="mp-action-btn" id="mpCreateBtn">创建房间</button>
              </div>
            </div>

            <!-- 加入房间 -->
            <div class="mp-tab-content" id="mpJoinTab">
              <div class="mp-join-connected" id="mpJoinConnected" style="display:none">
                <div class="mp-players">
                  <span class="mp-label">已连接到房间</span>
                  <div class="mp-player-list" id="mpJoinPlayerList"></div>
                </div>
                <button class="mp-stop-btn" id="mpJoinStopBtn">断开连接</button>
              </div>
              <div class="mp-join-form" id="mpJoinForm">
                <div class="mp-field">
                  <label>你的昵称</label>
                  <input type="text" id="mpJoinName" placeholder="输入昵称" maxlength="16" value="玩家2">
                </div>
                <div class="mp-field">
                  <label>选择队伍</label>
                  <div style="display:flex;gap:10px;">
                    <button id="mpJoinTeamRed" class="mp-action-btn" style="flex:1;background:rgba(239,68,68,0.25);border:2px solid #ef4444;color:#ef4444;padding:8px 0;border-radius:8px;font-size:14px;cursor:pointer;" onclick="selectMpTeam('join','red')">红队</button>
                    <button id="mpJoinTeamBlue" class="mp-action-btn" style="flex:1;background:rgba(59,130,246,0.1);border:2px solid #3b82f6;color:#3b82f6;padding:8px 0;border-radius:8px;font-size:14px;cursor:pointer;" onclick="selectMpTeam('join','blue')">蓝队</button>
                  </div>
                </div>
                <div class="mp-field">
                  <label>互联网房间（自动刷新）</label>
                  <div id="mpInternetRooms" style="max-height:200px;overflow-y:auto;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:4px;">
                    <div style="color:#888;text-align:center;padding:12px;font-size:13px;">正在加载...</div>
                  </div>
                </div>
                <div class="mp-field">
                  <label>手动输入房间号</label>
                  <div style="display:flex;flex-direction:column;gap:8px;">
                    <input type="text" id="mpJoinRoomCode" placeholder="房间号" maxlength="6" style="width:100%;box-sizing:border-box;font-size:30px;letter-spacing:10px;text-align:center;padding:18px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.05);color:#fff;outline:none;">
                    <button class="mp-action-btn" id="mpJoinBtn" style="padding:18px 20px;font-size:18px;width:100%;">加入</button>
                  </div>
                  <div class="mp-join-status" id="mpJoinStatus" style="margin-top:4px;"></div>
                </div>
              </div>
            </div>
          </div>

          <div class="detail-section">
            <h3>关于游戏</h3>
            <p id="detailDesc"></p>
          </div>
          <div class="detail-section" id="detailInfoSection">
            <h3>游戏信息</h3>
            <div class="info-grid" id="detailInfo"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 网页版（非 Electron）联机兼容层：必须在 inline script 之前加载，

      { id:'florr', name:'花朵大作战', desc:'类 florr.io 花朵生存对战！鼠标控制花朵，花瓣环绕自动攻击怪物，击杀掉落经验升级、解锁花瓣槽；支持互联网房间与其他玩家 PvP 对战。', icon:'🌸', file:'index.html', tags:['生存','2D','联机','PvP'], genre:'生存游戏' }
    ];

    const sidebar = document.getElementById('sidebar');
    const welcomeScreen = document.getElementById('welcomeScreen');
    const gameDetail = document.getElementById('gameDetail');
    const searchInput = document.getElementById('searchInput');
    const welcomeStats = document.getElementById('welcomeStats');

    // 统计标签
    const allTags = [...new Set(games.flatMap(g => g.tags))].sort();
    welcomeStats.innerHTML = `<span class="stat">${games.length} 款游戏</span><span class="stat-divider">|</span><span class="stat">${allTags.length} 个分类</span>`;

    // 游玩时长
    function getPlayTimes() {
      if (window.electronAPI && window.electronAPI.getPlayTimes) {
        try { return window.electronAPI.getPlayTimes(); } catch(e) {}
      }
      return {};
    }

    function formatPlayTime(seconds) {
      if (!seconds) return '';
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      if (h > 0) return h + '小时' + (m > 0 ? m + '分钟' : '');
      if (m > 0) return m + '分钟' + (s > 0 ? s + '秒' : '');
      return s + '秒';
    }

    let selectedGame = null;

    function renderSidebar(filter = '') {
      sidebar.innerHTML = '';
      const filtered = games.filter(g =>
        g.name.toLowerCase().includes(filter.toLowerCase()) ||
        g.tags.some(t => t.includes(filter))
      );

      if (filtered.length === 0) {
        sidebar.innerHTML = '<div class="sidebar-empty">未找到游戏</div>';
        return;
      }

      const playTimes = getPlayTimes();

      filtered.forEach(game => {
        const pt = formatPlayTime(playTimes[game.id] || 0);
        const item = document.createElement('div');
        item.className = 'sidebar-item' + (selectedGame && selectedGame.id === game.id ? ' active' : '');
        item.innerHTML = `
          <div class="sidebar-icon">${game.icon}</div>
          <div class="sidebar-info">
            <span class="sidebar-name">${game.name}</span>
            <span class="sidebar-genre">${game.genre}${pt ? ' · ' + pt : ''}</span>
          </div>
          <svg class="sidebar-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9,6 15,12 9,18"/>
          </svg>
        `;
        item.addEventListener('click', () => selectGame(game));
        sidebar.appendChild(item);
      });
    }

    function selectGame(game) {
      selectedGame = game;
      // 更新侧边栏高亮
      document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
      event.currentTarget.classList.add('active');

      // 隐藏欢迎屏，显示详情
      welcomeScreen.style.display = 'none';
      gameDetail.style.display = 'flex';
      gameDetail.style.flexDirection = 'column';

      // 填充内容
      document.getElementById('detailName').textContent = game.name;
      document.getElementById('heroIcon').textContent = game.icon;
      document.getElementById('detailDesc').textContent = game.desc;

      // 标签
      const tagsEl = document.getElementById('detailTags');
      tagsEl.innerHTML = game.tags.map(t => `<span class="tag">${t}</span>`).join('');

      // 游戏信息
      const pt = getPlayTimes();
      const playTimeStr = formatPlayTime(pt[game.id] || 0) || '未游玩';
      const infoEl = document.getElementById('detailInfo');
      infoEl.innerHTML = `
        <div class="info-item"><span class="info-label">类型</span><span class="info-value">${game.genre}</span></div>
        <div class="info-item"><span class="info-label">视角</span><span class="info-value">${game.tags[1] || '—'}</span></div>
        <div class="info-item"><span class="info-label">标签</span><span class="info-value">${game.tags.join(' / ')}</span></div>
        <div class="info-item"><span class="info-label">游玩时长</span><span class="info-value">${playTimeStr}</span></div>
        <div class="info-item"><span class="info-label">状态</span><span class="info-value status-ready">就绪</span></div>
      `;

      // 播放按钮
      document.getElementById('playBtn').onclick = () => {
        const pvp = document.getElementById('mpPvPCheck')?.checked;
        const sep = game.file.includes('?') ? '&' : '?';
        const gamePath = `games/${game.id}/${game.file}${pvp ? sep + 'pvp=1' : ''}`;
        if (window.electronAPI && window.electronAPI.launchGame) {
          window.electronAPI.launchGame(gamePath);
        } else {
          window.open(gamePath, '_blank');
        }
      };

      // 动画
      gameDetail.classList.remove('fade-in');
      void gameDetail.offsetWidth;
      gameDetail.classList.add('fade-in');
    }

    // 搜索
    searchInput.addEventListener('input', (e) => {
      renderSidebar(e.target.value);
    });

    // ===== 联机系统 =====
    const mpPanel = document.getElementById('mpPanel');
    const mpBtn = document.getElementById('mpBtn');
    const mpCloseBtn = document.getElementById('mpCloseBtn');
    let mpState = 'idle'; // idle | hosting | joined
    let mpHostInfo = null; // { ip, port }
    let mpPlayers = [];
    let mpMyId = null;
    let mpTeam = { host: 'red', join: 'red' };
    let mpNetMode = 'internet'; // 'internet' | 'lan'

    // 模式切换
    document.getElementById('mpModeInternet').addEventListener('click', () => {
      mpNetMode = 'internet';
      document.getElementById('mpModeInternet').style.cssText = 'flex:1;padding:8px;font-size:13px;background:rgba(102,126,234,0.25);border:2px solid #667eea;color:#667eea;';
      document.getElementById('mpModeLAN').style.cssText = 'flex:1;padding:8px;font-size:13px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#888;';
      if (window.electronAPI && window.electronAPI.mpDiscoverStop) window.electronAPI.mpDiscoverStop();
      const roomsEl = document.getElementById('mpInternetRooms');
      if (roomsEl) {
        roomsEl.parentElement.style.display = '';
        roomsEl.parentElement.querySelector('label').textContent = '互联网房间（自动刷新）';
      }
    });
    document.getElementById('mpModeLAN').addEventListener('click', () => {
      mpNetMode = 'lan';
      document.getElementById('mpModeLAN').style.cssText = 'flex:1;padding:8px;font-size:13px;background:rgba(34,197,94,0.25);border:2px solid #22c55e;color:#22c55e;';
      document.getElementById('mpModeInternet').style.cssText = 'flex:1;padding:8px;font-size:13px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#888;';
      const roomsEl = document.getElementById('mpInternetRooms');
      if (roomsEl) {
        roomsEl.parentElement.style.display = '';
        roomsEl.parentElement.querySelector('label').textContent = '局域网主机（自动扫描）';
        roomsEl.innerHTML = '<div style="color:#888;text-align:center;padding:12px;font-size:13px;">扫描局域网中...</div>';
      }
      if (window.electronAPI && window.electronAPI.mpDiscoverStart) {
        window.electronAPI.onMpDiscover(function(servers) {
          if (!roomsEl) return;
          if (!servers || !servers.length) { roomsEl.innerHTML = '<div style="color:#888;text-align:center;padding:12px;font-size:13px;">未发现局域网主机</div>'; return; }
          roomsEl.innerHTML = servers.map(function(s) {
            return '<div class="mp-lan-room" data-ip="' + s.ip + '" data-port="' + s.port + '" style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;margin:3px 0;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.25);border-radius:6px;cursor:pointer;" onmouseover="this.style.background=\'rgba(34,197,94,0.2)\'" onmouseout="this.style.background=\'rgba(34,197,94,0.1)\'"><div><span style="color:#22c55e;font-weight:600;">' + s.name + '</span>' + (s.game ? '<span style="color:#888;font-size:12px;margin-left:8px;">' + s.game + '</span>' : '') + '</div><div><span style="color:#666;font-size:12px;">' + s.ip + ':' + s.port + '</span></div></div>';
          }).join('');
          roomsEl.querySelectorAll('.mp-lan-room').forEach(function(item) {
            item.addEventListener('click', async function() {
              var ip = item.dataset.ip, port = parseInt(item.dataset.port) || 0;
              var name = document.getElementById('mpJoinName').value.trim() || '玩家';
              var st = document.getElementById('mpJoinStatus');
              st.textContent = '连接中...'; st.style.color = 'var(--yellow)';
              try {
                var res = await window.electronAPI.mpJoin(ip, port, name);
                if (res && res.error) throw new Error(res.error);
                mpState = 'joined'; mpPlayers = []; mpMyId = (res && res.id != null) ? res.id : null;
                document.getElementById('mpJoinForm').style.display = 'none';
                document.getElementById('mpJoinConnected').style.display = 'block';
                renderPlayerList();
                st.textContent = '已加入！'; st.style.color = 'var(--green)';
              } catch (e) { st.textContent = '连接失败: ' + e.message; st.style.color = 'var(--red)'; }
            });
          });
        });
        window.electronAPI.mpDiscoverStart();
      }
    });

    function selectMpTeam(panel, team) {
      mpTeam[panel] = team;
      const redBtn = document.getElementById(panel === 'host' ? 'mpHostTeamRed' : 'mpJoinTeamRed');
      const blueBtn = document.getElementById(panel === 'host' ? 'mpHostTeamBlue' : 'mpJoinTeamBlue');
      if (team === 'red') {
        redBtn.style.background = 'rgba(239,68,68,0.25)';
        blueBtn.style.background = 'rgba(59,130,246,0.1)';
      } else {
        blueBtn.style.background = 'rgba(59,130,246,0.25)';
        redBtn.style.background = 'rgba(239,68,68,0.1)';
      }
    }

    mpBtn.addEventListener('click', () => {
      const fp = document.getElementById('friendsPanel');
      if (fp) fp.style.display = 'none';
      mpPanel.style.display = mpPanel.style.display === 'none' ? 'block' : 'none';
    });
    mpCloseBtn.addEventListener('click', () => { mpPanel.style.display = 'none'; });

    // 全屏按钮
    document.getElementById('fullscreenBtn').addEventListener('click', () => {
      if (window.electronAPI && window.electronAPI.toggleFullScreen) {
        window.electronAPI.toggleFullScreen();
      }
    });

    // Tab 切换
    document.querySelectorAll('.mp-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        if (mpState !== 'idle') return;
        document.querySelectorAll('.mp-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.mp-tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab === 'host' ? 'mpHostTab' : 'mpJoinTab').classList.add('active');
        if (tab.dataset.tab === 'join') fetchInternetRooms();
      });
    });

    // 互联网房间列表
    let roomListTimer = null;
    async function fetchInternetRooms() {
      const el = document.getElementById('mpInternetRooms');
      if (!el) return;
      try {
        let rooms;
        if (window.electronAPI && window.electronAPI.mpRelayRooms) {
          rooms = await window.electronAPI.mpRelayRooms();
        } else {
          // HTTPS 页面必须走同源 /rooms（nginx 反代），HTTP 可直连中转服务器
          const roomsUrl = location.protocol === 'https:' ? '/rooms' : 'http://81.70.199.45:18766/rooms';
          const res = await fetch(roomsUrl);
          rooms = await res.json();
        }
        // 过滤掉自己创建的房间（不该看到/加入自己的房间）
        if (mpHostInfo && mpHostInfo.roomId) rooms = rooms.filter(r => r.roomId !== mpHostInfo.roomId);
        if (rooms.length === 0) {

              <div><span style="color:#a855f7;font-weight:600;">${r.hostName}</span>${r.gameName ? '<span style="color:#888;font-size:12px;margin-left:8px;">' + r.gameName + '</span>' : ''}</div>

    // 自动刷新

    // 监听消息
    if (window.electronAPI && window.electronAPI.onMpMessage) {

          mpPlayers = msg.players
            .filter(p => p.id !== mpMyId)
            .map(p => ({ id: p.id, name: p.name }));

        } else if (msg.type === 'player-join') {
          if (msg.id !== mpMyId && !mpPlayers.some(p => p.id === msg.id)) {
            mpPlayers.push({ id: msg.id, name: msg.name });
          }
          renderPlayerList();
        } else if (msg.type === 'player-leave') {
          mpPlayers = mpPlayers.filter(p => p.id !== msg.id);
          renderPlayerList();
        } else if (msg.type === 'disconnected') {
          mpState = 'idle';
          mpPlayers = [];
          mpMyId = null;
          showJoinForm();

          // 直接使用 host 的 gamePath，joiner 不需要预先在 sidebar 选游戏
          let gamePath = msg.gamePath;
          const team = mpTeam.join;

          if (msg.pvp && gamePath && !gamePath.includes('pvp=1')) extra += 'pvp=1';
          if (team && gamePath && !gamePath.includes('team=')) extra += (extra ? '&' : '') + 'team=' + team;

            gamePath += (gamePath.includes('?') ? '&' : '?') + extra;

          if (gamePath && window.electronAPI && window.electronAPI.launchGame) {
            window.electronAPI.launchGame(gamePath);

    // ===== 好友系统 =====
    const friendsPanel = document.getElementById('friendsPanel');

    let frProfile = null;

    function prefillNames(name) {
      const h = document.getElementById('mpHostName'); if (h) h.value = name;
      const j = document.getElementById('mpJoinName'); if (j) j.value = name;
      const m = document.getElementById('frMyName'); if (m) m.value = name;

    function setupFrHandlers() {
      if (!window.electronAPI || !window.electronAPI.onFrMessage) return;
      var _relayRetryT = null;
      window.electronAPI.onFrMessage((msg) => {
        if (msg.type === 'relay-status') {
          setRelayStatus(msg.online ? 'connected' : 'disconnected');
          // 断线后温和自动重连（5秒后单次重试，不会风暴）
          if (msg.online === false && frProfile && frProfile.code && !_relayRetryT) {
            _relayRetryT = setTimeout(function() {
              _relayRetryT = null;
              setRelayStatus('connecting');
              if (window.electronAPI.frConnect) window.electronAPI.frConnect();
            }, 5000);
          }
        } else if (msg.type === 'identity-registered') {
          if (_relayRetryT) { clearTimeout(_relayRetryT); _relayRetryT = null; }
          setRelayStatus('connected');
          frProfile = frProfile || {}; frProfile.code = msg.code;
          if (msg.name) frProfile.name = msg.name;
          if (window.electronAPI.frSaveCode) window.electronAPI.frSaveCode(msg.code);
          if (window.electronAPI.frSetProfile && msg.name) window.electronAPI.frSetProfile(msg.name);
          const m = document.getElementById('frOnboardModal'); if (m) m.style.display = 'none';
          if (msg.name) prefillNames(msg.name);
          renderFriends();
          refreshFriends();
        } else if (msg.type === 'friends-presence-snapshot') {
          frList = msg.list || []; renderFriends();
        } else if (msg.type === 'friend-online') {
          const f = frList.find(x => x.code === msg.code);
          if (f) { f.online = true; f.roomId = msg.roomId || null; if (msg.name) f.name = msg.name; }
          else frList.push({ code: msg.code, name: msg.name, online: true, roomId: msg.roomId || null });
          renderFriends();
        } else if (msg.type === 'friend-offline') {
          const f = frList.find(x => x.code === msg.code);
          if (f) { f.online = false; f.roomId = null; }
          renderFriends();
        } else if (msg.type === 'friend-name-change') {
          const f = frList.find(x => x.code === msg.code);
          if (f) { f.name = msg.name; renderFriends(); }
        } else if (msg.type === 'incoming-request') {
          if (!frRequests.some(r => r.from === msg.from)) {
            frRequests.push({ from: msg.from, fromName: msg.fromName, ts: msg.ts });
            renderRequests();
          }
        } else if (msg.type === 'request-accepted' || msg.type === 'friend-added') {
          refreshFriends();
        } else if (msg.type === 'friend-removed') {
          frList = frList.filter(x => x.code !== msg.code); renderFriends();
        } else if (msg.type === 'incoming-invite') {
          showInviteToast(msg);
        } else if (msg.type === 'friend-request-result') {
          if (msg.msg && msg.ok === false) alert(msg.msg);
          refreshFriends();
        } else if (msg.type === 'identity-rejected') {
          showAuthModal('login', msg.msg || '请重新登录');
        } else if (msg.type === 'auth-error') {
          const errEl = document.getElementById('frAuthError');
          if (errEl) { errEl.textContent = msg.msg || '操作失败'; errEl.style.display = 'block'; }
          // 自动切换标签，引导走对的路：注册遇"已注册"→登陆；登陆遇"不存在"→注册
          if (frAuthMode === 'register' && /已注册/.test(msg.msg || '')) {
            frAuthMode = 'login'; applyAuthTab();
            if (errEl) errEl.textContent = '该昵称已注册，已切换到「登陆」';
          } else if (frAuthMode === 'login' && /不存在/.test(msg.msg || '')) {
            frAuthMode = 'register'; applyAuthTab();
            if (errEl) errEl.textContent = '账号不存在，已切换到「注册」';
          }
        }
      });
    }

    async function refreshFriends() {
      if (!window.electronAPI || !window.electronAPI.frList) return;
      try {
        const res = await window.electronAPI.frList();
        frList = (res && res.list) || [];
        renderFriends();
      } catch (e) {}
    }

    function renderFriends() {
      if (frProfile && frProfile.code) {
        const codeEl = document.getElementById('frMyCode');
        if (codeEl) codeEl.textContent = frProfile.code.replace(/(\d{4})(\d{4})/, '$1 $2');
      }
      const el = document.getElementById('frList');
      if (!el) return;
      if (!frList.length) {
        el.innerHTML = '<div style="color:#888;padding:10px;text-align:center;font-size:13px;">还没有好友，输入好友码添加吧</div>';
        return;
      }
      el.innerHTML = frList.map(f => {
        const status = f.online
          ? (f.roomId ? '<span style="color:#22c55e;">在房间中</span>' : '<span style="color:#94a3b8;">在线</span>')
          : '<span style="color:#555;">离线</span>';
        const joinBtn = (f.online && f.roomId)
          ? `<button class="mp-action-btn" data-join="${f.roomId}" style="padding:4px 10px;font-size:12px;">加入</button>` : '';
        const inviteBtn = (f.online && mpState === 'hosting')
          ? `<button class="mp-action-btn" data-invite="${f.code}" style="padding:4px 10px;font-size:12px;margin-left:4px;">邀请</button>` : '';
        const dotColor = f.online ? '#22c55e' : '#555';
        return `<div class="mp-player-item" style="display:flex;justify-content:space-between;align-items:center;">
          <span><span class="mp-player-dot" style="background:${dotColor};"></span>${f.name || f.code} ${status}</span>
          <span>${joinBtn}${inviteBtn}</span>
        </div>`;
      }).join('');
      el.querySelectorAll('[data-join]').forEach(b => b.addEventListener('click', async () => {
        const res = await window.electronAPI.frJoin(b.dataset.join, (frProfile && frProfile.name) || '玩家');
        if (res && res.error) { alert('加入失败: ' + res.error); return; }
        mpState = 'joined'; mpPlayers = []; mpMyId = (res && res.id != null) ? res.id : null;
        friendsPanel.style.display = 'none';
      }));
      el.querySelectorAll('[data-invite]').forEach(b => b.addEventListener('click', async () => {
        await window.electronAPI.frInvite(b.dataset.invite);
        b.textContent = '已邀请'; b.disabled = true;
        setTimeout(() => { b.textContent = '邀请'; b.disabled = false; }, 2000);
      }));
    }

    function renderRequests() {
      const el = document.getElementById('frRequests');
      if (!el) return;
      if (!frRequests.length) { el.innerHTML = ''; return; }
      el.innerHTML = frRequests.map(r => `
        <div class="mp-player-item" style="display:flex;justify-content:space-between;align-items:center;background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);margin:4px 0;padding:8px 10px;border-radius:6px;">
          <span style="font-size:13px;">${r.fromName || r.from} 请求加你为好友</span>
          <span>
            <button class="mp-action-btn" data-accept="${r.from}" style="padding:4px 10px;font-size:12px;">接受</button>
            <button class="mp-action-btn" data-reject="${r.from}" style="padding:4px 10px;font-size:12px;margin-left:4px;background:rgba(255,255,255,0.08);">拒绝</button>
          </span>
        </div>`).join('');
      el.querySelectorAll('[data-accept]').forEach(b => b.addEventListener('click', async () => {
        await window.electronAPI.frAccept(b.dataset.accept);
        frRequests = frRequests.filter(x => x.from !== b.dataset.accept);
        renderRequests(); refreshFriends();
      }));
      el.querySelectorAll('[data-reject]').forEach(b => b.addEventListener('click', async () => {
        await window.electronAPI.frReject(b.dataset.reject);
        frRequests = frRequests.filter(x => x.from !== b.dataset.reject);
        renderRequests();
      }));
    }

    let frAuthMode = 'register';
    function applyAuthTab() {
      const isReg = frAuthMode === 'register';
      const rT = document.getElementById('frTabRegister'), lT = document.getElementById('frTabLogin');
      if (rT) rT.style.opacity = isReg ? '1' : '0.5';
      if (lT) lT.style.opacity = isReg ? '0.5' : '1';
      const p2 = document.getElementById('frAuthPass2');
      if (p2) p2.style.display = isReg ? 'block' : 'none';
      const sub = document.getElementById('frAuthSubmit');
      if (sub) sub.textContent = isReg ? '注册' : '登陆';
    }
    function showAuthModal(mode, errMsg) {
      frAuthMode = mode || 'register';
      const modal = document.getElementById('frOnboardModal');
      const errEl = document.getElementById('frAuthError');
      if (errEl) { errEl.textContent = errMsg || ''; errEl.style.display = errMsg ? 'block' : 'none'; }
      const n = document.getElementById('frAuthName'); if (n) n.value = '';
      const p = document.getElementById('frAuthPass'); if (p) p.value = '';
      const p2 = document.getElementById('frAuthPass2'); if (p2) p2.value = '';
      applyAuthTab();
      if (modal) modal.style.display = 'flex';
    }
    (function () {
      const rT = document.getElementById('frTabRegister'), lT = document.getElementById('frTabLogin');
      if (rT) rT.addEventListener('click', () => { frAuthMode = 'register'; applyAuthTab(); });
      if (lT) lT.addEventListener('click', () => { frAuthMode = 'login'; applyAuthTab(); });
      const sub = document.getElementById('frAuthSubmit');
      if (sub) sub.addEventListener('click', async () => {
        const name = (document.getElementById('frAuthName').value || '').trim();
        const password = document.getElementById('frAuthPass').value || '';
        const errEl = document.getElementById('frAuthError');
        const showErr = (t) => { if (errEl) { errEl.textContent = t; errEl.style.display = 'block'; } };
        if (!name) return showErr('请输入昵称');
        if (password.length < 4) return showErr('密码至少 4 位');
        if (frAuthMode === 'register') {
          if (document.getElementById('frAuthPass2').value !== password) return showErr('两次密码不一致');
          if (errEl) errEl.style.display = 'none';
          await window.electronAPI.frRegister(name, password);
        } else {
          if (errEl) errEl.style.display = 'none';
          await window.electronAPI.frLogin(name, password);
        }
        // 结果由 onFrMessage 的 identity-registered（成功）/ auth-error（失败）回传
      });
    })();

    function setRelayStatus(state) {
      var dot = document.getElementById('relayStatusDot');
      var txt = document.getElementById('relayStatusText');
      if (!dot || !txt) return;
      if (state === 'connected') { dot.style.background = '#22c55e'; txt.textContent = '已连接'; txt.style.color = '#22c55e'; }
      else if (state === 'disconnected') { dot.style.background = '#ef4444'; txt.textContent = '未连接'; txt.style.color = '#ef4444'; }
      else { dot.style.background = '#f59e0b'; txt.textContent = '连接中'; txt.style.color = '#f59e0b'; }
    }
    async function frInit() {
      if (!window.electronAPI || !window.electronAPI.frGetProfile) return;
      setRelayStatus('connecting');
      frProfile = await window.electronAPI.frGetProfile();
      setupFrHandlers();
      // 每秒检测一次连接状态，更新指示灯
      var _lastRelayStatus = '';
      setInterval(async () => {
        if (!window.electronAPI || !window.electronAPI.frIsConnected) return;
        try {
          const connected = await window.electronAPI.frIsConnected();
          const s = connected ? 'connected' : 'disconnected';
          if (s !== _lastRelayStatus) { _lastRelayStatus = s; setRelayStatus(s); }
        } catch(e) {}
      }, 1000);
      if (!frProfile || !frProfile.code) {
        showAuthModal('login');
        return;
      }
      prefillNames(frProfile.name);
      await window.electronAPI.frConnect();  // 凭本地 code 免密重连
    }

    // 初始化
    renderSidebar();
    frInit();

    // ===== 启动动画 =====
    (function() {
      const splash = document.getElementById('splashScreen');
      // 非首次加载（从游戏返回）直接跳过动画
      if (window.electronAPI && !window.electronAPI.isFirstLoad()) {
        splash.remove();
        return;
      }
      const bar = document.getElementById('splashBar');
      const particles = document.getElementById('splashParticles');

      // 粒子效果
      for (let i = 0; i < 40; i++) {
        const p = document.createElement('div');
        p.className = 'splash-particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.top = Math.random() * 100 + '%';
        p.style.animationDelay = (Math.random() * 4) + 's';
        p.style.animationDuration = (3 + Math.random() * 4) + 's';
        p.style.width = p.style.height = (1 + Math.random() * 3) + 'px';
        particles.appendChild(p);
      }

      // 进度条动画（约4秒完成）
      let progress = 0;
      const interval = setInterval(() => {
        progress += Math.random() * 6 + 2;
        if (progress >= 100) {
          progress = 100;
          bar.style.width = '100%';
          clearInterval(interval);
          // 完成，停留后淡出
          setTimeout(() => {
            splash.classList.add('splash-exit');
            setTimeout(() => splash.remove(), 800);
          }, 500);
        } else {
          bar.style.width = progress + '%';
        }
      }, 150);
    })();
  </script>
