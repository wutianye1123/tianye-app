<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>废品机械师</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #1a1a2e; font-family: 'Microsoft YaHei', sans-serif; color: #eee; user-select: none; cursor: none; }
canvas { display: block; cursor: none; }
body.show-cursor, body.show-cursor canvas { cursor: default; }

#toolbar {
  position: fixed; top: 0; left: 0; right: 0; height: 48px;
  background: rgba(20,20,40,0.92); display: flex; align-items: center;
  padding: 0 12px; gap: 6px; z-index: 10; border-bottom: 1px solid #333;
}
.tool-btn, .part-btn, .side-btn, .cat-tab { outline: none; }
.tool-btn:focus, .part-btn:focus, .side-btn:focus, .cat-tab:focus { outline: none; }
  padding: 6px 16px; border: 1px solid #555; border-radius: 6px;
  background: rgba(50,50,80,0.7); color: #ccc; cursor: pointer;
  font-size: 13px; transition: all 0.15s;
}
.tool-btn:hover { background: rgba(80,80,120,0.8); color: #fff; }
.tool-btn.active { background: rgba(100,140,255,0.5); border-color: #6688ff; color: #fff; }
#fps { margin-left: auto; font-size: 12px; color: #888; }
#mode-label { font-size: 12px; color: #88aaff; margin-right: 8px; }

#sidebar {
  position: fixed; top: 48px; left: 0; width: 148px; bottom: 32px;
  background: rgba(20,20,40,0.92); z-index: 10; padding: 6px;
  display: flex; flex-direction: column; gap: 4px; overflow-y: auto;
  border-right: 1px solid #333;
}
#cat-tabs {
  display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 4px;
}
.cat-tab {
  padding: 3px 8px; border: 1px solid #444; border-radius: 4px;
  background: rgba(50,50,80,0.5); color: #999; cursor: pointer;
  font-size: 11px; transition: all 0.15s;
}
.cat-tab:hover { background: rgba(80,80,120,0.6); color: #fff; }
.cat-tab.active { background: rgba(100,140,255,0.5); border-color: #6688ff; color: #fff; }
#part-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
}
.part-btn {
  height: 54px; border: 1px solid #444; border-radius: 6px;
  background: rgba(50,50,80,0.5); cursor: pointer; display: flex;
  flex-direction: column; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.part-btn:hover { background: rgba(80,80,120,0.6); }
.part-btn.active { background: rgba(100,140,255,0.4); border-color: #6688ff; }
.part-btn canvas { width: 32px; height: 28px; pointer-events: none; }
.part-btn span { font-size: 10px; color: #aaa; margin-top: 2px; }

.side-sep { height: 1px; background: #444; margin: 4px 0; }
.side-btn {
  width: 60px; height: 32px; border: 1px solid #444; border-radius: 6px;
  background: rgba(50,50,80,0.5); cursor: pointer; color: #aaa;
  font-size: 11px; transition: all 0.15s; display: flex;
  align-items: center; justify-content: center;
}
.side-btn:hover { background: rgba(80,80,120,0.6); color: #fff; }

#helpbar {
  position: fixed; bottom: 0; left: 0; right: 0; height: 32px;
  background: rgba(20,20,40,0.92); display: flex; align-items: center;
  padding: 0 12px; gap: 16px; z-index: 10; font-size: 11px; color: #777;
  border-top: 1px solid #333;
}
#helpbar kbd { background: #333; padding: 1px 5px; border-radius: 3px; color: #aaa; font-size: 10px; }

#notification {
  position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
  background: rgba(40,80,200,0.85); padding: 8px 20px; border-radius: 8px;
  font-size: 13px; z-index: 20; display: none; pointer-events: none;
  animation: fadeInOut 2s ease;
}
@keyframes fadeInOut { 0%{opacity:0;transform:translateX(-50%) translateY(-10px)} 15%{opacity:1;transform:translateX(-50%) translateY(0)} 80%{opacity:1} 100%{opacity:0} }

#drive-hud {
  position: fixed; bottom: 40px; right: 12px; z-index: 10;
  background: rgba(20,20,40,0.85); padding: 10px 16px; border-radius: 8px;
  font-size: 12px; display: none; border: 1px solid #444;
}
#drive-hud div { margin: 3px 0; }
#drive-hud .val { color: #88ccff; }

#crosshair {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: 20px; height: 20px; z-index: 15; display: none; pointer-events: none;
}
#crosshair::before, #crosshair::after {
  content: ''; position: absolute; background: rgba(255,255,255,0.6);
}
#crosshair::before { width: 2px; height: 20px; left: 9px; top: 0; }
#crosshair::after { width: 20px; height: 2px; top: 9px; left: 0; }
</style>
</head>
<body>

<div id="toolbar">
  <span id="mode-label">建造模式</span>
  <button class="tool-btn active" data-tool="build">1 建造</button>
  <button class="tool-btn" data-tool="weld">2 焊枪</button>
  <button class="tool-btn" data-tool="connect">3 连接</button>
  <button class="tool-btn" data-tool="paint">4 涂色</button>
  <button class="tool-btn" data-tool="erase">5 删除</button>
  <button class="tool-btn" data-tool="lift">6 升降台</button>
  <button class="tool-btn" data-tool="drive">7 驾驶</button>
  <span id="fps">0 FPS</span>
</div>

<div id="sidebar">
  <div id="cat-tabs">
    <div class="cat-tab active" data-cat="block">基础</div>
    <div class="cat-tab" data-cat="power">动力</div>
    <div class="cat-tab" data-cat="control">控制</div>
    <div class="cat-tab" data-cat="movement">运动</div>
    <div class="cat-tab" data-cat="function">功能</div>
  </div>
  <div id="part-grid"></div>
  <div class="side-sep"></div>
  <button class="side-btn" id="btn-save">F5 保存</button>
  <button class="side-btn" id="btn-load">F6 读取</button>
  <button class="side-btn" id="btn-reset">F7 重置</button>
  <button class="side-btn" id="btn-clear">F8 清空</button>
</div>

<div id="helpbar">
  <span><kbd>WASD</kbd> 行走/驾驶</span>
  <span><kbd>鼠标</kbd> 转视角</span>
  <span><kbd>左键/回车</kbd> 放置</span>
  <span><kbd>1-7</kbd> 切工具</span>
  <span><kbd>↑↓</kbd> 选零件</span>
  <span><kbd>←→</kbd> 切分类</span>
  <span><kbd>Esc</kbd> 鼠标</span>
  <span><kbd>F5-8</kbd> 存/取/复位/清</span>
  <span><kbd>F2</kbd> 返回</span>
</div>

<div id="notification"></div>
<div id="attach-modal" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(20,20,40,0.95);padding:20px 30px;border-radius:12px;z-index:100;border:2px solid #4488ff;text-align:center;min-width:280px;">
  <div id="attach-msg" style="font-size:14px;margin-bottom:16px;color:#ccc;"></div>
  <button id="attach-yes" style="padding:8px 24px;margin:0 8px;background:#3388cc;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;">确定安装</button>
  <button id="attach-no" style="padding:8px 24px;margin:0 8px;background:#555;color:#ccc;border:none;border-radius:6px;cursor:pointer;font-size:13px;">取消</button>
</div>
<div id="drive-hud">
  <div>速度: <span class="val" id="hud-speed">0</span></div>
  <div>高度: <span class="val" id="hud-alt">0</span></div>
  <div>悬挂: <span class="val" id="hud-ride">0</span></div>
  <div><kbd>Space</kbd> 推进 <kbd>PgUp/Dn</kbd> 悬挂高度</div>
</div>
<div id="crosshair"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>if(typeof THREE==='undefined')document.write('<script src="./three.min.js"><\/script>')</script>
<script>
// ============ CONFIG ============
const CFG = {
  grid: 1.0,
  worldSize: 200,
  gravity: -35,
  maxVel: 50,
  friction: 0.95,
  bearingSpeed: 4.0,
  enginePower: 20,
  gasEngineTorque: [100, 200, 300, 400, 500],
  gasEngineRPM: 3.0,
  electricEngineTorque: 200,
  electricEngineRPM: [1, 2, 3, 4, 5],
  thrusterPower: 40,
  liftCoeff: 0.015,
  wheelRadius: 0.45,
  brakeForce: 0.92,
  turnRate: 2.5,
  camOrbitDist: 18,
  camFollowDist: 14,
  camFollowH: 7,
  camSmooth: 0.08,
  playerEyeH: 1.6,
  playerSpeed: 5.0,
  playerTurnSpeed: 0.003,
  // Realistic physics params
  airDrag: 0.008,         // quadratic air resistance coefficient
  rollingResist: 0.015,   // tire rolling resistance
  lateralGrip: 0.85,      // tire lateral grip (0-1, higher = more grip, lower = drift)
  bounceRestitution: 0.3, // bounce energy retention on collision
  angularDamping: 0.92,   // angular velocity damping per frame
  subSteps: 3             // physics substeps per frame for stability
};

// Material definitions for blocks
const MATERIAL_DEFS = {
  wood:     { color: 0xc4a366, durability: 50,  friction: 0.6, buoyancy: 0.5,  flammable: true,  mass: 0.8, name: '木' },
  metal:    { color: 0x8899aa, durability: 200, friction: 0.4, buoyancy: -0.5, flammable: false, mass: 2.0, name: '金属' },
  cardboard:{ color: 0xd4b896, durability: 10,  friction: 0.5, buoyancy: 0.3,  flammable: true,  mass: 0.3, name: '纸板' },
  glass:    { color: 0xaaddff, durability: 20,  friction: 0.3, buoyancy: -0.3, flammable: false, mass: 1.5, transparent: true, name: '玻璃' },
  concrete: { color: 0x888888, durability: 500, friction: 0.7, buoyancy: -1.0, flammable: false, mass: 3.0, name: '混凝土' },
};

const PART_DEFS = {
  // Blocks (per material)
  block_wood:     { w:1, h:1, d:1, color:0xc4a366, mass:0.8,  name:'木方块',    category:'block', material:'wood',     durability:50,  friction:0.6, buoyancy:0.5,  flammable:true },
  block_metal:    { w:1, h:1, d:1, color:0x8899aa, mass:2.0,  name:'金属方块',  category:'block', material:'metal',    durability:200, friction:0.4, buoyancy:-0.5, flammable:false },
  block_cardboard:{ w:1, h:1, d:1, color:0xd4b896, mass:0.3,  name:'纸板方块',  category:'block', material:'cardboard',durability:10,  friction:0.5, buoyancy:0.3,  flammable:true },
  block_glass:    { w:1, h:1, d:1, color:0xaaddff, mass:1.5,  name:'玻璃方块',  category:'block', material:'glass',    durability:20,  friction:0.3, buoyancy:-0.3, flammable:false, transparent:true },
  block_concrete: { w:1, h:1, d:1, color:0x888888, mass:3.0,  name:'混凝土方块',category:'block', material:'concrete', durability:500, friction:0.7, buoyancy:-1.0, flammable:false },
  // Power
  gas_engine:     { w:1, h:0.8, d:1, color:0xcc3333, mass:2,   name:'燃气引擎', category:'power', durability:100, friction:0.5, buoyancy:-0.3, flammable:false, engineType:'gas',     fixedSpeed:3.0, powerGears:[1,2,3,4,5], fuelType:'gas' },
  electric_engine:{ w:0.9, h:0.7, d:0.9, color:0x33aacc, mass:1.5,name:'电动引擎',category:'power', durability:80,  friction:0.5, buoyancy:-0.2, flammable:false, engineType:'electric', fixedPower:20,  speedGears:[1,2,3,4,5], fuelType:'battery' },
  thruster:{ r:0.3, h:0.5,    color:0xff6600, mass:1.0, name:'推进器',category:'power', durability:80,  friction:0.3, buoyancy:0,    flammable:false },
  // Control
  driver_seat:    { w:0.8, h:0.6, d:0.8, color:0x3366cc, mass:0.5, name:'驾驶座', category:'control', durability:60, friction:0.5, buoyancy:0.2, flammable:true },
  passenger_seat: { w:0.8, h:0.5, d:0.8, color:0x33aa66, mass:0.4, name:'乘客座', category:'control', durability:50, friction:0.5, buoyancy:0.2, flammable:true },
  switch:  { w:0.4, h:0.4, d:0.2, color:0xffcc00, mass:0.2, name:'开关', category:'control', durability:40, friction:0.5, buoyancy:0,   flammable:false },
  logic_gate: { w:0.6, h:0.5, d:0.3, color:0x8844cc, mass:0.3, name:'逻辑门', category:'control', durability:50, friction:0.5, buoyancy:0, flammable:false },
  timer:    { w:0.5, h:0.5, d:0.3, color:0x44aacc, mass:0.3, name:'计时器', category:'control', durability:40, friction:0.5, buoyancy:0, flammable:false },
  sensor:   { w:0.4, h:0.4, d:0.5, color:0xcc44cc, mass:0.3, name:'传感器', category:'control', durability:40, friction:0.5, buoyancy:0, flammable:false },
  controller: { w:0.6, h:0.5, d:0.4, color:0x44cc88, mass:0.4, name:'控制器', category:'control', durability:50, friction:0.5, buoyancy:0, flammable:false },
  // Movement
  wheel:   { r:0.45, w:0.35,    color:0x333333, mass:0.5, name:'轮子', category:'movement', durability:120, friction:0.6, buoyancy:-0.2, flammable:false, lateralFriction:0.8, rollingFriction:0.02 },
  bearing: { r:0.3, h:0.2,      color:0xffaa00, mass:0.3, name:'轴承', category:'movement', durability:150, friction:0.3, buoyancy:0,    flammable:false, maxRotationSpeed:4.0, maxTorque:50 },
  piston:  { r:0.2, h:1.0,      color:0x66cc33, mass:0.8, name:'活塞', category:'movement', durability:100, friction:0.4, buoyancy:0,    flammable:false },
  sport_suspension: { w:0.4, h:0.6, d:0.4, color:0xcc4444, mass:0.6, name:'运动悬挂', category:'movement', durability:80, friction:0.5, buoyancy:0, flammable:false, springK:800, damping:0.4, maxTravel:0.3 },
  offroad_suspension:{ w:0.5, h:0.8, d:0.5, color:0x44aa44, mass:0.8, name:'越野悬挂', category:'movement', durability:120, friction:0.5, buoyancy:0, flammable:false, springK:400, damping:0.2, maxTravel:0.6 },
  // Function
  wing:    { w:3, h:0.1, d:1,   color:0xaabbcc, mass:0.8, name:'机翼', category:'function', durability:30,  friction:0.2, buoyancy:0.1, flammable:true },
};
// Backward compat: 'block' → 'block_wood', 'seat' → 'driver_seat'
PART_DEFS.block = PART_DEFS.block_wood;
PART_DEFS.seat = PART_DEFS.driver_seat;
PART_DEFS.engine = PART_DEFS.gas_engine;

// Part categories for sidebar UI
const PART_CATEGORIES = [
  { id: 'block',     name: '基础',   parts: ['block_wood','block_metal','block_cardboard','block_glass','block_concrete'] },
  { id: 'power',     name: '动力',   parts: ['gas_engine','electric_engine','thruster'] },
  { id: 'control',   name: '控制',   parts: ['driver_seat','passenger_seat','switch','logic_gate','timer','sensor','controller'] },
  { id: 'movement',  name: '运动',   parts: ['wheel','bearing','piston','sport_suspension','offroad_suspension'] },
  { id: 'function',  name: '功能',   parts: ['wing'] },
];

// Helper: resolve part definition (handles block variants)
function getPartDef(type) {
  return PART_DEFS[type] || PART_DEFS.block_wood;
}

// Helper: check if a part type is a block variant
function isBlockType(type) {
  return type === 'block' || type.startsWith('block_');
}

// ============ STATE ============
const S = {
  mode: 'build',
  selectedPart: 'block_wood',
  activeCategory: 'block',
  isDriving: false,
  activeSeat: null,
  activeConstruction: null,
  constructions: [],
  connections: [],
  parts: [],
  nextId: 1,
  nextCId: 1,
  ghostMesh: null,
  ghostRot: 0,
  buildLayer: 0,
  connectSource: null,
  weldSource: null,
  lift: null,  // { mesh, platformY, constructionId }
  hoverPart: null,
  selectedColor: 0x8899aa,
  paintColors: [0x8899aa,0xcc3333,0x3366cc,0x33aa55,0xffaa00,0xff6600,0xaa44ff,0xffffff,0x333333],
  paintIdx: 0,
  keys: {},
  mouse: { x:0, y:0, down:false, right:false, dx:0, dy:0, dragged:false },
  cam: { theta: 0.5, phi: 0.8, dist: CFG.camOrbitDist, target: new THREE.Vector3(0,0,0) },
  playerPos: new THREE.Vector3(0, CFG.playerEyeH, 5),
  playerYaw: Math.PI,
  playerPitch: 0,
  playerBody: null
};

let scene, camera, renderer, ground, gridHelper, raycaster, mouseVec;
let lastTime = performance.now(), frameCount = 0, fpsTime = 0;
const clock = new THREE.Clock();

// ============ INIT ============
function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.Fog(0x87ceeb, 120, 300);

  camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
  camera.position.set(15, 15, 15);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  // Lights
  const amb = new THREE.AmbientLight(0x667788, 0.7);
  scene.add(amb);
  const sun = new THREE.DirectionalLight(0xffffff, 1.0);
  sun.position.set(30, 50, 20);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -50; sun.shadow.camera.right = 50;
  sun.shadow.camera.top = 50; sun.shadow.camera.bottom = -50;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 120;
  scene.add(sun);
  const hemi = new THREE.HemisphereLight(0x88aaff, 0x445533, 0.4);
  scene.add(hemi);

  // Ground - large procedural terrain
  const gSize = 200, gSeg = 120;
  const gGeo = new THREE.PlaneGeometry(gSize, gSize, gSeg, gSeg);
  gGeo.rotateX(-Math.PI / 2);
  const positions = gGeo.attributes.position;
  const colors = new Float32Array(positions.count * 3);
  const grassC = [0x55/255, 0x66/255, 0x44/255];
  const dirtC  = [0x6b/255, 0x4c/255, 0x2a/255];
  const sandC  = [0xc2/255, 0xb2/255, 0x80/255];
  const rockC  = [0x77/255, 0x77/255, 0x66/255];
  for (let i = 0; i < positions.count; i++) {
    const x = positions.getX(i), z = positions.getZ(i);
    positions.setY(i, getTerrainHeight(x, z));
    const biome = Math.sin(x * 0.03) * Math.cos(z * 0.04) + Math.sin(x * 0.07 + z * 0.06) * 0.5;
    let c = grassC;
    if (biome > 0.8) c = sandC;
    else if (biome < -0.6) c = rockC;
    else if (biome < -0.2) c = dirtC;
    const n = Math.sin(x * 2.1 + z * 1.7) * 0.03;
    colors[i*3] = Math.max(0, Math.min(1, c[0]+n));
    colors[i*3+1] = Math.max(0, Math.min(1, c[1]+n));
    colors[i*3+2] = Math.max(0, Math.min(1, c[2]+n));
  }
  gGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  gGeo.computeVertexNormals();
  const gMat = new THREE.MeshLambertMaterial({ vertexColors: true });
  ground = new THREE.Mesh(gGeo, gMat);
  ground.receiveShadow = true;
  scene.add(ground);

  // Grid
  gridHelper = new THREE.GridHelper(CFG.worldSize, CFG.worldSize, 0x445544, 0x3a4a3a);
  gridHelper.position.y = 0.01;
  scene.add(gridHelper);

  raycaster = new THREE.Raycaster();
  mouseVec = new THREE.Vector2();

  // Ghost
  S.ghostMesh = createPartMesh(S.selectedPart, true);
  S.ghostMesh.visible = false;
  scene.add(S.ghostMesh);

  // Player body (visible in first-person as shadow/below view)
  const bodyGroup = new THREE.Group();
  const torsoGeo = new THREE.CylinderGeometry(0.2, 0.22, 0.9, 8);
  const bodyMat = new THREE.MeshLambertMaterial({ color: 0x445566 });
  const torso = new THREE.Mesh(torsoGeo, bodyMat);
  torso.position.y = -0.65;
  torso.castShadow = true;
  bodyGroup.add(torso);
  const headGeo = new THREE.SphereGeometry(0.15, 8, 6);
  const headMat = new THREE.MeshLambertMaterial({ color: 0xddbb88 });
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.y = -0.05;
  head.castShadow = true;
  bodyGroup.add(head);
  bodyGroup.position.copy(S.playerPos);
  scene.add(bodyGroup);
  S.playerBody = bodyGroup;

  setupInput();
  setupUI();
  loadGame();

  animate();
}

// ============ PART MESH FACTORY ============
function createPartMesh(type, ghost) {
  const def = getPartDef(type);
  const opacity = ghost ? 0.4 : 1.0;
  let group = new THREE.Group();

  if (isBlockType(type)) {
    const geo = new THREE.BoxGeometry(def.w, def.h, def.d);
    const isGlass = def.transparent;
    const mat = new THREE.MeshLambertMaterial({
      color: def.color, transparent: ghost || isGlass,
      opacity: ghost ? 0.4 : (isGlass ? 0.55 : 1.0)
    });
    const m = new THREE.Mesh(geo, mat);
    m.castShadow = !ghost && !isGlass; m.receiveShadow = !ghost;
    group.add(m);
    if (!ghost) {
      const matKey = def.material || 'wood';
      const edgeColor = matKey === 'metal' ? 0x99aacc : matKey === 'wood' ? 0x8b7355 :
                        matKey === 'glass' ? 0x88ccff : matKey === 'cardboard' ? 0xb09070 : 0x666666;
      const edge = new THREE.EdgesGeometry(geo);
      const line = new THREE.LineSegments(edge, new THREE.LineBasicMaterial({ color: edgeColor }));
      group.add(line);
      // Wood: grain lines
      if (matKey === 'wood') {

// ============ GRID & PLACEMENT ============
function snapToGrid(pos) {
  const g = CFG.grid;
  return new THREE.Vector3(
    Math.round(pos.x / g) * g,
    Math.round(pos.y / g) * g,
    Math.round(pos.z / g) * g
  );
}

function getPartGridKey(x, y, z) {
  return `${Math.round(x)},${Math.round(y)},${Math.round(z)}`;
}

function getPartAtGrid(gx, gy, gz) {
  return S.parts.find(p => {
    const k = getPartGridKey(p.gridPos.x, p.gridPos.y, p.gridPos.z);
    return k === getPartGridKey(gx, gy, gz);
  });
}

function getAdjacentGrids(pos) {
  const r = [];
  for (let dx = -1; dx <= 1; dx++) {
    for (let dy = -1; dy <= 1; dy++) {
      for (let dz = -1; dz <= 1; dz++) {
        if (dx === 0 && dy === 0 && dz === 0) continue;
        if (Math.abs(dx) + Math.abs(dy) + Math.abs(dz) > 1) continue;
        const p = getPartAtGrid(pos.x + dx, pos.y + dy, pos.z + dz);
        if (p) r.push(p);
      }
    }
  }
  return r;
}

function getGroundIntersect() {
  raycaster.setFromCamera(mouseVec, camera);
  const hits = raycaster.intersectObject(ground, false);
  if (hits.length > 0) return hits[0].point;
  const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const pt = new THREE.Vector3();
  raycaster.ray.intersectPlane(plane, pt);
  return pt;
}

function getPartIntersect() {
  raycaster.setFromCamera(mouseVec, camera);
  const meshes = [];
  S.parts.forEach(p => {
    p.mesh.traverse(c => { if (c.isMesh) meshes.push(c); });
  });
  const hits = raycaster.intersectObjects(meshes, false);
  if (hits.length > 0) {
    let obj = hits[0].object;
    while (obj && !obj.userData.partId) obj = obj.parent;
    if (obj) return S.parts.find(p => p.id === obj.userData.partId);
  }
  return null;
}

// ============ CONSTRUCTION SYSTEM ============
function createConstruction(part) {
  const c = {
    id: S.nextCId++,
    parts: [part.id],
    position: new THREE.Vector3(part.gridPos.x, part.gridPos.y, part.gridPos.z),
    velocity: new THREE.Vector3(0, 0, 0),
    rotation: 0,
    angularVel: 0,
    isGrounded: true,
    group: new THREE.Group()
  };
  part.mesh.position.set(0, 0, 0);
  c.group.position.copy(c.position);
  c.group.rotation.y = 0;
  c.group.add(part.mesh);
  part.mesh.userData.localPos = new THREE.Vector3(0, 0, 0);
  scene.add(c.group);
  S.constructions.push(c);
  part.constructionId = c.id;
  return c;
}

function addToConstruction(part, c) {
  part.constructionId = c.id;
  c.parts.push(part.id);
  const refPart = S.parts.find(p => p.id === c.parts[0]);
  const refPos = refPart ? new THREE.Vector3(refPart.gridPos.x, refPart.gridPos.y, refPart.gridPos.z) : c.position.clone();
  let localPos = new THREE.Vector3(
    part.gridPos.x - refPos.x,
    part.gridPos.y - refPos.y,
    part.gridPos.z - refPos.z
  );
  // If wheel placed near a suspension, snap below it
  if (part.type === 'wheel') {
    const suspTypes = ['sport_suspension', 'offroad_suspension'];
    let bestSusp = null, bestDist = 2.5;
    c.parts.forEach(pid => {
      const p = S.parts.find(x => x.id === pid);
      if (!p || !suspTypes.includes(p.type)) return;
      const sLocal = p.mesh.userData.localPos || new THREE.Vector3();
      const dx = localPos.x - sLocal.x, dz = localPos.z - sLocal.z;
      const hDist = Math.sqrt(dx * dx + dz * dz);
      if (hDist < bestDist) { bestDist = hDist; bestSusp = p; }
    });
    if (bestSusp) {
      const sLocal = bestSusp.mesh.userData.localPos || new THREE.Vector3();
      const sDef = getPartDef(bestSusp.type);
      const suspHalfH = (sDef.h || 0.6) / 2;
      const wheelR = getPartDef(part.type).r || 0.45;
      localPos.x = sLocal.x;
      localPos.z = sLocal.z;
      localPos.y = sLocal.y - suspHalfH - wheelR;
      part._snapToSusp = bestSusp.id;
    }
  }
  part.mesh.position.copy(localPos);
  part.mesh.userData.localPos = localPos.clone();
  c.group.add(part.mesh);
}

function mergeConstructions(c1, c2) {
  // merge c2 into c1, using grid positions for offset
  const ref1 = S.parts.find(p => p.id === c1.parts[0]);
  const ref2 = S.parts.find(p => p.id === c2.parts[0]);
  const r1 = ref1 ? new THREE.Vector3(ref1.gridPos.x, ref1.gridPos.y, ref1.gridPos.z) : c1.position.clone();
  const r2 = ref2 ? new THREE.Vector3(ref2.gridPos.x, ref2.gridPos.y, ref2.gridPos.z) : c2.position.clone();
  const offset = new THREE.Vector3(r2.x - r1.x, r2.y - r1.y, r2.z - r1.z);
  const rotDiff = c2.rotation - c1.rotation;

  c2.parts.forEach(pid => {
    const p = S.parts.find(x => x.id === pid);
    if (!p) return;
    p.constructionId = c1.id;
    const oldLocal = p.mesh.userData.localPos || new THREE.Vector3();
    const newLocal = new THREE.Vector3(
      oldLocal.x * Math.cos(rotDiff) - oldLocal.z * Math.sin(rotDiff) + offset.x,
      oldLocal.y + offset.y,
      oldLocal.x * Math.sin(rotDiff) + oldLocal.z * Math.cos(rotDiff) + offset.z
    );
    p.mesh.position.copy(newLocal);
    p.mesh.userData.localPos = newLocal.clone();
    c2.group.remove(p.mesh);
    c1.group.add(p.mesh);
    c1.parts.push(pid);
  });

  c2.parts = [];
  scene.remove(c2.group);
  S.constructions = S.constructions.filter(c => c.id !== c2.id);
}

function findConstruction(id) {
  return S.constructions.find(c => c.id === id);
}

function getPartConstruction(part) {
  return findConstruction(part.constructionId);
}

// ============ PART PLACEMENT ============
function showAttachConfirm(msg) {
  return new Promise(resolve => {
    const modal = document.getElementById('attach-modal');
    const msgEl = document.getElementById('attach-msg');
    const yesBtn = document.getElementById('attach-yes');
    const noBtn = document.getElementById('attach-no');
    msgEl.textContent = msg;
    modal.style.display = 'block';
    document.body.classList.add('show-cursor');
    const cleanup = (val) => {
      modal.style.display = 'none';
      document.body.classList.remove('show-cursor');
      yesBtn.removeEventListener('click', onYes);
      noBtn.removeEventListener('click', onNo);
      window.removeEventListener('keydown', onKey);
      resolve(val);
    };
    const onYes = () => cleanup(true);
    const onNo = () => cleanup(false);
    const onKey = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); cleanup(true); }
      if (e.key === 'Escape' || e.key === 'n' || e.key === 'N') { e.preventDefault(); cleanup(false); }
    };
    yesBtn.addEventListener('click', onYes);
    noBtn.addEventListener('click', onNo);
    window.addEventListener('keydown', onKey);
  });
}

let _placing = false;
function placePart(gridPos) {
  if (_placing) return;
  if (gridPos.y < 0) return;
  const existing = getPartAtGrid(gridPos.x, gridPos.y, gridPos.z);
  if (existing) return;

  const type = S.selectedPart;
  const def = getPartDef(type);

  // Check adjacent parts before creating the new part
  const adjacent = getAdjacentGrids(gridPos);
  const constructions = new Set();
  adjacent.forEach(a => {
    if (a.constructionId) constructions.add(a.constructionId);
  });

  // If adjacent parts exist, ask for confirmation
  if (adjacent.length > 0) {
    const targetNames = adjacent.map(a => getPartDef(a.type).name);
    const uniqueNames = [...new Set(targetNames)];
    const nameList = uniqueNames.length <= 3 ? uniqueNames.join('、') : uniqueNames.slice(0, 3).join('、') + '等';
    _placing = true;
    showAttachConfirm(`是否将 ${def.name} 安装到 ${nameList} 上？`).then(confirmed => {
      _placing = false;
      if (!confirmed) return;
      doPlacePart(gridPos, type, def);
    });
    return;
  }

  doPlacePart(gridPos, type, def);
}

function doPlacePart(gridPos, type, def) {
  const mesh = createPartMesh(type, false);
  const part = {
    id: S.nextId++,
    type,
    constructionId: 0,
    gridPos: { x: gridPos.x, y: gridPos.y, z: gridPos.z },
    worldPos: { x: gridPos.x, y: gridPos.y, z: gridPos.z },
    rotation: S.ghostRot,
    mesh,
    metadata: {},
    material: def.material || null
  };
  mesh.userData.partId = part.id;
  mesh.rotation.y = S.ghostRot;

  // Determine construction — check lift first
  if (S.lift && gridPos.y >= Math.round(S.lift.platformY) - 1) {
    const liftPos = S.lift.mesh.position;
    const hs = S.lift.platSize / 2;
    if (gridPos.x >= liftPos.x - hs && gridPos.x <= liftPos.x + hs &&
        gridPos.z >= liftPos.z - hs && gridPos.z <= liftPos.z + hs) {
      const liftC = findConstruction(S.lift.constructionId);
      if (liftC) {
        addToConstruction(part, liftC);
        S.parts.push(part);
        return part;
      }
    }
  }

  const adjacent = getAdjacentGrids(gridPos);
  const constructions = new Set();
  adjacent.forEach(a => {
    if (a.constructionId) constructions.add(a.constructionId);
  });

  if (constructions.size === 0) {
    createConstruction(part);
  } else {
    const cids = [...constructions];
    const mainC = findConstruction(cids[0]);
    addToConstruction(part, mainC);
    for (let i = 1; i < cids.length; i++) {
      const other = findConstruction(cids[i]);
      if (other) mergeConstructions(mainC, other);
    }
  }

  S.parts.push(part);
  return part;
}

function removePart(part) {
  // Remove connections
  S.connections = S.connections.filter(c => {
    if (c.sourceId === part.id || c.targetId === part.id) {
      if (c.visualLine) scene.remove(c.visualLine);
      return false;
    }
    return true;
  });

  const c = getPartConstruction(part);
  if (c) {
    c.parts = c.parts.filter(id => id !== part.id);
    c.group.remove(part.mesh);
    if (c.parts.length === 0) {
      scene.remove(c.group);
      S.constructions = S.constructions.filter(x => x.id !== c.id);
    }
  }
  scene.remove(part.mesh);
  S.parts = S.parts.filter(p => p.id !== part.id);
}

  { from: 'gas_engine', to: 'wheel', type: 'power' },
  { from: 'electric_engine', to: 'bearing', type: 'power' },
  { from: 'electric_engine', to: 'wheel', type: 'power' },
  { from: 'switch', to: 'bearing', type: 'signal' },
  { from: 'switch', to: 'piston', type: 'signal' },
  { from: 'switch', to: 'thruster', type: 'signal' },

  { from: 'logic_gate', to: 'electric_engine', type: 'signal' },
  { from: 'logic_gate', to: 'logic_gate', type: 'signal' },
  // Timer
  { from: 'switch', to: 'timer', type: 'signal' },
