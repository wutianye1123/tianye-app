<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植物大战僵尸</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="saveMsg"></div>
    <div id="game-container">
        <!-- 游戏标题 -->
        <div id="header">
            <h1>🌻 植物大战僵尸 🧟</h1>
        </div>

        <!-- 游戏信息栏 -->
        <div id="game-info">
            <div class="info-item">
                <span class="label">阳光:</span>
                <span id="sun-count" class="value">50</span>
            </div>
            <div class="info-item">
                <span class="label">波次:</span>
                <span id="wave-count" class="value">1/10</span>
            </div>
            <div class="info-item">
                <span class="label">得分:</span>
                <span id="score" class="value">0</span>
            </div>
        </div>

        <!-- 植物选择栏 -->
        <div id="plant-selector">
            <div class="plant-card selected" data-plant="peashooter" data-cost="100">
                <canvas id="card-peashooter" width="50" height="60"></canvas>
                <span class="cost">100</span>
            </div>
            <div class="plant-card" data-plant="sunflower" data-cost="50">
                <canvas id="card-sunflower" width="50" height="60"></canvas>
                <span class="cost">50</span>
            </div>
            <div class="plant-card" data-plant="wallnut" data-cost="50">
                <canvas id="card-wallnut" width="50" height="60"></canvas>
                <span class="cost">50</span>
            </div>
            <div class="plant-card" data-plant="snowpea" data-cost="175">
                <canvas id="card-snowpea" width="50" height="60"></canvas>
                <span class="cost">175</span>
            </div>
            <div class="plant-card" data-plant="cherrybomb" data-cost="150">
                <canvas id="card-cherrybomb" width="50" height="60"></canvas>
                <span class="cost">150</span>
            </div>
        </div>

        <!-- 游戏画布 -->
        <canvas id="game-canvas" width="900" height="500"></canvas>

        <!-- 游戏覆盖层 -->
        <div id="overlay" class="hidden">
            <div id="overlay-content">
                <h2 id="overlay-title">游戏暂停</h2>
                <p id="overlay-message"></p>
                <button id="overlay-btn">继续</button>
            </div>
        </div>

        <!-- 控制按钮 -->
        <div id="controls">
            <button id="start-btn">开始游戏</button>
            <button id="pause-btn" disabled>暂停</button>
            <button id="restart-btn" disabled>重新开始</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
