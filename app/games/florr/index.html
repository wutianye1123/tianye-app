function drawFlower(f, isLocal){
  const p = f;
  const bodyR = p.r;
  const baseColor = isLocal ? '#46c468' : (f.color||'#46c468');
  const leafColor = isLocal ? '#2f9a4d' : shade(f.color||'#46c468', -45);

  // ---- 环绕的武器花瓣（先画，位于身体下层）----
  const petals = isLocal ? p.slots.filter(s=>s && !s.dead) : (f.petals||[]);
  if (isLocal){
    // orbitRCur 已在 update 中平滑更新
  } else {
    // 远程：按其外推状态平滑插值
    const tgt = (f.r||22) + ORBIT_GAP + (f.ext ? PETAL_EXTEND : 0);
    f.orbitRCur = (f.orbitRCur||tgt) + (tgt - (f.orbitRCur||tgt))*0.2;
  }
  const orbitR = isLocal ? p.orbitRCur : f.orbitRCur;
  const spin = isLocal ? p.spin : (f.rot||0);
  petals.forEach((pe,i)=>{
    const def = PETAL_TYPES[pe.type] || PETAL_TYPES.basic;
    const rar = RARITIES[pe.rarity||0];
    const ang = spin + i*(TAU/Math.max(1,petals.length));
    const recoilK = (isLocal && pe.recoil>0) ? 1-pe.recoil*0.45 : 1;
    const px = p.x + Math.cos(ang)*orbitR*recoilK;
    const py = p.y + Math.sin(ang)*orbitR*recoilK;
    const pr = def.r;
    // 阴影
    ctx.fillStyle='rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.ellipse(px, py+pr*0.55, pr*0.95, pr*0.5, 0,0,TAU); ctx.fill();
    // 本体
    if (pe.type==='heal'){ ctx.shadowColor='#7ee787'; ctx.shadowBlur=14; }
    ctx.fillStyle = def.color;
    ctx.beginPath(); ctx.arc(px,py,pr,0,TAU); ctx.fill();
    ctx.shadowBlur=0;
    ctx.lineWidth=2; ctx.strokeStyle='rgba(0,0,0,0.28)'; ctx.stroke();          // 内描边
    ctx.lineWidth=3.5; ctx.strokeStyle=rar.ring;                                  // 稀有度外环
    ctx.beginPath(); ctx.arc(px,py,pr-1.5,0,TAU); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.35)';                                       // 高光
    ctx.beginPath(); ctx.ellipse(px-pr*0.3, py-pr*0.3, pr*0.3, pr*0.2, -0.6, 0, TAU); ctx.fill();
  });

  // ---- 花朵本体 ----
  ctx.save();
  ctx.translate(p.x, p.y);
  // 地面阴影
  ctx.fillStyle='rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(0, bodyR*0.85, bodyR*1.0, bodyR*0.45, 0,0,TAU); ctx.fill();
  // 绿色叶瓣（让本体像一朵花）—— 缓慢随自转旋转
  const leafN = 6, lspin = (isLocal? p.spin*0.3 : (f.rot||0)*0.3);
  for (let i=0;i<leafN;i++){
    ctx.save(); ctx.rotate(i*(TAU/leafN) + lspin);
    ctx.fillStyle = leafColor;
    ctx.beginPath(); ctx.ellipse(0, -bodyR*0.95, bodyR*0.42, bodyR*0.72, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  // 本体圆
  const flick = (isLocal && p.iframes>0 && Math.floor(p.iframes*16)%2===0);
  ctx.fillStyle = flick ? '#ffffff' : baseColor;
  ctx.beginPath(); ctx.arc(0,0,bodyR,0,TAU); ctx.fill();
  ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,0.28)'; ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.22)';
  ctx.beginPath(); ctx.ellipse(-bodyR*0.3,-bodyR*0.35,bodyR*0.32,bodyR*0.22,-0.6,0,TAU); ctx.fill();
  // 脸
  const eo=bodyR*0.34, ey=-bodyR*0.05;
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-eo,ey,bodyR*0.23,0,TAU); ctx.arc(eo,ey,bodyR*0.23,0,TAU); ctx.fill();
  ctx.fillStyle='#15240f';
  ctx.beginPath(); ctx.arc(-eo+bodyR*0.06,ey,bodyR*0.12,0,TAU); ctx.arc(eo+bodyR*0.06,ey,bodyR*0.12,0,TAU); ctx.fill();
  ctx.strokeStyle='#15240f'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0, bodyR*0.2, bodyR*0.2, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
  ctx.restore();

  // 名牌 + 血条（远程 / 联机）
  if (!isLocal || mpActive){
    const name = isLocal ? (mpMyName+'(你)') : f.name;
    ctx.font='bold 13px sans-serif'; ctx.textAlign='center';
    const tw = ctx.measureText(name).width+12;
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(p.x-tw/2, p.y-bodyR-34, tw, 18);
    ctx.fillStyle = isLocal ? '#7ef092' : '#eaf2e6'; ctx.fillText(name, p.x, p.y-bodyR-20);
    const max = isLocal ? p.maxHp : (f.maxHp||85);
    const hp = isLocal ? p.hp : (f.hp??0);
    const hpf = clamp(hp/max,0,1);
    const w = bodyR*2.2;
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(p.x-w/2, p.y-bodyR-13, w, 5);
    ctx.fillStyle = hpf>0.5?'#5fd36b':hpf>0.25?'#ffcf4d':'#e8463a';
    ctx.fillRect(p.x-w/2, p.y-bodyR-13, w*hpf, 5);
  }
}

function drawMinimap(){
  const W=150,H=150;
  miniCtx.clearRect(0,0,W,H);
  miniCtx.fillStyle='rgba(0,0,0,0.5)'; miniCtx.fillRect(0,0,W,H);
  const sc = W/WORLD;
  // 区域
  miniCtx.strokeStyle='rgba(255,90,90,0.5)'; miniCtx.lineWidth=1;
  miniCtx.strokeRect(1,1,W-2,H-2);
  // 怪物
  miniCtx.fillStyle='rgba(224,85,85,0.8)';
  for (const m of G.mobs){ miniCtx.fillRect(W/2+m.x*sc-1, H/2+m.y*sc-1, 2,2); }
  // 传送门
  for (const pt of PORTALS){
    miniCtx.fillStyle = pt.color;
    miniCtx.beginPath(); miniCtx.arc(W/2+pt.x*sc, H/2+pt.y*sc, 3, 0, TAU); miniCtx.fill();
  }
  // 远程玩家
  if (mpActive){
    for (const [,rp] of remotePlayers){
      miniCtx.fillStyle = rp.color;
      miniCtx.beginPath(); miniCtx.arc(W/2+rp.x*sc, H/2+rp.y*sc, 2.5, 0,TAU); miniCtx.fill();
    }
  }
  // 本地
  miniCtx.fillStyle='#43d35a';
  miniCtx.beginPath(); miniCtx.arc(W/2+G.player.x*sc, H/2+G.player.y*sc, 3.5, 0,TAU); miniCtx.fill();
}

// ============================================================
//  HUD
// ============================================================
const slotCanvases = [];
function buildSlots(){
  const box = document.getElementById('slots');
  box.innerHTML='';
  slotCanvases.length=0;
  // 占位：始终显示 MAX_SLOTS 个槽（未解锁的暗化）
  for (let i=0;i<MAX_SLOTS;i++){
    const d=document.createElement('div'); d.className='slot';
    const idx=i;
    d.addEventListener('mousemove', e=>{ const pe=G&&G.player.slots[idx]; if(pe) showTip(petalInfoHTML(pe), e.clientX, e.clientY); });
    d.addEventListener('mouseleave', hideTip);
    box.appendChild(d);
    const c=document.createElement('canvas'); c.width=80; c.height=80;
    d.appendChild(c); slotCanvases.push(c);
  }
}
function updateHUD(){
  const p=G.player;
  // HP
  const hpF = clamp(p.hp/p.maxHp,0,1);
  document.querySelector('#hpBar > i').style.width = (hpF*100)+'%';
  document.getElementById('hpLbl').textContent = Math.max(0,Math.ceil(p.hp))+' / '+p.maxHp;
  // XP
  const need = needXp(p.level);
  document.querySelector('#xpBar > i').style.width = clamp(p.xp/need,0,1)*100+'%';
  document.getElementById('xpLbl').textContent = 'Lv '+p.level+'  '+Math.floor(p.xp)+'/'+need;
  // stats
  const bname = BIOMES[biomeAt(p.x,p.y)].name;
  document.getElementById('stats').innerHTML =
    `📍 <b>${bname}</b> · 🟢 等级 <b>${p.level}</b> · 🏆 击杀 <b>${p.kills}</b> · ⭐ 分数 <b>${p.score}</b>` +
    (mpActive?`<br>🌐 ${mpIsHost?'主机':'联机'} · ${remotePlayers.size+1} 人`:'');
  // slots
  for (let i=0;i<MAX_SLOTS;i++){
    const c=slotCanvases[i], x=c.getContext('2d'), pe=p.slots[i];
    x.clearRect(0,0,80,80);
    const slotEl = c.parentElement;
    if (!pe){ slotEl.classList.remove('full'); if (i>=p.slots.length && i>=3) { /* locked */ } continue; }
    slotEl.classList.add('full');
    const def = PETAL_TYPES[pe.type], rar = RARITIES[pe.rarity];
    if (pe.dead){ x.globalAlpha=0.3; }
    if (pe.type==='heal'){ x.shadowColor='#7ee787'; x.shadowBlur=8; }
    x.fillStyle=def.color; x.beginPath(); x.arc(40,40,15,0,TAU); x.fill();
    x.shadowBlur=0; x.globalAlpha=1;
    x.lineWidth=3; x.strokeStyle=rar.ring; x.stroke();
    // 小血量指示
    x.fillStyle='rgba(0,0,0,0.5)'; x.fillRect(20,60,40,4);
    x.fillStyle = pe.dead?'#888':(pe.hp/pe.maxHp>0.5?'#43d35a':'#ffd34d');
    x.fillRect(20,60,40*clamp(pe.hp/pe.maxHp,0,1),4);
  }
}

// ============================================================
//  流程控制
// ============================================================
function startGame(){
  // 联机：全新角色；单机：有存档则继续，否则新角色
  const continuing = !mpActive && savedPlayer;
  const p = continuing ? savedPlayer : newPlayer();
  if (continuing) savedPlayer = null;
  G = { player:p, mobs:[], drops:[], projectiles:[], spawnT:2.2, state:'playing' };
  particles.length=0; cam.x = p.x||0; cam.y = p.y||0; shake=0;
  buildSlots();
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('pause').classList.add('hidden');
  document.getElementById('death').classList.add('hidden');
  document.getElementById('backBtn').classList.remove('hidden');
  // 首帧 HUD
  updateHUD();
}
function togglePause(){
  if (!G) return;
  if (G.state==='playing'){ G.state='paused'; document.getElementById('pause').classList.remove('hidden'); }
  else if (G.state==='paused'){ G.state='playing'; document.getElementById('pause').classList.add('hidden'); }
}
function showDeath(){
  const p=G.player;
  document.getElementById('deathStats').innerHTML =
    `达到 <span>Lv ${p.level}</span> · 击杀 <span>${p.kills}</span> 只 · 得分 <span>${p.score}</span>`;
  document.getElementById('death').classList.remove('hidden');
}
function goBack(){
  saveGame();
  if (window.electronAPI && window.electronAPI.backToLauncher) {
    try { window.electronAPI.backToLauncher(); } catch(e){}
  } else if (window.history.length>1){ window.history.back(); }
}

document.getElementById('playBtn').onclick = ()=>{ startGame(); };
document.getElementById('newGameBtn').onclick = ()=>{
  clearSave(); savedPlayer = null;
  document.getElementById('playBtn').textContent = '开始游戏 ▶';
  document.getElementById('newGameBtn').style.display = 'none';
  startGame();
};
document.getElementById('resumeBtn').onclick = ()=>{ togglePause(); };
document.getElementById('quitBtn').onclick = ()=>{ goBack(); };
document.getElementById('dquitBtn').onclick = ()=>{ goBack(); };
document.getElementById('againBtn').onclick = ()=>{ startGame(); };
document.getElementById('backBtn').onclick = ()=>{ goBack(); };
document.getElementById('btnBack').onclick = ()=>{ panelOpen ? closePanel() : openPanel('back'); };
document.getElementById('btnGallery').onclick = ()=>{ panelOpen ? closePanel() : openPanel('gallery'); };
document.getElementById('tabBack').onclick = ()=> openPanel('back');
document.getElementById('tabGallery').onclick = ()=> openPanel('gallery');
document.getElementById('petalClose').onclick = closePanel;
document.getElementById('modeEquip').onclick = ()=>{ backMode='equip'; renderPetalPanel(); };
document.getElementById('modeFuse').onclick = ()=>{ backMode='fuse'; renderPetalPanel(); };
document.getElementById('fuseBtn').onclick = doFuse;

// ============================================================
//  主循环
// ============================================================
function frame(t){
  const dt = Math.min((t-lastT)/1000 || 0, 0.05);
  lastT = t;
  // 单机下打开花瓣面板时暂停；联机保持实时
  if (G && G.state==='playing' && !(panelOpen && !mpActive)){
    update(dt);
  }
  if (G) render();
  requestAnimationFrame(frame);
}

// ============================================================
//  启动
// ============================================================
(function init(){
  // 先展示菜单，背景跑一个空 G 以便绘制（菜单时也画世界）
  G = { player:newPlayer(), mobs:[], drops:[], projectiles:[], spawnT:1, state:'menu' };
  buildProps();
  buildSlots();
  // 联机：注册监听 + 恢复状态
  if (window.electronAPI && window.electronAPI.onMpMessage) {
    window.electronAPI.onMpMessage((data)=> mpHandleMessage(data));
  }
  mpRestoreState();
  // 离开时存档（页面隐藏/关闭/返回）
  window.addEventListener('pagehide', saveGame);
  window.addEventListener('beforeunload', saveGame);
  document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='hidden') saveGame(); });
  // 菜单文案：有存档则"继续"
  const playBtn = document.getElementById('playBtn');
  if (savedPlayer){
    playBtn.textContent = '继续游戏 ▶';
    document.getElementById('newGameBtn').style.display = '';
  }
  requestAnimationFrame(frame);
})();
</script>
