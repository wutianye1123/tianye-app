<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全面战争模拟器 3D</title>
<style>
:root{--panel:rgba(17,21,26,.9);--line:#2c333c;--gold:#e8b64c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0e131a;
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#e8eaed;
  -webkit-user-select:none;user-select:none}
#view{position:fixed;inset:0}
#view canvas{display:block}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.fl{position:absolute;font-weight:700;font-size:14px;text-shadow:0 1px 3px #000,0 0 6px #000;
  transform:translate(-50%,-50%);white-space:nowrap;will-change:transform,opacity}
#topbar{position:fixed;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:10px;
  align-items:stretch;z-index:10;flex-wrap:wrap;justify-content:center;max-width:98vw}
.tp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:172px;text-align:center}
.tp .tn{font-size:12px;letter-spacing:3px;opacity:.8}
.tp .ti{font-size:15px;font-weight:600;margin-top:2px;white-space:nowrap}
.tp.blue{border-bottom:3px solid #4f8df0}
.tp.red{border-bottom:3px solid #f05252}
.tp .bctrl{display:flex;gap:6px;justify-content:center;margin-top:5px}
.tp .bctrl button{padding:2px 9px;font-size:11px}
#mid{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 18px;text-align:center;min-width:132px}
#phase{font-size:12px;color:var(--gold);letter-spacing:3px}
#timer{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
#ctrls{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:8px 12px}
button{background:#262d36;border:1px solid #3a434e;color:#e8eaed;border-radius:8px;padding:6px 12px;
  font-size:13px;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
button:hover{background:#333d49;border-color:#4a5563}
#bottombar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;flex-direction:column;
  gap:8px;align-items:center;z-index:10;max-width:98vw}
#cards{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:10px;max-width:96vw;overflow-x:auto}
.cgroup{display:flex;flex-direction:column;gap:5px;flex:0 0 auto}
.ghead{font-size:11px;letter-spacing:2px;border-left:3px solid;padding-left:6px;opacity:.95;white-space:nowrap}
.grow{display:flex;gap:6px}
.card{width:68px;flex:0 0 auto;background:#232a33;border:2px solid #333d49;border-radius:10px;
  padding:7px 3px;text-align:center;cursor:pointer;transition:.12s}
.card:hover{transform:translateY(-2px);border-color:#4a5563}
.card.sel{border-color:var(--gold);background:#2e3540;box-shadow:0 0 0 1px var(--gold)}
.card .ic{width:32px;height:32px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;
  justify-content:center;font-size:16px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55)}
.card .nm{font-size:11px;white-space:nowrap}
.card .ct{font-size:11px;color:var(--gold);margin-top:1px}
#actionrow{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:8px 12px;flex-wrap:wrap;justify-content:center}
#actionrow .sep{width:1px;align-self:stretch;background:#3a434e}
#btnFight{background:linear-gradient(180deg,#f3c96b,#d99b2b);border:1px solid #b8860b;color:#3a2a05;
  font-weight:800;font-size:16px;padding:10px 30px;border-radius:10px;text-shadow:0 1px 0 rgba(255,255,255,.4)}
#btnFight:hover{filter:brightness(1.08)}
#hint{font-size:11px;color:#aab3bd;text-shadow:0 1px 2px #000;text-align:center}
#battlebar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 16px;z-index:10}
#btip{font-size:12px;color:#aab3bd}
#overlay{position:fixed;inset:0;background:rgba(8,10,14,.62);display:flex;align-items:center;justify-content:center;z-index:20}
#opanel{background:#1a2027;border:1px solid #333d49;border-radius:16px;padding:34px 48px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.5)}
#otitle{font-size:42px;font-weight:800;letter-spacing:8px;margin-bottom:10px}
#otitle.b{color:#6ea8ff}#otitle.r{color:#ff7b7b}#otitle.d{color:#e8eaed}
#ostats{color:#aab3bd;margin-bottom:24px;line-height:1.9;font-size:14px}
.orow{display:flex;gap:12px;justify-content:center}
#btnRetry{background:#2e5c34;border-color:#4e9457}
#btnRetry:hover{background:#387040}
#toast{position:fixed;top:92px;left:50%;transform:translateX(-50%);background:rgba(10,12,16,.88);
  border:1px solid #3a434e;padding:8px 18px;border-radius:10px;font-size:13px;opacity:0;
  transition:opacity .25s;pointer-events:none;z-index:30;white-space:nowrap}
#presetPanel{position:fixed;inset:0;background:rgba(8,10,14,.55);display:flex;align-items:center;
  justify-content:center;z-index:25}
#presetBox{background:#1a2027;border:1px solid #333d49;border-radius:14px;padding:18px 20px;
  max-width:min(860px,92vw);max-height:80vh;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 20px 60px rgba(0,0,0,.5)}
#presetTitle{font-size:17px;font-weight:700;letter-spacing:2px;text-align:center}
#presetGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;overflow-y:auto;padding:2px}
#presetGrid button{padding:8px 4px;font-size:13px;border-radius:8px}
#presetGrid button.preset-rand{background:#3a3220;border-color:#b8860b;color:#ffd76a;font-weight:700}
#presetClose{align-self:center;padding:8px 40px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="view"></div>
<div id="fx"></div>

<div id="topbar">
  <div class="tp blue">
    <div class="tn">蓝 军</div>
    <div class="ti" id="blueInfo"></div>
    <div class="bctrl place-only"><button data-bt="0" data-d="-250">预算 -</button><button data-bt="0" data-d="250">预算 +</button></div>
  </div>
  <div id="mid"><div id="phase">部署阶段</div><div id="timer">--:--</div></div>
  <div class="tp red">
    <div class="tn">红 军</div>
    <div class="ti" id="redInfo"></div>
    <div class="bctrl place-only"><button data-bt="1" data-d="-250">预算 -</button><button data-bt="1" data-d="250">预算 +</button></div>
  </div>
  <div id="ctrls">
    <button id="btnMoney">预算 正常</button>
    <button id="btnSound">音效 开</button>
    <button id="btnPause" class="battle-only hidden">暂停</button>
    <button id="btnSpeed" class="battle-only hidden">速度 1x</button>
  </div>
</div>

<div id="bottombar">
  <div id="cards"></div>
  <div id="actionrow">
    <button id="btnRandomB">随机蓝军</button>
    <button id="btnRandomR">随机红军</button>
    <span class="sep"></span>
    <button id="btnPresetB">蓝军方案</button>
    <button id="btnPresetR">红军方案</button>
    <span class="sep"></span>
    <button id="btnClearB">清空蓝军</button>
    <button id="btnClearR">清空红军</button>
    <span class="sep"></span>
    <button id="btnFight">开 战</button>
  </div>
  <div id="hint">左半场放置 = 蓝军 · 右半场 = 红军 · 右键删除 · 左键拖动旋转视角 · 右键拖动平移 · 滚轮缩放 · 数字键 1-9 选王国军团</div>
</div>

<div id="battlebar" class="hidden">
  <button id="btnBack">返回部署</button>
  <span id="btip">战斗进行中 · 点击士兵操控（WASD 移动 · 点击敌人锁定目标 · F 取消）· 拖动旋转 · 滚轮缩放 · 空格暂停</span>
</div>

<div id="overlay" class="hidden">
  <div id="opanel">
    <div id="otitle"></div>
    <div id="ostats"></div>
    <div class="orow"><button id="btnRetry">再战一场</button><button id="btnEdit">调整阵容</button></div>
  </div>
</div>

<div id="toast"></div>

<div id="presetPanel" class="hidden">
  <div id="presetBox">
    <div id="presetTitle"></div>
    <div id="presetGrid"></div>
    <button id="presetClose">取 消</button>
  </div>
</div>

<script src="three.min.js"></script>

/* ---------- 工具 ---------- */
var TAU = Math.PI * 2, S = 0.1;               // S: 2D 数值 -> 3D 世界 缩放
var W3 = 160, D3 = 90;                        // 战场 160 x 90
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return a + Math.random() * (b - a); }
function hyp(x, y) { return Math.sqrt(x * x + y * y); }
function fmtTime(t) {
  var m = Math.floor(t / 60), s = Math.floor(t % 60);
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

/* ---------- 音效（WebAudio 合成，与 2D 版一致） ---------- */
var actx = null, master = null, noiseB = null, audioOn = true, sndBudget = 8;
function ac() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = 0.55; master.connect(actx.destination);
    } catch (e) { actx = null; }
  }
  return actx;
}
function resumeAudio() { var c = ac(); if (c && c.state === 'suspended') c.resume(); }
function noiseS() {
  var c = ac(); if (!c) return null;
  if (!noiseB) {
    noiseB = c.createBuffer(1, 8820, 44100);
    var d = noiseB.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseB;
}
function tone(f0, f1, dur, type, vol) {
  var c = ac(); if (!c) return;
  var t0 = c.currentTime;
  var o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.02);
}
function noiseSfx(dur, vol, fType, freq) {
  var c = ac(); if (!c) return;
  var t0 = c.currentTime;
  var s = c.createBufferSource(); s.buffer = noiseS(); s.loop = true;
  var f = c.createBiquadFilter(); f.type = fType; f.frequency.value = freq;
  var g = c.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t0); s.stop(t0 + dur + 0.02);
}
function sfx(name) {
  if (!audioOn || sndBudget < 1) return;
  if (!ac()) return;
  sndBudget -= 1;
  try {
    switch (name) {
      case 'hit':    noiseSfx(0.05, 0.14, 'bandpass', 900); tone(150, 90, 0.07, 'square', 0.1); break;
      case 'arrow':  noiseSfx(0.1, 0.09, 'highpass', 2500); break;
      case 'fire':   noiseSfx(0.16, 0.1, 'bandpass', 600); break;
      case 'boom':   tone(100, 38, 0.4, 'sine', 0.5); noiseSfx(0.3, 0.3, 'lowpass', 500); break;
      case 'smash':  tone(80, 40, 0.25, 'sine', 0.5); noiseSfx(0.12, 0.2, 'lowpass', 300); break;
      case 'death':  tone(200, 70, 0.16, 'sawtooth', 0.07); break;
      case 'place':  tone(660, 880, 0.07, 'sine', 0.08); break;
      case 'win':    tone(523, 523, 0.14, 'sine', 0.16);
                     setTimeout(function () { tone(659, 659, 0.14, 'sine', 0.16); }, 130);
                     setTimeout(function () { tone(784, 784, 0.2, 'sine', 0.18); }, 260);
                     setTimeout(function () { tone(1047, 1047, 0.3, 'sine', 0.16); }, 390); break;
    }
  } catch (e) {}
}

    if (p.m.position.y < 0.05) { p.m.position.y = 0.05; p.vy = 0; }
  }
  for (var r = rings.length - 1; r >= 0; r--) {
    var R = rings[r];
    R.t += dt;
    var k = R.t / 0.4;
    if (k >= 1) {
      scene.remove(R.m);
      R.m.geometry.dispose(); R.m.material.dispose();
      rings.splice(r, 1); continue;
    }
    R.m.scale.setScalar(1 + (R.max - 1) * k);
    R.m.material.opacity = 0.85 * (1 - k);
  }
  for (var l = lightnings.length - 1; l >= 0; l--) {
    var L = lightnings[l];
    L.t += dt;
    if (L.t > 0.22) {
      scene.remove(L.line);
      L.line.geometry.dispose(); L.line.material.dispose();
      lightnings.splice(l, 1); continue;
    }
    L.line.material.opacity = 1 - L.t / 0.22;
  }
  for (var f = floaters.length - 1; f >= 0; f--) {
    var F = floaters[f];
    F.t += dt;
    if (F.t >= F.life) {
      if (F.el.parentNode) F.el.parentNode.removeChild(F.el);
      floaters.splice(f, 1);

}

/* ---------- 渲染同步 ---------- */
var v3 = new THREE.Vector3();
function renderUnits(dt, now) {
  for (var i = 0; i < units.length; i++) {
    var u = units[i];
    if (!u.mesh) continue;
    u.mesh.position.x = u.x;
    u.mesh.position.z = u.z;
    var baseY = u.flyH ? u.flyH + (u.alive ? Math.sin(now / 300 + u.id) * 0.35 : 0) : 0;   // 死亡后冻结悬浮波动
    var bob = u.spd > 0.2 ? Math.abs(Math.sin(u.walk * 2)) * u.r * 0.1 : 0;
    u.mesh.position.y = baseY + bob;
    u.mesh.rotation.y = -u.face + Math.PI / 2;
    if (!u.alive) {
      u.deadT += dt;
      var k = Math.min(1, u.deadT / 0.4);
      u.mesh.rotation.x = k * Math.PI / 2;
      if (u.deadT > 5) u.mesh.position.y = baseY - (u.deadT - 5) * 0.9;
      if (u.deadT > 7.2) disposeUnit(u);
      continue;
    }
    var tiltT = u.fallen > 0 ? 1 : 0;
    u.tilt = lerp(u.tilt, tiltT, Math.min(1, 10 * dt));
    u.mesh.rotation.x = u.tilt * 1.25;
    if (u.parts && u.parts.hand) {
      var sw = u.anim > 0 ? Math.sin(u.anim * Math.PI) : 0;
      if (u.parts.rotor) u.parts.hand.rotation.y = now / 40;
      else u.parts.hand.rotation.x = -0.5 + sw * 1.1;
      if (u.type === 'catapult') u.parts.hand.rotation.z = 0.85 - sw * 1.5;
    }
    if (u.bar) {
      if (u.hp < u.maxHp) {
        u.bar.pivot.visible = true;
        var pct = clamp(u.hp / u.maxHp, 0, 1);
        u.bar.fg.scale.x = Math.max(0.001, pct);
        u.bar.fg.position.x = -u.bar.w * (1 - pct) / 2;
        u.bar.fg.material.color.setHex(pct > 0.5 ? 0x67d06b : pct > 0.25 ? 0xe6c53d : 0xe65b5b);
        u.bar.pivot.position.y = u.bar.y;
        u.bar.pivot.lookAt(camera.position);
      } else {
        u.bar.pivot.visible = false;
      }
    }
  }
}
function renderProjectiles() {
  projectiles.forEach(function (p) {
    if (!p.mesh) return;
    if (p.kind === 'rock') {
      if (p.t <= 0) { p.mesh.visible = false; return; }
      p.mesh.visible = true;
      p.mesh.position.set(p.x, (p.h || 0) + 1, p.z);
    } else {
      var yaw = Math.atan2(p.vz, p.vx);
      p.mesh.position.set(p.x, p.y, p.z);
      if (p.kind === 'arrow' || p.kind === 'spear' || p.kind === 'ice') {
        p.mesh.rotation.set(0, -yaw + Math.PI / 2, Math.PI / 2);
      } else {
        p.mesh.rotation.set(0, -yaw + Math.PI / 2, 0);
      }
    }
  });
}
function renderFloaters() {
  floaters.forEach(function (f) {
    var k = f.t / f.life;
    v3.set(f.x, 2.4 + (1 - k) * 1.6, f.z);
    v3.project(camera);

    f.el.style.transform = 'translate(' + (((v3.x + 1) / 2) * innerWidth).toFixed(1) + 'px,' + (((1 - v3.y) / 2) * innerHeight).toFixed(1) + 'px) translate(-50%,-50%)';
    f.el.style.opacity = String(1 - k);
  });
}

  ostats.innerHTML = '用时 ' + fmtTime(battleTime) + '<br>' +
    '蓝军存活 ' + aB + ' / ' + unitTotals[0] + ' · 红军存活 ' + aR + ' / ' + unitTotals[1] + '<br>' +
    '击杀统计 —— 蓝军 ' + kills[0] + ' · 红军 ' + kills[1];
  overlay.classList.remove('hidden');
}

/* ---------- 主循环 ---------- */
var lastT = performance.now();
function frame(now) {
  var rdt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  sndBudget = Math.min(10, sndBudget + 12 * rdt);

  if (state === 'battle' || state === 'ending') {
    var ts = 1;
    if (state === 'ending') {
      endT += rdt;
      ts = Math.max(0.12, 1 - endT * 0.8);
      if (endT > 1.15) { state = 'over'; showOverlay(); }
    }
    var sdt = paused ? 0 : rdt * SPEEDS[speedIdx] * ts;
    if (sdt > 0) {
      battleTime += sdt;
      simUnits(sdt);
      simProjectiles(sdt);
      checkWin();
    }
    updateFx(paused ? rdt * 0.3 : Math.max(sdt, rdt * 0.3));
  } else if (state === 'over') {
    updateFx(rdt * 0.25);
  }

  if (state === 'place') renderPlaced();
  renderUnits(sdtOrZero(rdt), now);
  renderProjectiles();
  renderFloaters();
  updateGhost();
  updateCtrlMarks(now);
  updateHUD();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
function sdtOrZero(rdt) {
  if (state === 'battle' || state === 'ending') return paused ? 0 : rdt * SPEEDS[speedIdx];
  return rdt;
}
requestAnimationFrame(frame);

setTimeout(function () {
  toast('选兵种后点击地面放置：左半场=蓝军，右半场=红军；拖动旋转视角、滚轮缩放');
}, 700);
</script>
