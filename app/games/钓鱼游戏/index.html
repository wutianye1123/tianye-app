<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>俄罗斯钓鱼</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Microsoft YaHei',sans-serif;user-select:none}
canvas{display:block}

/* 主菜单 */
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;color:#fff}
#overlay h1{font-size:42px;color:#e8a040;margin-bottom:8px;text-shadow:0 2px 10px rgba(0,0,0,0.5)}
#overlay .sub{color:#aab;margin-bottom:30px;font-size:14px}
.scene-cards{display:flex;gap:20px;margin-bottom:30px}
.scene-card{width:220px;height:150px;border-radius:12px;cursor:pointer;position:relative;overflow:hidden;border:3px solid rgba(255,255,255,0.15);transition:all .3s}
.scene-card:hover{border-color:#e8a040;transform:translateY(-5px)}
.scene-card .scene-preview{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:48px}
.scene-card .scene-label{position:absolute;bottom:0;left:0;right:0;padding:8px;text-align:center;background:rgba(0,0,0,0.6);font-size:15px;font-weight:bold}
.preview-lake{background:linear-gradient(135deg,#e07030,#c05020,#2a4a0a)}
.preview-river{background:linear-gradient(135deg,#88ccee,#6699bb,#3a5a1a)}
.preview-sea{background:linear-gradient(135deg,#4488bb,#336699,#606060)}
#overlay .menu-row{display:flex;gap:15px;margin-top:10px}
#overlay .menu-btn{padding:12px 36px;border:2px solid #e8a040;background:transparent;color:#e8a040;border-radius:8px;cursor:pointer;font-size:16px;font-family:inherit;transition:all .2s}
#overlay .menu-btn:hover{background:#e8a040;color:#1a1a1a}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;padding:12px 20px;display:none;z-index:10;pointer-events:none}
#hud>*{pointer-events:auto}
.hud-bar{display:flex;justify-content:space-between;align-items:center}
.hud-coins{color:#e8a040;font-size:18px;font-weight:bold}
.hud-equip{color:#ccc;font-size:13px;margin-top:2px}
.hud-buttons{display:flex;gap:8px}
.hud-btn{padding:6px 14px;background:rgba(0,0,0,0.6);color:#ccc;border:1px solid rgba(255,255,255,0.2);border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit}
.hud-btn:hover{background:rgba(255,255,255,0.15);color:#fff}

/* 天气 */
#weatherInfo{position:fixed;top:55px;left:20px;color:#ccc;font-size:13px;z-index:10;display:none;pointer-events:none}
#weatherInfo .wi-row{display:flex;align-items:center;gap:4px}
#weatherInfo .weather-icon{font-size:20px}
#weatherInfo .weather-luck{color:#ffd700;font-size:12px;margin-top:2px}

/* 力度条 */
#powerBar{position:fixed;right:30px;top:50%;transform:translateY(-50%);width:18px;height:200px;background:rgba(0,0,0,0.5);border-radius:9px;border:2px solid rgba(255,255,255,0.2);display:none;z-index:10}
#powerFill{position:absolute;bottom:0;width:100%;border-radius:7px;background:linear-gradient(to top,#4caf50,#ff9800,#f44336);transition:height 0.05s}

/* 张力条 */
#tensionBar{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:400px;height:30px;background:rgba(0,0,0,0.6);border-radius:15px;border:2px solid rgba(255,255,255,0.3);display:none;z-index:10}
#tensionFill{position:absolute;top:2px;left:2px;bottom:2px;width:0%;border-radius:12px;background:#4caf50;transition:width 0.1s,background 0.2s}
#tensionLabel{position:absolute;width:100%;text-align:center;line-height:26px;color:#fff;font-size:13px;font-weight:bold}
.tz{position:absolute;top:2px;bottom:2px;pointer-events:none;border-radius:12px}
.tz-safe{left:2px;width:50%;background:rgba(76,175,80,0.08);border-right:1px dashed rgba(76,175,80,0.25)}
.tz-warn{left:52%;width:23%;background:rgba(255,152,0,0.08)}
.tz-danger{left:76%;width:22%;background:rgba(244,67,54,0.12);border-left:1px dashed rgba(244,67,54,0.4)}

/* 方向指示器 */
#dirIndicator{position:fixed;top:60%;left:50%;transform:translate(-50%,-50%);display:none;z-index:10;text-align:center;pointer-events:none}
.dir-arrow{font-size:52px;text-shadow:0 0 15px rgba(255,255,255,0.5);transition:transform 0.15s,color 0.2s}
.dir-hint{color:rgba(255,255,255,0.5);font-size:12px;margin-top:6px}
.dir-key{display:inline-block;padding:1px 6px;background:rgba(255,255,255,0.12);border-radius:3px;color:#ccc;font-size:11px;margin:0 1px}

/* 咬钩提示 */
#biteAlert{position:fixed;top:35%;left:50%;transform:translate(-50%,-50%);font-size:36px;font-weight:bold;color:#f44336;text-shadow:0 0 20px rgba(244,67,54,0.8);display:none;z-index:10;animation:pulse .3s infinite alternate}
@keyframes pulse{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-50%) scale(1.15)}}

/* 消息 */
#message{position:fixed;top:60px;left:50%;transform:translateX(-50%);padding:10px 24px;background:rgba(0,0,0,0.7);color:#fff;border-radius:8px;font-size:15px;display:none;z-index:20;white-space:nowrap}

/* 捕获弹窗 */
#catchModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:none;z-index:50;align-items:center;justify-content:center}
#catchModal.show{display:flex}
.catch-card{background:linear-gradient(145deg,#1a2a1a,#0a150a);border:2px solid #e8a040;border-radius:16px;padding:30px 40px;text-align:center;color:#fff;min-width:300px;animation:catchPop .4s ease}
@keyframes catchPop{from{transform:scale(0.5);opacity:0}to{transform:scale(1);opacity:1}}
.catch-card h2{color:#e8a040;font-size:24px;margin-bottom:12px}
.catch-card .fish-icon{font-size:64px;margin:10px 0}
.catch-card .fish-info{color:#ccc;font-size:15px;margin:4px 0}
.catch-card .fish-stars{color:#ffd700;font-size:20px;margin:6px 0}
.catch-card .fish-value{color:#e8a040;font-size:20px;font-weight:bold;margin:10px 0}
.catch-card button{padding:10px 30px;background:#e8a040;color:#1a1a1a;border:none;border-radius:8px;cursor:pointer;font-size:16px;font-family:inherit;margin-top:10px}
.catch-card button:hover{background:#f0b050}

/* 成就通知 */
#achToast{position:fixed;top:80px;right:-320px;width:280px;padding:15px 18px;background:linear-gradient(135deg,#2a1a0a,#1a0a00);border:2px solid #ffd700;border-radius:12px;color:#fff;z-index:60;transition:right .5s cubic-bezier(.4,0,.2,1)}
#achToast.show{right:20px}
.at-title{color:#ffd700;font-size:15px;font-weight:bold}
.at-desc{color:#ccc;font-size:13px;margin-top:4px}

/* 商店 */
#shopPanel{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:none;z-index:50;flex-direction:column;align-items:center;padding-top:40px;color:#fff}
#shopPanel.show{display:flex}
#shopPanel h2{color:#e8a040;font-size:28px;margin-bottom:5px}
#shopPanel .shop-coins{color:#e8a040;font-size:16px;margin-bottom:15px}
.tab-bar{display:flex;gap:8px;margin-bottom:20px}
.tab-btn{padding:8px 20px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:6px;color:#aaa;cursor:pointer;font-size:14px;font-family:inherit}
.tab-btn.active{background:#e8a040;color:#1a1a1a;border-color:#e8a040}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:600px;width:90%}
.shop-item{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:15px;display:flex;justify-content:space-between;align-items:center}
.shop-item.owned{border-color:rgba(100,200,100,0.3)}
.shop-item.equipped{border-color:#e8a040;background:rgba(232,160,64,0.1)}
.shop-item .item-info h3{font-size:15px;color:#ddd;margin-bottom:3px}
.shop-item .item-info p{font-size:12px;color:#888}
.shop-item .item-price{color:#e8a040;font-size:14px;white-space:nowrap}
.shop-btn{padding:6px 14px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-family:inherit;margin-left:10px}
.shop-btn.buy{background:#e8a040;color:#1a1a1a}
.shop-btn.buy:hover{background:#f0b050}
.shop-btn.equip{background:rgba(100,200,100,0.3);color:#6c6}
.shop-btn.equipped-btn{background:rgba(232,160,64,0.2);color:#e8a040;cursor:default}
.shop-btn.disabled{background:rgba(255,255,255,0.1);color:#555;cursor:not-allowed}
#shopPanel .close-btn{position:absolute;top:15px;right:20px;background:none;border:none;color:#888;font-size:28px;cursor:pointer}

/* 图鉴 */
#collectionPanel{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:none;z-index:50;flex-direction:column;align-items:center;padding-top:30px;color:#fff;overflow-y:auto}
#collectionPanel.show{display:flex}
#collectionPanel h2{color:#e8a040;font-size:28px;margin-bottom:3px}
.coll-tabs{display:flex;gap:8px;margin-bottom:12px}
.coll-tab{padding:6px 16px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:6px;color:#aaa;cursor:pointer;font-size:13px;font-family:inherit}
.coll-tab.active{background:#e8a040;color:#1a1a1a;border-color:#e8a040}
.coll-progress{color:#888;font-size:14px;margin-bottom:15px}
.coll-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:700px;width:90%;padding-bottom:30px}
.coll-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:12px;text-align:center;min-height:120px}
.coll-card.caught{border-color:rgba(100,200,100,0.3)}
.coll-card .fish-icon{font-size:32px;margin-bottom:6px}
.coll-card .fish-name{font-size:13px;color:#ccc;margin-bottom:3px}
.coll-card .fish-rarity{font-size:11px;padding:2px 6px;border-radius:3px;display:inline-block}
.coll-card .fish-detail{font-size:11px;color:#888;margin-top:4px}
.coll-card.unknown .fish-icon{filter:brightness(0);opacity:0.3}
.coll-card.unknown .fish-name{color:#555}
#collectionPanel .close-btn{position:fixed;top:15px;right:20px;background:none;border:none;color:#888;font-size:28px;cursor:pointer;z-index:51}

/* 成就网格 */
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:600px;width:90%;padding-bottom:30px}
.ach-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:10px}
.ach-card.unlocked{border-color:rgba(255,215,0,0.3);background:rgba(255,215,0,0.05)}
.ach-icon{font-size:24px}
.ach-info .ach-name{font-size:13px;color:#ddd}
.ach-info .ach-desc{font-size:11px;color:#888}

.rarity-common{background:rgba(100,180,100,0.3);color:#6b6}
.rarity-uncommon{background:rgba(100,150,220,0.3);color:#8ad}
.rarity-rare{background:rgba(160,100,220,0.3);color:#a8d}
.rarity-legendary{background:rgba(255,215,0,0.3);color:#ffd700}

/* 操作提示 */
#controls{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.5);font-size:12px;z-index:10;pointer-events:none;text-align:center;transition:opacity .3s}
</style>
</head>
<body>

<div id="overlay">
  <h1>🎣 俄罗斯钓鱼</h1>
  <div class="sub">选择钓场开始你的钓鱼之旅</div>
  <div class="scene-cards">
    <div class="scene-card" onclick="startGame('lake_sunset')">
      <div class="scene-preview preview-lake">🌅</div>
      <div class="scene-label">湖畔日落</div>
    </div>
    <div class="scene-card" onclick="startGame('river_morning')">
      <div class="scene-preview preview-river">🌄</div>
      <div class="scene-label">河流清晨</div>
    </div>
    <div class="scene-card" onclick="startGame('sea_dock')">
      <div class="scene-preview preview-sea">🌊</div>
      <div class="scene-label">海港码头</div>
    </div>
  </div>
  <div class="menu-row">
    <button class="menu-btn" onclick="openShop()">🛒 商店</button>
    <button class="menu-btn" onclick="openCollection()">📖 图鉴</button>
  </div>
</div>

<div id="hud">
  <div class="hud-bar">
    <div>
      <div class="hud-coins">💰 <span id="coinText">150</span></div>
      <div class="hud-equip" id="equipText">竹竿 | 基础线 | 蚯蚓 x10</div>
    </div>
    <div class="hud-buttons">
      <button class="hud-btn" onclick="openShop()">商店</button>
      <button class="hud-btn" onclick="openCollection()">图鉴</button>
      <button class="hud-btn" onclick="backToMenu()">返回</button>
    </div>
  </div>
</div>

<div id="weatherInfo">
  <div class="wi-row"><span class="weather-icon" id="weatherIcon">☀️</span><span id="weatherText">晴天</span></div>
  <div class="weather-luck" id="weatherLuck">🐟 活跃度: 普通</div>
</div>

<div id="powerBar"><div id="powerFill"></div></div>

<div id="tensionBar">
  <div class="tz tz-safe"></div>
  <div class="tz tz-warn"></div>
  <div class="tz tz-danger"></div>
  <div id="tensionFill"></div>
  <div id="tensionLabel">张力</div>
</div>

<div id="dirIndicator">
  <div class="dir-arrow" id="dirArrow">←</div>
  <div class="dir-hint">按 <span class="dir-key">A</span><span class="dir-key">D</span> 对抗鱼方向</div>
</div>

<div id="biteAlert">🐟 上钩了！快点击！</div>
<div id="message"></div>

<div id="catchModal">
  <div class="catch-card">
    <h2 id="catchTitle">钓到了！</h2>
    <div class="fish-icon" id="catchIcon">🐟</div>
    <div class="fish-info" id="catchName"></div>
    <div class="fish-info" id="catchWeight"></div>
    <div class="fish-stars" id="catchStars"></div>
    <div class="fish-value" id="catchValue"></div>
    <button onclick="closeCatch()">继续钓鱼</button>
  </div>
</div>

<div id="achToast">
  <div class="at-title" id="achToastTitle">🏆 成就解锁</div>
  <div class="at-desc" id="achToastDesc"></div>
</div>

<div id="shopPanel">
  <button class="close-btn" onclick="closeShop()">✕</button>
  <h2>🛒 渔具商店</h2>
  <div class="shop-coins">💰 <span id="shopCoins">150</span></div>
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('rod')">鱼竿</button>
    <button class="tab-btn" onclick="switchTab('line')">鱼线</button>
    <button class="tab-btn" onclick="switchTab('bait')">鱼饵</button>
  </div>
  <div class="shop-grid" id="shopGrid"></div>
</div>

<div id="collectionPanel">
  <button class="close-btn" onclick="closeCollection()">✕</button>
  <h2>📖 钓鱼手册</h2>
  <div class="coll-tabs">
    <button class="coll-tab active" onclick="switchCollTab('fish')">鱼类图鉴</button>
    <button class="coll-tab" onclick="switchCollTab('ach')">成就</button>
  </div>
  <div class="coll-progress" id="collProgress">0 / 16</div>
  <div id="collContent"></div>
</div>

<div id="controls">按住鼠标蓄力抛竿 | 松开抛出 | F5保存 F9读取 F2返回</div>

<script src="./three.min.js"></script>
<script>
// ===================== 数据定义 =====================
const FISH_SPECIES = [
  {id:'crucian',name:'鲫鱼',rarity:'common',sceneType:'freshwater',minW:0.2,maxW:1.5,biteRate:1.0,fight:0.3,baseValue:10,color:0xC0A050,scale:[1,0.6,0.35],icon:'🐟',dirFreq:2.0},
  {id:'carp',name:'鲤鱼',rarity:'common',sceneType:'freshwater',minW:0.5,maxW:5.0,biteRate:0.8,fight:0.5,baseValue:25,color:0xD4A030,scale:[1.2,0.7,0.4],icon:'🐟',dirFreq:1.5},
  {id:'grass',name:'草鱼',rarity:'common',sceneType:'freshwater',minW:1.0,maxW:8.0,biteRate:0.7,fight:0.6,baseValue:30,color:0x607040,scale:[1.4,0.6,0.35],icon:'🐟',dirFreq:1.2},
  {id:'silver',name:'鲢鱼',rarity:'common',sceneType:'freshwater',minW:0.8,maxW:6.0,biteRate:0.75,fight:0.5,baseValue:20,color:0xC0C8D0,scale:[1.1,0.65,0.3],icon:'🐟',dirFreq:1.8},
  {id:'catfish',name:'鲶鱼',rarity:'rare',sceneType:'freshwater',minW:2.0,maxW:15.0,biteRate:0.4,fight:0.8,baseValue:80,color:0x404040,scale:[1.5,0.5,0.3],icon:'🐠',dirFreq:0.8},
  {id:'snakehead',name:'黑鱼',rarity:'rare',sceneType:'freshwater',minW:1.0,maxW:6.0,biteRate:0.35,fight:0.85,baseValue:100,color:0x303020,scale:[1.3,0.45,0.3],icon:'🐠',dirFreq:1.0},
  {id:'softshell',name:'甲鱼',rarity:'rare',sceneType:'freshwater',minW:0.5,maxW:3.0,biteRate:0.25,fight:0.4,baseValue:150,color:0x706050,scale:[0.8,0.3,0.8],icon:'🐢',dirFreq:1.5},
  {id:'mandarin',name:'鳜鱼',rarity:'rare',sceneType:'freshwater',minW:0.5,maxW:4.0,biteRate:0.3,fight:0.65,baseValue:120,color:0x907050,scale:[1.0,0.55,0.35],icon:'🐠',dirFreq:1.3},
  {id:'bass',name:'鲈鱼',rarity:'common',sceneType:'sea',minW:0.5,maxW:4.0,biteRate:0.8,fight:0.6,baseValue:35,color:0x809060,scale:[1.1,0.55,0.3],icon:'🐟',dirFreq:1.5},
  {id:'grouper',name:'石斑鱼',rarity:'rare',sceneType:'sea',minW:1.0,maxW:10.0,biteRate:0.4,fight:0.75,baseValue:120,color:0xA06040,scale:[1.3,0.7,0.45],icon:'🐠',dirFreq:0.7},
  {id:'seaBream',name:'鲷鱼',rarity:'uncommon',sceneType:'sea',minW:0.3,maxW:3.0,biteRate:0.6,fight:0.45,baseValue:50,color:0xE0B080,scale:[1.0,0.65,0.3],icon:'🐟',dirFreq:1.6},
  {id:'tuna',name:'金枪鱼',rarity:'rare',sceneType:'sea',minW:5.0,maxW:30.0,biteRate:0.25,fight:0.9,baseValue:200,color:0x4050A0,scale:[1.6,0.5,0.35],icon:'🐠',dirFreq:0.5},
  {id:'kingCarp',name:'巨型鲤鱼',rarity:'legendary',sceneType:'freshwater',minW:10.0,maxW:25.0,biteRate:0.05,fight:0.95,baseValue:500,color:0xFFD700,scale:[2.0,0.8,0.5],icon:'⭐',dirFreq:0.4},
  {id:'giantCat',name:'巨型鲶鱼',rarity:'legendary',sceneType:'freshwater',minW:15.0,maxW:40.0,biteRate:0.03,fight:1.0,baseValue:800,color:0x303050,scale:[2.5,0.7,0.4],icon:'⭐',dirFreq:0.3},
  {id:'seaDragon',name:'龙胆石斑',rarity:'legendary',sceneType:'sea',minW:20.0,maxW:50.0,biteRate:0.03,fight:1.0,baseValue:1000,color:0xCC4400,scale:[2.8,0.9,0.5],icon:'⭐',dirFreq:0.3},
  {id:'goldenTuna',name:'黄金金枪鱼',rarity:'legendary',sceneType:'sea',minW:30.0,maxW:80.0,biteRate:0.02,fight:1.0,baseValue:1500,color:0xFFAA00,scale:[2.2,0.6,0.4],icon:'⭐',dirFreq:0.25},
];

const RODS = [
  {id:'bamboo',name:'竹竿',cost:0,castDist:30,lineStr:0.5,desc:'基础竹竿，适合新手'},
  {id:'carbon',name:'碳素竿',cost:500,castDist:45,lineStr:0.7,desc:'更轻更远，强度更好'},
  {id:'fiberglass',name:'玻璃钢竿',cost:1500,castDist:55,lineStr:0.85,desc:'专业级钓竿'},
  {id:'pro',name:'专业竿',cost:5000,castDist:70,lineStr:1.0,desc:'顶级装备，挑战传说鱼'},
];

const LINES = [
  {id:'basic',name:'基础线',cost:0,maxTension:40,desc:'普通鱼线，容易断'},
  {id:'nylon',name:'尼龙线',cost:300,maxTension:55,desc:'韧性不错'},
  {id:'carbonL',name:'碳素线',cost:1000,maxTension:70,desc:'高强度低延展'},
  {id:'pe',name:'PE线',cost:3000,maxTension:90,desc:'编织线，极限强度'},
];

// ===================== 音效系统 =====================
const SFX = {
  ctx:null, master:null, ambientNode:null, rainNode:null,

  init(){
    if(this.ctx) return;
    this.ctx = new (window.AudioContext||window.webkitAudioContext)();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.25;
    this.master.connect(this.ctx.destination);
  },
  resume(){ if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); },

  _noise(dur){
    const n=this.ctx.sampleRate*dur;
    const b=this.ctx.createBuffer(1,n,this.ctx.sampleRate);
    const d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    return b;
  },

  playSplash(){
    if(!this.ctx)return;
    const s=this.ctx.createBufferSource(); s.buffer=this._noise(0.4);
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(0.35,this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01,this.ctx.currentTime+0.4);
    const f=this.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1500; f.Q.value=0.8;
    s.connect(f).connect(g).connect(this.master); s.start(); s.stop(this.ctx.currentTime+0.4);
  },

  playCast(){
    if(!this.ctx)return;
    const o=this.ctx.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(600,this.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(200,this.ctx.currentTime+0.3);
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(0.15,this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01,this.ctx.currentTime+0.3);
    o.connect(g).connect(this.master); o.start(); o.stop(this.ctx.currentTime+0.3);
  },

  playBite(){
    if(!this.ctx)return;
    const t=this.ctx.currentTime;
    for(let i=0;i<3;i++){
      const o=this.ctx.createOscillator(); o.type='square'; o.frequency.value=880;
      const g=this.ctx.createGain();
      g.gain.setValueAtTime(0.2,t+i*0.12);
      g.gain.setValueAtTime(0,t+i*0.12+0.06);
      o.connect(g).connect(this.master); o.start(t+i*0.12); o.stop(t+i*0.12+0.06);
    }
  },

  playReelClick(){
    if(!this.ctx)return;
    const o=this.ctx.createOscillator(); o.type='square'; o.frequency.value=200+Math.random()*100;
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(0.06,this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01,this.ctx.currentTime+0.04);
    o.connect(g).connect(this.master); o.start(); o.stop(this.ctx.currentTime+0.04);
  },

  playSnap(){
    if(!this.ctx)return;
    const s=this.ctx.createBufferSource(); s.buffer=this._noise(0.15);
    const g=this.ctx.createGain();
    g.gain.setValueAtTime(0.5,this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01,this.ctx.currentTime+0.15);
    const f=this.ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=3000;
    s.connect(f).connect(g).connect(this.master); s.start(); s.stop(this.ctx.currentTime+0.15);
  },

  playCatch(){
    if(!this.ctx)return;
    const t=this.ctx.currentTime;
    [523,659,784,1047].forEach((freq,i)=>{
      const o=this.ctx.createOscillator(); o.type='sine'; o.frequency.value=freq;
      const g=this.ctx.createGain();
      g.gain.setValueAtTime(0.15,t+i*0.12);
      g.gain.exponentialRampToValueAtTime(0.01,t+i*0.12+0.3);
      o.connect(g).connect(this.master); o.start(t+i*0.12); o.stop(t+i*0.12+0.3);
    });
  },

  playAchievement(){
    if(!this.ctx)return;
    const t=this.ctx.currentTime;
    [660,880,1100].forEach((freq,i)=>{
      const o=this.ctx.createOscillator(); o.type='sine'; o.frequency.value=freq;
      const g=this.ctx.createGain();
      g.gain.setValueAtTime(0.12,t+i*0.15);
      g.gain.exponentialRampToValueAtTime(0.01,t+i*0.15+0.4);
      o.connect(g).connect(this.master); o.start(t+i*0.15); o.stop(t+i*0.15+0.4);
    });
  },

  startAmbient(){
    if(!this.ctx||this.ambientNode)return;
    const s=this.ctx.createBufferSource(); s.buffer=this._noise(2); s.loop=true;
    const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=400;
    const g=this.ctx.createGain(); g.gain.value=0.06;
    s.connect(f).connect(g).connect(this.master); s.start();
    this.ambientNode={s,g};
  },
  stopAmbient(){
    if(this.ambientNode){this.ambientNode.s.stop();this.ambientNode=null;}
  },

  setRain(intensity){
    if(!this.ctx)return;
    if(intensity<=0&&this.rainNode){this.rainNode.s.stop();this.rainNode=null;return;}
    if(intensity>0&&!this.rainNode){
      const s=this.ctx.createBufferSource(); s.buffer=this._noise(2); s.loop=true;
      const f=this.ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=800; f.Q.value=0.5;
      const g=this.ctx.createGain(); g.gain.value=0;
      s.connect(f).connect(g).connect(this.master); s.start();
      this.rainNode={s,g};
    }
    if(this.rainNode) this.rainNode.g.gain.linearRampToValueAtTime(intensity*0.15,this.ctx.currentTime+1);
  }
};

// ===================== 粒子系统 =====================
const Particles = {
  mesh:null, pool:[], max:200,

  init(){
    const g=new THREE.BufferGeometry();
    const pos=new Float32Array(this.max*3);
    const col=new Float32Array(this.max*3);
    const siz=new Float32Array(this.max);
    g.setAttribute('position',new THREE.BufferAttribute(pos,3));
    g.setAttribute('color',new THREE.BufferAttribute(col,3));
    g.setAttribute('size',new THREE.BufferAttribute(siz,1));
    const m=new THREE.PointsMaterial({size:0.08,vertexColors:true,transparent:true,opacity:0.8,depthWrite:false,sizeAttenuation:true});
    this.mesh=new THREE.Points(g,m);
    this.pool=[];
    for(let i=0;i<this.max;i++) this.pool.push({active:false,x:0,y:0,z:0,vx:0,vy:0,vz:0,life:0,maxLife:1,r:1,g:1,b:1,sz:0.08});
  },

  splash(x,y,z,count){
    let n=0;
    for(const p of this.pool){
      if(p.active||n>=count) continue;
      p.active=true;
      p.x=x+(Math.random()-0.5)*0.3; p.y=y; p.z=z+(Math.random()-0.5)*0.3;
      p.vx=(Math.random()-0.5)*2; p.vy=2+Math.random()*3; p.vz=(Math.random()-0.5)*2;
      p.life=0; p.maxLife=0.5+Math.random()*0.5;
      p.r=0.7; p.g=0.85; p.b=1.0; p.sz=0.04+Math.random()*0.06;
      n++;
    }
  },

  celebrate(x,y,z){
    let n=0;
    for(const p of this.pool){
      if(p.active||n>=30) continue;
      p.active=true;
      p.x=x; p.y=y; p.z=z;
      const a=Math.random()*Math.PI*2, spd=1+Math.random()*3;
      p.vx=Math.cos(a)*spd; p.vy=2+Math.random()*4; p.vz=Math.sin(a)*spd;
      p.life=0; p.maxLife=0.8+Math.random()*0.5;
      p.r=1; p.g=0.84; p.b=0; p.sz=0.06+Math.random()*0.08;
      n++;
    }
  },

  update(dt){
    if(!this.mesh)return;
    const pos=this.mesh.geometry.attributes.position;
    const col=this.mesh.geometry.attributes.color;
    const siz=this.mesh.geometry.attributes.size;
    for(let i=0;i<this.pool.length;i++){
      const p=this.pool[i];
      if(!p.active){pos.setXYZ(i,0,-100,0);siz.setX(i,0);continue;}
      p.life+=dt;
      if(p.life>=p.maxLife){p.active=false;pos.setXYZ(i,0,-100,0);siz.setX(i,0);continue;}
      p.vy-=9.8*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
      const fade=1-p.life/p.maxLife;
      pos.setXYZ(i,p.x,p.y,p.z);
      col.setXYZ(i,p.r*fade,p.g*fade,p.b*fade);
      siz.setX(i,p.sz*fade);
    }
    pos.needsUpdate=true; col.needsUpdate=true; siz.needsUpdate=true;
  }
};

// ===================== 雨系统 =====================
const Rain = {
  mesh:null, count:3000,
  init(){
    const g=new THREE.BufferGeometry();
    const p=new Float32Array(this.count*3);
    for(let i=0;i<this.count;i++){p[i*3]=(Math.random()-0.5)*80;p[i*3+1]=Math.random()*30;p[i*3+2]=(Math.random()-0.5)*80;}
    g.setAttribute('position',new THREE.BufferAttribute(p,3));
    this.mesh=new THREE.Points(g,new THREE.PointsMaterial({color:0xaabbcc,size:0.06,transparent:true,opacity:0,depthWrite:false}));
    this.mesh.visible=false;
  },
  setIntensity(v){if(!this.mesh)return;this.mesh.visible=v>0;this.mesh.material.opacity=v*0.5;},
  update(dt){
    if(!this.mesh||!this.mesh.visible)return;
    const pos=this.mesh.geometry.attributes.position;
    for(let i=0;i<this.count;i++){
      let y=pos.getY(i); y-=15*dt;
      if(y<-1) y=25+Math.random()*5;
      pos.setY(i,y);
      let x=pos.getX(i); x+=(Math.random()-0.3)*dt*2;
      pos.setX(i,x);
    }
    pos.needsUpdate=true;
  }
};

// ===================== 天气系统 =====================
const Weather = {
  current:'clear', timer:120,
  update(dt){
    if(GS.phase==='menu')return;
    this.timer-=dt;
    if(this.timer<=0){this.change();this.timer=120+Math.random()*120;}
    const w=WEATHER_TYPES[this.current];
    SFX.setRain(w.rain);
    Rain.setIntensity(w.rain);
    if(scene&&scene.fog){
      const cfg=SCENE_CONFIGS[GS.currentScene];
      const target=cfg.fogFar*w.fogMult;
      scene.fog.far+=(target-scene.fog.far)*dt*2;
    }
  },
  change(){
    const types=Object.keys(WEATHER_TYPES);
    let next; do{next=types[Math.floor(Math.random()*types.length)];}while(next===this.current);
    this.current=next; this.updateUI();
    showMsg('天气变化: '+WEATHER_TYPES[next].name);
  },
  updateUI(){
    const w=WEATHER_TYPES[this.current];
    document.getElementById('weatherIcon').textContent=w.icon;
    document.getElementById('weatherText').textContent=w.name;
    document.getElementById('weatherLuck').textContent='🐟 活跃度: '+w.activity;
  },
  getBiteMult(){return WEATHER_TYPES[this.current].biteMult;},
  reset(){this.current='clear';this.timer=120+Math.random()*60;this.updateUI();Rain.setIntensity(0);SFX.setRain(0);}
};

const AchSys = {
  unlocked:[], toastTimer:null,
  check(){
    const s=this.getStats();
    for(const a of ACHIEVEMENTS){
      if(this.unlocked.includes(a.id))continue;
      if(a.check(s)){this.unlocked.push(a.id);this.showToast(a);SFX.playAchievement();}
    }
  },
  getStats(){
    let cc=0; const cr={rare:false,legendary:false};
    for(const f of FISH_SPECIES){
      if(GS.collection[f.id]){cc++;if(f.rarity==='rare')cr.rare=true;if(f.rarity==='legendary')cr.legendary=true;}
    }
    return {totalCaught:GS.totalCaught,maxWeight:GS.maxWeight,totalEarned:GS.totalEarned,
      collPct:cc/FISH_SPECIES.length,caughtRare:cr.rare,caughtLegend:cr.legendary,bestStreak:GS.bestStreak};
  },
  showToast(a){
    const el=document.getElementById('achToast');
    document.getElementById('achToastTitle').textContent=a.icon+' '+a.name;
    document.getElementById('achToastDesc').textContent=a.desc;
    el.classList.add('show');
    clearTimeout(this.toastTimer);
    this.toastTimer=setTimeout(()=>el.classList.remove('show'),3500);
  }
};

// ===================== 水面着色器 =====================
function createWater(config){
  const geo=new THREE.PlaneGeometry(120,120,100,100);
  const mat=new THREE.ShaderMaterial({
    uniforms:{
      uTime:{value:0},
      uWaterColor:{value:new THREE.Vector3(...config.waterColor)},
      uSkyColor:{value:new THREE.Vector3(...config.skyReflect)},
      uBobberPos:{value:new THREE.Vector2(999,999)},
      uSplashTime:{value:-10},
    },
    vertexShader:`
      uniform float uTime;
      varying vec2 vUv;
      varying float vWave;
      varying vec3 vWP;
      void main(){
        vUv=uv;
        vec3 p=position;
        float w=sin(p.x*0.5+uTime*1.2)*0.12+sin(p.y*0.7+uTime*0.8)*0.08+sin((p.x+p.y)*0.3+uTime*1.5)*0.06;
        p.z+=w; vWave=w;
        vWP=(modelMatrix*vec4(p,1.0)).xyz;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);
      }
    `,
    fragmentShader:`
      uniform vec3 uWaterColor;
      uniform vec3 uSkyColor;
      uniform float uTime;
      uniform vec2 uBobberPos;
      uniform float uSplashTime;
      varying vec2 vUv;
      varying float vWave;
      varying vec3 vWP;
      void main(){
        float f=pow(1.0-abs(dot(normalize(vec3(0,0,1)),vec3(0,0,1))),2.0);
        vec3 col=mix(uWaterColor,uSkyColor,f*0.4);
        col+=vec3(0.1,0.1,0.05)*vWave*3.0;
        float sparkle=pow(max(0.0,sin(vUv.x*50.0+uTime*2.0)*sin(vUv.y*50.0+uTime*1.5)),8.0);
        col+=vec3(sparkle*0.12);
        float age=uTime-uSplashTime;
        if(age<3.0&&age>0.0){
          float dist=distance(vWP.xz,uBobberPos);
          for(int i=0;i<3;i++){
            float radius=age*(1.5+float(i)*0.8);
            float ring=abs(dist-radius);
            col+=vec3(smoothstep(0.3,0.0,ring)*(1.0-age/3.0)*0.15);
          }
        }
        gl_FragColor=vec4(col,0.82);
      }
    `,
    transparent:true, side:THREE.DoubleSide,
  });
  const mesh=new THREE.Mesh(geo,mat);
  mesh.rotation.x=-Math.PI/2; mesh.position.y=0;
  scene.add(mesh); sceneObjects.push(mesh);
  waterMesh=mesh; waterMaterial=mat;

  const bGeo=new THREE.PlaneGeometry(120,120);
  const bMat=new THREE.MeshPhongMaterial({color:0x1a2a1a,side:THREE.DoubleSide});
  const bottom=new THREE.Mesh(bGeo,bMat);
  bottom.rotation.x=-Math.PI/2; bottom.position.y=-3;
  scene.add(bottom); sceneObjects.push(bottom);
}

// ===================== 场景构建 =====================
function clearScene(){
  for(let i=sceneObjects.length-1;i>=0;i--){
    const o=sceneObjects[i]; scene.remove(o);
    if(o.geometry) o.geometry.dispose();
    if(o.material){const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>{if(m.map)m.map.dispose();m.dispose();});}
  }
  sceneObjects=[];
  waterMesh=null;waterMaterial=null;bobberGroup=null;fishingLine=null;rodGroup=null;rodShaft=null;fishMesh=null;
  const toRemove=[];scene.traverse(o=>{if(o.isLight)toRemove.push(o);});toRemove.forEach(o=>scene.remove(o));
}

function buildScene(key){
  clearScene();
  const c=SCENE_CONFIGS[key]; GS.currentScene=key;
  scene.background=new THREE.Color(c.skyColor);
  scene.fog=new THREE.Fog(c.fogColor,c.fogNear,c.fogFar);

  const ambient=new THREE.AmbientLight(c.ambientColor,c.ambientInt); scene.add(ambient);
  const sun=new THREE.DirectionalLight(c.sunColor,c.sunInt);
  sun.position.set(...c.sunPos); sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.left=-50;sun.shadow.camera.right=50;sun.shadow.camera.top=50;sun.shadow.camera.bottom=-50;
  scene.add(sun);

  createWater(c);
  buildTerrain(c);
  if(c.hasTrees) buildTrees(c);
  if(c.hasDock) buildDock(c);
  buildRod(c);
  buildBobber();
  buildLine();

  Particles.init(); scene.add(Particles.mesh); sceneObjects.push(Particles.mesh);
  Rain.init(); scene.add(Rain.mesh); sceneObjects.push(Rain.mesh);

  camera.position.set(...c.camPos);
  camera.lookAt(new THREE.Vector3(...c.camLook));
}

function buildTerrain(c){
  const geo=new THREE.PlaneGeometry(120,60,40,20);
  const pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),y=pos.getY(i);
    let h=0;
    if(y<-25){const t=Math.min(1,(-25-y)/15);h=t*t*3;}
    else if(y>25){const t=Math.min(1,(y-25)/15);h=t*t*4;}
    h+=(Math.sin(x*0.3)*Math.cos(y*0.2))*0.3;
    pos.setZ(i,h);
  }
  geo.computeVertexNormals();
  const mat=new THREE.MeshPhongMaterial({color:c.terrainColor,flatShading:true});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.rotation.x=-Math.PI/2; mesh.position.set(0,-0.1,-30); mesh.receiveShadow=true;
  scene.add(mesh); sceneObjects.push(mesh);
}

function buildTrees(c){
  for(let i=0;i<15;i++){
    const tree=new THREE.Group();
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.2,2,6),new THREE.MeshPhongMaterial({color:0x4a3020}));
    trunk.position.y=1; tree.add(trunk);
    const leaf=new THREE.Mesh(new THREE.ConeGeometry(1.2,2.5,6),new THREE.MeshPhongMaterial({color:0x1a5a0a+Math.floor(Math.random()*0x0a1a0a)}));
    leaf.position.y=3; tree.add(leaf);
    const angle=(Math.random()-0.5)*Math.PI*1.4;
    const dist=25+Math.random()*25;
    const side=Math.random()>0.5?-1:1;
    tree.position.set(Math.cos(angle)*dist*side,0,-25-Math.sin(angle)*dist*0.5);
    tree.rotation.y=Math.random()*Math.PI*2;
    tree.scale.setScalar(0.8+Math.random()*0.6);
    tree.castShadow=true;
    scene.add(tree); sceneObjects.push(tree);
  }
}

function buildDock(c){
  const wm=new THREE.MeshPhongMaterial({color:0x6a4a2a});
  const plat=new THREE.Mesh(new THREE.BoxGeometry(4,0.2,8),wm);
  plat.position.set(0,0.8,0); plat.receiveShadow=true;
  scene.add(plat); sceneObjects.push(plat);
  for(let x of[-1.5,1.5]){for(let z of[-3,-1,1,3]){
    const p=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,2,6),wm);
    p.position.set(x,-0.2,z); scene.add(p); sceneObjects.push(p);
  }}
  const rail=new THREE.Mesh(new THREE.BoxGeometry(4,0.08,0.08),wm);
  rail.position.set(0,1.5,-3.5); scene.add(rail); sceneObjects.push(rail);
}

function buildRod(c){
  rodGroup=new THREE.Group();
  const mat=new THREE.MeshPhongMaterial({color:0x3a2a1a});
  rodShaft=new THREE.Mesh(new THREE.CylinderGeometry(0.01,0.025,1.8,8),mat);
  rodShaft.rotation.x=-Math.PI/4; rodShaft.position.set(0.3,-0.1,-0.5);
  rodGroup.add(rodShaft);
  const reel=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.06,8),new THREE.MeshPhongMaterial({color:0x888888}));
  reel.rotation.z=Math.PI/2; reel.position.set(0.3,-0.2,-0.1);
  rodGroup.add(reel);
  camera.add(rodGroup); scene.add(camera);
}

function buildBobber(){
  bobberGroup=new THREE.Group();
  const wh=new THREE.MeshPhongMaterial({color:0xffffff});
  const rd=new THREE.MeshPhongMaterial({color:0xff2200});
  const b=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.04,0.08,8),wh);
  bobberGroup.add(b);
  const tp=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.03,0.1,8),rd);
  tp.position.y=0.09; bobberGroup.add(tp);
  const ant=new THREE.Mesh(new THREE.CylinderGeometry(0.005,0.005,0.12,4),rd);
  ant.position.y=0.2; bobberGroup.add(ant);
  bobberGroup.visible=false;
  scene.add(bobberGroup); sceneObjects.push(bobberGroup);
}

function buildLine(){
  const mat=new THREE.LineBasicMaterial({color:0xcccccc,transparent:true,opacity:0.6});
  const pts=[]; for(let i=0;i<=12;i++) pts.push(new THREE.Vector3());
  const geo=new THREE.BufferGeometry().setFromPoints(pts);
  fishingLine=new THREE.Line(geo,mat);
  fishingLine.visible=false;
  scene.add(fishingLine); sceneObjects.push(fishingLine);
}

// ===================== 鱼模型 =====================
function createFishModel(species,weight){
  const group=new THREE.Group();
  const s=species.scale, w=weight/species.maxW, sz=0.3+w*0.5;
  const bMat=new THREE.MeshPhongMaterial({color:species.color,shininess:60});
  const body=new THREE.Mesh(new THREE.SphereGeometry(1,12,8),bMat);
  body.scale.set(s[0]*sz,s[1]*sz,s[2]*sz); group.add(body);
  const tail=new THREE.Mesh(new THREE.ConeGeometry(0.15*sz,0.3*sz,4),bMat);
  tail.rotation.z=Math.PI/2; tail.position.x=-s[0]*sz*0.9; group.add(tail);
  const fMat=new THREE.MeshPhongMaterial({color:species.color,side:THREE.DoubleSide,transparent:true,opacity:0.7});
  const fGeo=new THREE.PlaneGeometry(0.2*sz,0.15*sz);
  const lf=new THREE.Mesh(fGeo,fMat); lf.position.set(-0.1*sz,-s[1]*sz*0.3,s[2]*sz*0.8); lf.rotation.y=0.5; group.add(lf);
  const rf=lf.clone(); rf.position.z=-s[2]*sz*0.8; rf.rotation.y=-0.5; group.add(rf);
  const df=new THREE.Mesh(new THREE.PlaneGeometry(s[0]*sz*0.4,0.15*sz),fMat);
  df.position.set(0,s[1]*sz*0.5,0); df.rotation.x=-0.3; group.add(df);
  if(species.rarity==='legendary'){
    group.add(new THREE.PointLight(0xFFD700,2,8));
    const aura=new THREE.Mesh(new THREE.SphereGeometry(s[0]*sz*1.3,12,8),
      new THREE.MeshBasicMaterial({color:0xFFD700,transparent:true,opacity:0.08,side:THREE.BackSide}));
    group.add(aura);
  }
  return group;
}

function getWaterHeight(x,z,t){
  return Math.sin(x*0.5+t*1.2)*0.12+Math.sin(z*0.7+t*0.8)*0.08+Math.sin((x+z)*0.3+t*1.5)*0.06;
}

  document.getElementById('weatherInfo').style.display='none';

function selectBiteFish(){
  const cfg=SCENE_CONFIGS[GS.currentScene];
  const bait=BAITS[GS.equippedBait];
  const available=FISH_SPECIES.filter(f=>{
    const sm=(cfg.sceneType==='freshwater'&&f.sceneType==='freshwater')||(cfg.sceneType==='sea'&&f.sceneType==='sea');
    if(!sm)return false;
    return bait.targetRarity.includes(f.rarity);
  });
  if(!available.length)return FISH_SPECIES[0];
  const weights=available.map(f=>{
    let w=f.biteRate*bait.biteBonus*Weather.getBiteMult();
    if(GS.luck>0&&(f.rarity==='rare'||f.rarity==='legendary')) w*=(1+GS.luck*0.1);
    return w;
  });
  const total=weights.reduce((a,b)=>a+b,0);
  let r=Math.random()*total;
  for(let i=0;i<available.length;i++){r-=weights[i];if(r<=0)return available[i];}
  return available[available.length-1];
}

function startCasting(){
  if(GS.phase!=='idle')return;
  if(GS.baitCount<=0){showMsg('没有鱼饵了！去商店购买');return;}
  SFX.playCast();
  GS.phase='casting'; GS.castPower=0; GS.castHolding=true;
  document.getElementById('powerBar').style.display='block';
  updateControls();
}

function releaseCast(){
  if(GS.phase!=='casting')return;
  GS.castHolding=false;
  document.getElementById('powerBar').style.display='none';
  const rod=RODS[GS.equippedRod];
  const dist=rod.castDist*GS.castPower*0.5+5;
  const angle=(Math.random()-0.5)*0.4;
  GS.bobberTarget={x:Math.sin(angle)*dist, z:-Math.cos(angle)*dist};
  GS.bobberStartPos={x:camera.position.x+0.3,y:camera.position.y-0.1,z:camera.position.z-0.8};
  GS.bobberFlyT=0; GS.phase='flying';
  GS.baitCount--; updateHUD(); updateControls();
}

function startWaiting(){
  GS.phase='waiting';
  const fish=selectBiteFish();
  GS.hookedFish=fish;
  GS.hookedWeight=fish.minW+Math.random()*(fish.maxW-fish.minW);
  const baseWait=4+Math.random()*12;
  const baitBonus=BAITS[GS.equippedBait].biteBonus;
  GS.biteTimer=baseWait/(fish.biteRate*baitBonus*Weather.getBiteMult());
  SFX.playSplash();
  Particles.splash(GS.bobberTarget.x,0.1,GS.bobberTarget.z,15);
  if(waterMaterial){
    waterMaterial.uniforms.uBobberPos.value.set(GS.bobberTarget.x,GS.bobberTarget.z);
    waterMaterial.uniforms.uSplashTime.value=elapsed;
  }
  updateControls();
}

function startBite(){
  GS.phase='bite'; GS.biteWindow=2.5;
  document.getElementById('biteAlert').style.display='block';
  SFX.playBite();
  Particles.splash(GS.bobberTarget.x,0.1,GS.bobberTarget.z,10);
  updateControls();
}

function hookFish(){
  if(GS.phase!=='bite')return;
  GS.phase='reeling';
  GS.tension=15; GS.fishStamina=1.0; GS.reelingMouse=false;
  GS.fishDir=Math.random()>0.5?1:-1;
  GS.fishDirTimer=1+Math.random()*2;
  GS.playerDir=0; GS.reelClickTimer=0;
  document.getElementById('biteAlert').style.display='none';
  document.getElementById('tensionBar').style.display='block';
  document.getElementById('dirIndicator').style.display='block';
  if(fishMesh)scene.remove(fishMesh);
  fishMesh=createFishModel(GS.hookedFish,GS.hookedWeight);
  fishMesh.position.set(GS.bobberTarget.x,-0.5,GS.bobberTarget.z);
  scene.add(fishMesh);
  updateControls();
}

function fishCaught(){
  GS.phase='caught';
  document.getElementById('tensionBar').style.display='none';
  document.getElementById('dirIndicator').style.display='none';
  const fish=GS.hookedFish, weight=GS.hookedWeight;
  const value=Math.round(fish.baseValue*(weight/fish.minW));
  GS.coins+=value; GS.totalCaught++; GS.totalEarned+=value;
  GS.currentStreak++; if(GS.currentStreak>GS.bestStreak)GS.bestStreak=GS.currentStreak;
  GS.luck=Math.min(10,GS.currentStreak);
  if(weight>GS.maxWeight) GS.maxWeight=weight;

  if(!GS.collection[fish.id]) GS.collection[fish.id]={caught:true,bestWeight:weight,totalCount:1};
  else{const c=GS.collection[fish.id];c.totalCount++;if(weight>c.bestWeight)c.bestWeight=weight;}

  if(fishMesh){Particles.celebrate(fishMesh.position.x,0.5,fishMesh.position.z);Particles.splash(fishMesh.position.x,0.1,fishMesh.position.z,25);}
  SFX.playCatch();

  const rarLabel={common:'普通',uncommon:'优良',rare:'稀有',legendary:'传说'};
  const wr=weight/fish.maxW;
  const stars=wr>0.8?'★★★★★':wr>0.6?'★★★★☆':wr>0.4?'★★★☆☆':wr>0.2?'★★☆☆☆':'★☆☆☆☆';
  document.getElementById('catchTitle').textContent=fish.rarity==='legendary'?'⭐ 传说级！':'钓到了！';
  document.getElementById('catchIcon').textContent=fish.icon;
  document.getElementById('catchName').textContent=fish.name+' ('+rarLabel[fish.rarity]+')';
  document.getElementById('catchWeight').textContent='重量: '+weight.toFixed(2)+' kg';
  document.getElementById('catchStars').textContent=stars;
  document.getElementById('catchValue').textContent='💰 +'+value;
  document.getElementById('catchModal').classList.add('show');
  if(fishMesh){scene.remove(fishMesh);fishMesh=null;}
  updateHUD();
  AchSys.check();
  updateControls();
}

function fishLost(reason){
  GS.phase='idle'; GS.currentStreak=0; GS.luck=0; GS.hookedFish=null;
  document.getElementById('tensionBar').style.display='none';
  document.getElementById('biteAlert').style.display='none';
  document.getElementById('dirIndicator').style.display='none';
  if(fishMesh){scene.remove(fishMesh);fishMesh=null;}
  if(bobberGroup) bobberGroup.visible=false;
  if(fishingLine) fishingLine.visible=false;
  showMsg(reason); updateControls();
}

function closeCatch(){
  document.getElementById('catchModal').classList.remove('show');
  GS.phase='idle';
  if(bobberGroup) bobberGroup.visible=false;
  if(fishingLine) fishingLine.visible=false;
  updateControls();
}

let currentShopTab='rod';
function openShop(){document.getElementById('shopPanel').classList.add('show');document.getElementById('shopCoins').textContent=GS.coins;renderShopTab(currentShopTab);}
function closeShop(){document.getElementById('shopPanel').classList.remove('show');}
function switchTab(tab){currentShopTab=tab;document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');renderShopTab(tab);}

function renderShopTab(tab){
  const grid=document.getElementById('shopGrid'); grid.innerHTML='';
  const items=tab==='rod'?RODS:tab==='line'?LINES:BAITS;
  const owned=tab==='rod'?GS.ownedRods:tab==='line'?GS.ownedLines:GS.ownedBaits;
  const equipped=tab==='rod'?GS.equippedRod:tab==='line'?GS.equippedLine:GS.equippedBait;
  items.forEach((item,i)=>{
    const isOwned=owned.includes(i), isEquipped=equipped===i;
    const div=document.createElement('div');
    div.className='shop-item'+(isEquipped?' equipped':isOwned?' owned':'');
    let btn='';
    if(tab==='bait'){
      const can=GS.coins>=item.cost;
      btn=`<button class="shop-btn ${can?'buy':'disabled'}" onclick="buyBait(${i})">购买 x${item.packSize} (${item.cost}💰)</button>`;
    }else if(isEquipped){
      btn='<button class="shop-btn equipped-btn">装备中</button>';
    }else if(isOwned){
      btn=`<button class="shop-btn equip" onclick="equipItem('${tab}',${i})">装备</button>`;
    }else{
      const can=GS.coins>=item.cost;
      btn=`<button class="shop-btn ${can?'buy':'disabled'}" onclick="buyEquip('${tab}',${i})">购买 (${item.cost}💰)</button>`;
    }
    div.innerHTML=`<div class="item-info"><h3>${item.name}</h3><p>${item.desc}</p></div>${btn}`;
    grid.appendChild(div);
  });
}

function buyEquip(type,idx){
  const items=type==='rod'?RODS:LINES;
  const owned=type==='rod'?GS.ownedRods:type==='line'?GS.ownedLines:GS.ownedBaits;
  if(GS.coins<items[idx].cost){showMsg('金币不足！');return;}
  GS.coins-=items[idx].cost; owned.push(idx);
  document.getElementById('shopCoins').textContent=GS.coins;
  updateHUD(); renderShopTab(currentShopTab);
  showMsg('购买了 '+items[idx].name+'！');
}

function buyBait(idx){
  if(GS.coins<BAITS[idx].cost){showMsg('金币不足！');return;}
  GS.coins-=BAITS[idx].cost; GS.baitCount+=BAITS[idx].packSize;
  document.getElementById('shopCoins').textContent=GS.coins;
  updateHUD(); renderShopTab(currentShopTab);
  showMsg('购买了 '+BAITS[idx].name+' x'+BAITS[idx].packSize+'！');
}

function equipItem(type,idx){
  if(type==='rod')GS.equippedRod=idx;
  else if(type==='line')GS.equippedLine=idx;
  else GS.equippedBait=idx;
  updateHUD(); renderShopTab(currentShopTab);
}

function openCollection(){document.getElementById('collectionPanel').classList.add('show');renderCollection();}

function renderCollection(){
  const content=document.getElementById('collContent');
  const progress=document.getElementById('collProgress');
  if(currentCollTab==='fish'){
    let caught=0;
    const rl={common:'普通',uncommon:'优良',rare:'稀有',legendary:'传说'};
    let html='<div class="coll-grid">';
    FISH_SPECIES.forEach(fish=>{
      const d=GS.collection[fish.id]; const ic=!!d; if(ic)caught++;
      html+=`<div class="coll-card${ic?' caught':' unknown'}"><div class="fish-icon">${ic?fish.icon:'❓'}</div><div class="fish-name">${ic?fish.name:'???'}</div><div class="fish-rarity rarity-${fish.rarity}">${rl[fish.rarity]}</div>${ic?`<div class="fish-detail">最佳: ${d.bestWeight.toFixed(2)}kg<br>捕获: ${d.totalCount}次</div>`:`<div class="fish-detail">${fish.sceneType==='sea'?'海水':'淡水'}鱼种</div>`}</div>`;
    });
    html+='</div>'; content.innerHTML=html;
    progress.textContent=caught+' / '+FISH_SPECIES.length+' 已记录';
  }else{
    let html='<div class="ach-grid">';
    ACHIEVEMENTS.forEach(a=>{
      const u=AchSys.unlocked.includes(a.id);
      html+=`<div class="ach-card${u?' unlocked':''}"><div class="ach-icon">${u?a.icon:'🔒'}</div><div class="ach-info"><div class="ach-name">${u?a.name:'???'}</div><div class="ach-desc">${a.desc}</div></div></div>`;
    });
    html+='</div>'; content.innerHTML=html;
    progress.textContent='成就: '+AchSys.unlocked.length+' / '+ACHIEVEMENTS.length;
  }
}

// ===================== 输入 =====================
document.addEventListener('mousedown',e=>{
  if(e.target.closest('#overlay,#hud,#shopPanel,#collectionPanel,#catchModal'))return;
  SFX.resume();
  if(GS.phase==='idle') startCasting();
  else if(GS.phase==='bite') hookFish();
  else if(GS.phase==='reeling') GS.reelingMouse=true;
});
document.addEventListener('mouseup',e=>{
  if(GS.phase==='casting'&&GS.castHolding) releaseCast();
  if(GS.phase==='reeling') GS.reelingMouse=false;
});
document.addEventListener('keydown',e=>{
  if(e.key==='F2'){e.preventDefault();if(window.electronAPI&&window.electronAPI.backToLauncher)window.electronAPI.backToLauncher();}
  if(e.key==='F5'){e.preventDefault();saveGame();showMsg('游戏已保存');}
  if(e.key==='F9'){e.preventDefault();loadGame();showMsg('游戏已读取');}
  if(GS.phase==='reeling'){
    if(e.key==='a'||e.key==='A') GS.playerDir=-1;
    if(e.key==='d'||e.key==='D') GS.playerDir=1;
  }
});
document.addEventListener('keyup',e=>{
  if((e.key==='a'||e.key==='A')&&GS.playerDir===-1) GS.playerDir=0;
  if((e.key==='d'||e.key==='D')&&GS.playerDir===1) GS.playerDir=0;
});

// ===================== 保存/加载 =====================
const SAVE_KEY='fishingGameSave';
function saveGame(){
  const data={
    coins:GS.coins,equippedRod:GS.equippedRod,equippedLine:GS.equippedLine,
    equippedBait:GS.equippedBait,baitCount:GS.baitCount,
    ownedRods:GS.ownedRods,ownedLines:GS.ownedLines,ownedBaits:GS.ownedBaits,
    collection:GS.collection,currentScene:GS.currentScene,
    totalCaught:GS.totalCaught,maxWeight:GS.maxWeight,totalEarned:GS.totalEarned,
    bestStreak:GS.bestStreak,achievements:AchSys.unlocked,
  };
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(data));}catch(e){}
}

function loadGame(){
  const raw=localStorage.getItem(SAVE_KEY);
  if(!raw){showMsg('没有存档');return;}
  try{
    const d=JSON.parse(raw);
    GS.coins=d.coins||150; GS.equippedRod=d.equippedRod||0;
    GS.equippedLine=d.equippedLine||0; GS.equippedBait=d.equippedBait||0;
    GS.baitCount=d.baitCount||10;
    GS.ownedRods=d.ownedRods||[0]; GS.ownedLines=d.ownedLines||[0]; GS.ownedBaits=d.ownedBaits||[0];
    GS.collection=d.collection||{};
    GS.totalCaught=d.totalCaught||0; GS.maxWeight=d.maxWeight||0; GS.totalEarned=d.totalEarned||0;
    GS.bestStreak=d.bestStreak||0;
    AchSys.unlocked=d.achievements||[];
    if(d.currentScene&&SCENE_CONFIGS[d.currentScene]) startGame(d.currentScene);
    updateHUD();
  }catch(e){showMsg('存档损坏');}
}

// 自动保存 + 蚯蚓恢复
setInterval(()=>{
  if(GS.phase!=='menu') saveGame();
  if(GS.baitCount<5&&GS.equippedBait===0) GS.baitCount++;
},30000);

// ===================== 游戏循环 =====================
let elapsed=0;

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  elapsed+=dt;
  const t=elapsed;

  if(waterMaterial) waterMaterial.uniforms.uTime.value=t;
  Weather.update(dt);
  Particles.update(dt);
  Rain.update(dt);

  // 蓄力
  if(GS.phase==='casting'&&GS.castHolding){
    GS.castPower=Math.min(1,GS.castPower+dt*0.7);
    document.getElementById('powerFill').style.height=(GS.castPower*100)+'%';
  }

  // 飞行
  if(GS.phase==='flying'){
    GS.bobberFlyT+=dt*1.5;
    if(GS.bobberFlyT>=1){GS.bobberFlyT=1;startWaiting();}
    const ft=GS.bobberFlyT, sp=GS.bobberStartPos, ep=GS.bobberTarget;
    const px=sp.x+(ep.x-sp.x)*ft, pz=sp.z+(ep.z-sp.z)*ft;
    const py=sp.y+(ep.y===undefined?0:ep.y-sp.y)*ft+Math.sin(ft*Math.PI)*5;
    if(bobberGroup){bobberGroup.visible=true;bobberGroup.position.set(px,py,pz);}
    updateLine(px,py,pz);
  }

  // 等待
  if(GS.phase==='waiting'){
    GS.biteTimer-=dt;
    const bx=GS.bobberTarget.x, bz=GS.bobberTarget.z;
    const wy=getWaterHeight(bx,bz,t);
    if(bobberGroup){
      bobberGroup.position.set(bx,wy+0.05,bz);
      if(GS.biteTimer<2){
        const shake=(2-GS.biteTimer)*0.02;
        bobberGroup.position.x+=(Math.random()-0.5)*shake;
        bobberGroup.position.z+=(Math.random()-0.5)*shake;
      }
    }
    updateLine(bx,wy+0.15,bz);
    if(GS.biteTimer<=0) startBite();
  }

  // 咬钩
  if(GS.phase==='bite'){
    GS.biteWindow-=dt;
    const bx=GS.bobberTarget.x, bz=GS.bobberTarget.z;
    const wy=getWaterHeight(bx,bz,t);
    if(bobberGroup) bobberGroup.position.set(bx,wy-0.15+Math.sin(t*15)*0.03,bz);
    updateLine(bx,wy-0.05,bz);
    if(GS.biteWindow<=0) fishLost('鱼跑了！反应太慢！');
  }

  // 收线
  if(GS.phase==='reeling'){
    const fish=GS.hookedFish;
    const lineMax=LINES[GS.equippedLine].maxTension;
    const rodStr=RODS[GS.equippedRod].lineStr;

    // 鱼方向变化
    GS.fishDirTimer-=dt;
    if(GS.fishDirTimer<=0){
      const rate=fish.dirFreq||1.0;
      GS.fishDirTimer=(0.5+Math.random()*1.5)/rate;
      if(fish.rarity==='legendary'&&Math.random()<0.2){
        GS.fishDir=-GS.fishDir; GS.tension+=10;
      }else{
        GS.fishDir=Math.random()>0.5?1:-1;
      }
    }

    // 方向对抗
    let dirBonus=0;
    if(GS.playerDir!==0&&GS.playerDir===-GS.fishDir) dirBonus=1;
    else if(GS.playerDir!==0&&GS.playerDir===GS.fishDir) dirBonus=-0.5;

    // 鱼拉力
    GS.tension+=fish.fight*10*dt*(0.5+Math.random()*0.5);

    if(GS.reelingMouse){
      GS.tension+=18*dt;
      if(dirBonus>0){GS.fishStamina-=(0.6+rodStr*0.5)*dt;GS.tension-=8*dt;}
      else if(dirBonus<0){GS.fishStamina-=0.15*dt;GS.tension+=5*dt;}
      else{GS.fishStamina-=(0.4+rodStr*0.3)*dt;GS.tension-=3*dt;}
      GS.reelClickTimer-=dt;
      if(GS.reelClickTimer<=0){SFX.playReelClick();GS.reelClickTimer=0.15;}
    }else{
      GS.tension-=20*dt; GS.fishStamina+=0.1*dt;
      if(dirBonus>0) GS.tension-=5*dt;
    }

    GS.tension=Math.max(0,Math.min(lineMax,GS.tension));
    GS.fishStamina=Math.max(0,Math.min(1,GS.fishStamina));

    // 鱼动画
    if(fishMesh){
      const bx=GS.bobberTarget.x, bz=GS.bobberTarget.z;
      const dist=GS.fishStamina*3;
      const surfY=GS.fishStamina<0.3?0.2-GS.fishStamina:-0.3;
      fishMesh.position.set(
        bx+Math.sin(t*2)*dist+GS.fishDir*GS.fishStamina*2,
        surfY+Math.sin(t*3)*0.1,
        bz+Math.cos(t*1.5)*dist
      );
      fishMesh.rotation.y=Math.atan2(Math.cos(t*2)*dist,Math.sin(t*1.5)*dist)+Math.PI/2;
    }

    // 浮标
    const bx=GS.bobberTarget.x, bz=GS.bobberTarget.z;
    const wy=getWaterHeight(bx,bz,t);
    if(bobberGroup){
      bobberGroup.position.set(
        bx+GS.fishDir*GS.fishStamina*2+Math.sin(t*2)*GS.fishStamina,
        wy-0.05+Math.sin(t*8)*0.03,
        bz+Math.cos(t*1.5)*GS.fishStamina
      );
    }
    updateLine(bobberGroup.position.x,wy+0.1,bobberGroup.position.z);

    // 鱼竿弯曲
    if(rodShaft){
      const bend=GS.tension/lineMax*0.3;
      rodShaft.rotation.x=-Math.PI/4-bend+GS.fishDir*bend*0.2;
    }

    // 张力条
    const pct=GS.tension/lineMax*100;
    const fill=document.getElementById('tensionFill');
    fill.style.width=pct+'%';
    fill.style.background=pct<50?'#4caf50':pct<75?'#ff9800':'#f44336';

    // 方向指示器
    const dirArrow=document.getElementById('dirArrow');
    dirArrow.textContent=GS.fishDir>0?'→':'←';
    dirArrow.style.transform='scale('+(1+fish.fight*0.5)+')';
    dirArrow.style.color=GS.playerDir===-GS.fishDir?'#4caf50':GS.playerDir===GS.fishDir?'#f44336':'#fff';

    // 判定
    if(GS.tension>=lineMax){SFX.playSnap();fishLost('线断了！张力过高！');}
    else if(GS.fishStamina<=0) fishCaught();

    // 挣扎水花
    if(Math.random()<fish.fight*dt*3){
      const fx=fishMesh?fishMesh.position.x:bx, fz=fishMesh?fishMesh.position.z:bz;
      Particles.splash(fx,0.05,fz,3);
    }
  }

  renderer.render(scene,camera);
}

function updateLine(bx,by,bz){
  if(!fishingLine||!bobberGroup)return;
  fishingLine.visible=true;
  const tipWorld=new THREE.Vector3(0.3,-0.1+1.27,-0.8-1.27);
  camera.localToWorld(tipWorld);
  const segments=12, pts=[];
  const start=tipWorld, end=new THREE.Vector3(bx,by,bz);
  const lineMax=LINES[GS.equippedLine].maxTension;
  const tr=GS.tension/lineMax;
  for(let i=0;i<=segments;i++){
    const t2=i/segments;
    const x=start.x+(end.x-start.x)*t2;
    const z=start.z+(end.z-start.z)*t2;
    const sag=Math.sin(t2*Math.PI)*(1-tr)*2.0;
    const y=start.y+(end.y-start.y)*t2-sag;
    pts.push(new THREE.Vector3(x,y,z));
  }
  fishingLine.geometry.setFromPoints(pts);
}

// ===================== 启动 =====================
initThree();
animate();

const savedData=localStorage.getItem(SAVE_KEY);
if(savedData){
  try{
    const d=JSON.parse(savedData);
    GS.coins=d.coins||150; GS.equippedRod=d.equippedRod||0;
    GS.equippedLine=d.equippedLine||0; GS.equippedBait=d.equippedBait||0;
    GS.baitCount=d.baitCount||10;
    GS.ownedRods=d.ownedRods||[0]; GS.ownedLines=d.ownedLines||[0]; GS.ownedBaits=d.ownedBaits||[0];
    GS.collection=d.collection||{};
    GS.totalCaught=d.totalCaught||0; GS.maxWeight=d.maxWeight||0; GS.totalEarned=d.totalEarned||0;
    GS.bestStreak=d.bestStreak||0;
    AchSys.unlocked=d.achievements||[];
  }catch(e){}
}
</script>
