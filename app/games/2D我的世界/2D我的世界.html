                    div.addEventListener('click', () => craftItem(recipe));
                }

                list.appendChild(div);
            }
        }

        function craftItem(recipe) {
            // 检查材料
            for (const [item, count] of recipe.ingredients) {
                if (countInInventory(item) < count) {
                    return;
                }
            }

            // 消耗材料
            for (const [item, count] of recipe.ingredients) {
                removeFromInventory(item, count);
            }

            // 添加结果
            addToInventory(recipe.result.item, recipe.result.count);

            // 播放合成成功声音
            soundSystem.playCraft();

            // 刷新配方列表
            renderCraftingRecipes();
        }

        // ==================== 交易系统 ====================
        function toggleTradeMenu() {
            tradeMenuOpen = !tradeMenuOpen;
            const menu = document.getElementById('tradeMenu');
            menu.classList.toggle('show', tradeMenuOpen);

            // 关闭合成菜单
            if (tradeMenuOpen && craftingMenuOpen) {
                craftingMenuOpen = false;
                document.getElementById('craftingMenu').classList.remove('show');
            }

            if (tradeMenuOpen) {
                renderTradeList();
            }
        }

        function renderTradeList() {
            const list = document.getElementById('tradeList');
            list.innerHTML = '';

            for (const trade of TRADES) {
                const div = document.createElement('div');
                div.className = 'recipe';

                const canTrade = countInInventory(trade.ingredient.item) >= trade.ingredient.count;

                if (!canTrade) {
                    div.style.opacity = '0.5';
                }

                const ingredientName = BLOCK_PROPS[trade.ingredient.item] ? BLOCK_PROPS[trade.ingredient.item].name : trade.ingredient.item;
                const resultName = BLOCK_PROPS[trade.result.item] ? BLOCK_PROPS[trade.result.item].name : trade.result.item;

                const itemsDiv = document.createElement('div');
                itemsDiv.className = 'recipe-items';
                itemsDiv.textContent = `${ingredientName} x${trade.ingredient.count}`;

                const arrow = document.createElement('span');
                arrow.className = 'recipe-arrow';
                arrow.textContent = '→';

                const result = document.createElement('span');
                result.className = 'recipe-result';
                result.textContent = `${resultName} x${trade.result.count}`;

                div.appendChild(itemsDiv);
                div.appendChild(arrow);
                div.appendChild(result);

                if (canTrade) {
                    div.addEventListener('click', () => executeTrade(trade));
                }

                list.appendChild(div);
            }
        }

        function executeTrade(trade) {
            // 检查材料
            if (countInInventory(trade.ingredient.item) < trade.ingredient.count) {
                return;
            }

            // 消耗材料
            removeFromInventory(trade.ingredient.item, trade.ingredient.count);

            // 添加结果
            addToInventory(trade.result.item, trade.result.count);

            // 播放交易成功声音
            soundSystem.playCraft();

            // 刷新交易列表
            renderTradeList();
        }

        // ==================== 方块交互 ====================
        function placeBlock(x, y) {
            if (x < 0 || x >= CONFIG.WORLD_WIDTH || y < 0 || y >= CONFIG.WORLD_HEIGHT) return;
            if (world[y][x] !== BLOCKS.AIR) return;

            const selectedItem = getSelectedItem();
            if (!selectedItem || !selectedItem.item || selectedItem.count <= 0) return;

            // 工具不能放置
            if (TOOL_PROPS[selectedItem.item]) return;

            const blockType = selectedItem.item;

            // 检查是否与玩家重叠
            const blockLeft = x * CONFIG.BLOCK_SIZE;
            const blockRight = blockLeft + CONFIG.BLOCK_SIZE;
            const blockTop = y * CONFIG.BLOCK_SIZE;
            const blockBottom = blockTop + CONFIG.BLOCK_SIZE;

            if (!(player.x + player.width <= blockLeft ||
                  player.x >= blockRight ||
                  player.y + player.height <= blockTop ||
                  player.y >= blockBottom)) {
                return;
            }

            world[y][x] = blockType;
            soundSystem.playPlace(blockType);
            selectedItem.count--;
            if (selectedItem.count <= 0) {
                selectedItem.item = null;
            }
            updateUI();
        }

        // ==================== 事件监听 ====================
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;

            if (e.code >= 'Digit1' && e.code <= 'Digit9') {
                player.selectedSlot = parseInt(e.code.replace('Digit', '')) - 1;
                updateUISelection();
            }

            if (e.code === 'KeyE') {
                if (tradeMenuOpen) {
                    toggleTradeMenu();
                } else {
                    toggleCraftingMenu();
                }
            }

            if (e.code === 'KeyM') {
                toggleSound();
            }

            if (e.code === 'KeyO') {
                saveGame();
            }

            if (e.code === 'KeyL') {
                loadGame();
            }

            if (e.code === 'Escape') {
                if (tradeMenuOpen) {
                    toggleTradeMenu();
                } else if (craftingMenuOpen) {
                    toggleCraftingMenu();
                }
            }

            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        canvas.addEventListener('mousedown', (e) => {
            e.preventDefault();

            mouseDown = true;
            mouseButton = e.button;

            const blockX = Math.floor((mouseX + camera.x) / CONFIG.BLOCK_SIZE);
            const blockY = Math.floor((mouseY + camera.y) / CONFIG.BLOCK_SIZE);

            if (e.button === 2) {
                // 右键：放置方块或吃食物
                const selectedItem = getSelectedItem();

                // 检查是否是食物
                if (selectedItem && selectedItem.item && BLOCK_PROPS[selectedItem.item] && BLOCK_PROPS[selectedItem.item].food) {
                    // 吃食物
                    const foodValue = BLOCK_PROPS[selectedItem.item].food;
                    player.hunger = Math.min(CONFIG.MAX_HUNGER, player.hunger + foodValue);
                    player.health = Math.min(CONFIG.MAX_HEALTH, player.health + Math.floor(foodValue / 2));

                    selectedItem.count--;
                    if (selectedItem.count <= 0) {
                        selectedItem.item = null;
                    }

                    soundSystem.playPickup();
                    updateStats();
                    updateUI();
                    return;
                }

                placeBlock(blockX, blockY);
            } else if (e.button === 0) {
                // 检查是否点击了生物
                const worldMouseX = mouseX + camera.x;
                const worldMouseY = mouseY + camera.y;

                for (const entity of entities) {
                    if (worldMouseX >= entity.x && worldMouseX <= entity.x + entity.width &&
                        worldMouseY >= entity.y && worldMouseY <= entity.y + entity.height) {

                        // 计算攻击距离
                        const dx = player.x + player.width / 2 - (entity.x + entity.width / 2);
                        const dy = player.y + player.height / 2 - (entity.y + entity.height / 2);
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < CONFIG.BLOCK_SIZE * 5) {
                            // 如果是村民，打开交易菜单
                            if (entity.type === ENTITY_TYPES.VILLAGER) {
                                if (!tradeMenuOpen) {
                                    console.log('点击村民，打开交易菜单');
                                    toggleTradeMenu();
                                    showNotification('💰 打开交易菜单', 'info');
                                }
                                return;
                            }

                            // 其他生物进行攻击
                            // 计算伤害
                            const selectedItem = getSelectedItem();
                            let damage = 1;

                            if (selectedItem && selectedItem.item && TOOL_PROPS[selectedItem.item]) {
                                // 使用工具的伤害值
                                damage = TOOL_PROPS[selectedItem.item].damage || 1;
                            }

                            entity.takeDamage(damage);
                            return; // 攻击了生物，不破坏方块
                        }
                    }
                }
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            mouseDown = false;
        });

        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();

            if (e.deltaY > 0) {
                player.selectedSlot = (player.selectedSlot + 1) % 9;
            } else {
                player.selectedSlot = (player.selectedSlot - 1 + 9) % 9;
            }

            updateUISelection();
        });

        // ==================== 游戏循环 ====================
        let lastTime = 0;

        function gameLoop(timestamp) {
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            updatePlayer();
            updateDroppedItems();
            updateEntities();
            updateEntitySpawning();
            updateCamera();
            updateBreaking(deltaTime);
            render();

            requestAnimationFrame(gameLoop);
        }

        function updateEntities() {
            for (const entity of entities) {
                entity.update();
            }
        }

        // ==================== 初始化 ====================
        // 声音控制
        function toggleSound() {
            const enabled = soundSystem.toggle();
            const button = document.getElementById('soundToggle');
            button.textContent = enabled ? '🔊 声音: 开' : '🔇 声音: 关';

            // 初始化音频上下文（用户交互后）
            if (enabled) {
                soundSystem.init();
            }
        }

        document.getElementById('soundToggle').addEventListener('click', () => {
            toggleSound();
        });

        initWorld();
        updateUI();
        updateStats();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
