<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>陆空对战 · 类战争雷霆</title>
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color: #eee;
  user-select: none;
}

#game-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  z-index: 0;
  cursor: crosshair; /* 默认显示十字光标；JS 在真正指针锁定后改 none（锁失败时玩家能看见、知道要再点）*/
}

.hidden { display: none !important; }

/* 设置面板从暂停面板/战斗中打开时，抬高到模态之上（暂停遮罩 z-200） */
#settings.raised { z-index: 300; }

/* —— 起始菜单 —— */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 35%, rgba(40,60,45,0.6), rgba(10,12,14,0.92));
  backdrop-filter: blur(2px);
}

.menu-card {
  text-align: center;
  padding: 14px 22px 18px;
  max-height: 96vh;
  overflow-y: auto;
}

.menu-card h1 {
  font-size: 30px;
  letter-spacing: 4px;
  color: #cfe8c0;
  text-shadow: 0 2px 18px rgba(120, 200, 120, 0.4);
  display: inline;
}

.subtitle {
  font-size: 13px;
  color: #9fb0a0;
  letter-spacing: 2px;
  display: inline;
  margin-left: 10px;
}

.modes {
  margin: 14px 0 10px;
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;   /* 窄窗口：三卡放不下自动换行，不再横向溢出 */
}

.mode-btn {
  width: 200px;
  max-width: 100%;
  padding: 12px 12px;
  border-radius: 14px;
  border: 1px solid rgba(150, 180, 150, 0.3);
  background: linear-gradient(160deg, rgba(60,80,60,0.7), rgba(30,40,35,0.7));
  color: #e8f0e2;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
}

.mode-btn:hover {
  transform: translateY(-3px);
  border-color: rgba(180, 220, 170, 0.7);
  box-shadow: 0 8px 28px rgba(80, 140, 90, 0.35);
}

.mode-icon { font-size: 38px; }
.mode-title { font-size: 20px; font-weight: 600; }
.mode-desc { font-size: 12px; color: #a9bba9; line-height: 1.5; }

.tip { font-size: 13px; color: #8da08d; }

/* —— 金币 / 研发点 —— */
.wallet { display:flex; gap:22px; justify-content:center; margin-top:10px; }
.rp { font-size:18px; font-weight:700; color:#9fe0ff; }
.tech-btn { width:auto; margin:0; padding:9px 10px; flex-direction:row; gap:6px; font-size:14px; }
/* 主菜单功能按钮（教学/每日/科技/成就/战绩/设置）：自适应列数，任何数量都对称 */
#menu-actions { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:8px; margin:10px 0 4px; }

/* —— 出战选择页 —— */
.loadout-card { background:rgba(25,32,28,0.95); border:1px solid rgba(150,180,150,0.35); border-radius:16px; padding:28px 40px; text-align:center; max-width:560px; }
.lo-vehicle { display:flex; align-items:center; justify-content:center; gap:18px; margin:16px 0; }
.lo-nav { font-size:22px; background:rgba(60,80,60,0.7); color:#e8f0e2; border:1px solid rgba(150,180,150,0.4); border-radius:10px; width:42px; height:42px; cursor:pointer; }
.lo-nav:disabled { opacity:0.3; cursor:default; }
.lo-info { min-width:240px; }
.lo-icon { font-size:54px; }
.lo-name { font-size:22px; font-weight:700; color:#cfe8c0; }
.lo-weapon { font-size:13px; color:#ffd86b; margin-top:4px; }
.lo-stats { margin-top:10px; display:flex; flex-direction:column; gap:4px; }
.stat { display:flex; justify-content:space-between; font-size:12px; color:#b9cbb9; gap:10px; }
.stat-pips { display:flex; gap:3px; }
.pip { width:14px; height:7px; border-radius:2px; background:rgba(255,255,255,0.15); }
.pip.on { background:#7CFC00; }
.lo-summary { font-size:13px; color:#9fb0a0; margin:6px 0 12px; }
.lo-actions { display:flex; gap:14px; justify-content:center; }
.lo-btn { padding:10px 22px; font-size:15px; border-radius:10px; border:1px solid rgba(150,180,150,0.4); background:rgba(60,80,60,0.7); color:#e8f0e2; cursor:pointer; }
.lo-btn:hover { background:rgba(90,120,90,0.85); }
.lo-btn.primary { background:linear-gradient(160deg,rgba(80,140,90,0.95),rgba(50,90,60,0.95)); border-color:rgba(180,220,170,0.85); color:#fff; }

/* —— 科技树 —— */
#techtree.overlay { flex-direction:column; align-items:center; justify-content:flex-start; overflow:auto; padding:40px 20px; }
.tt-head { display:flex; justify-content:space-between; align-items:center; width:100%; max-width:920px; margin-bottom:14px; }
.tt-section { width:100%; max-width:920px; margin-bottom:18px; }
.tt-kind { width:100%; max-width:920px; font-size:20px; font-weight:bold; color:#fff; margin:22px 0 10px; text-align:left; border-bottom:1px solid rgba(150,180,150,0.35); padding-bottom:6px; }
.tt-title { font-size:16px; color:#cfe8c0; margin-bottom:8px; }
.tt-row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
.tt-card { width:110px; padding:12px 6px 8px; border-radius:10px; border:1px solid rgba(150,180,150,0.3); background:rgba(30,40,35,0.8); text-align:center; cursor:pointer; position:relative; transition:transform 0.12s, border-color 0.12s; }
.tt-card:hover { transform:translateY(-2px); }
.tt-rank { position:absolute; top:4px; left:6px; font-size:10px; color:#8da08d; }
.tt-action { font-size:11px; margin-top:2px; }
.tt-card.researchable { border-color:rgba(120,200,255,0.7); }
.tt-card.researchable .tt-action { color:#9fe0ff; }
.tt-card.researched { border-color:rgba(255,216,107,0.85); }
.tt-card.researched .tt-action { color:#ffd86b; }
.tt-card.owned { border-color:rgba(124,252,0,0.55); }
.tt-card.owned .tt-action { color:#9fe0b0; }
.tt-card.selected { box-shadow:0 0 0 2px #7CFC00 inset; }
.tt-card.locked { opacity:0.45; cursor:default; }

/* —— 出战页：对局设置两列网格（标签+值高亮） —— */
.lo-group-label { font-size:12px; color:#8da08d; letter-spacing:3px; margin:14px 0 8px; }
#lo-toggles { display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; margin:0 0 4px; }
#lo-toggles .diff-btn { padding:9px 10px; font-size:13px; text-align:center; }
#lo-veh-ops { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin:12px 0 0; }
.diff-btn b { color:#ffe9a0; font-weight:600; }   /* 开关/循环按钮的"当前值"高亮，一眼扫出哪些开着 */

/* —— 设置页：开关组件（二值项不用滑杆） —— */
.switch { position:relative; display:inline-block; width:44px; height:24px; flex:0 0 44px; }
.switch input { opacity:0; width:0; height:0; position:absolute; }
.sw-track { position:absolute; inset:0; background:rgba(255,255,255,.15); border-radius:12px; cursor:pointer; transition:background .15s; }
.sw-track::before { content:''; position:absolute; left:3px; top:3px; width:18px; height:18px; border-radius:50%; background:#cddccd; transition:transform .15s; }
.switch input:checked + .sw-track { background:#5a9a5a; }
.switch input:checked + .sw-track::before { transform:translateX(20px); background:#fff; }

/* —— HUD：键位提示自动收起 —— */
#hint { cursor:pointer; pointer-events:auto; transition:opacity .4s; }
#hint.minimized { opacity:.5; font-size:12px; padding:4px 10px; }

/* —— HUD：右上角 ⏸/⚙ 常驻按钮（鼠标/触屏保底入口） —— */
#btn-corner { position:absolute; top:14px; right:18px; width:38px; height:38px; border-radius:10px;
  background:rgba(20,28,22,.55); border:1px solid rgba(150,180,150,.35); color:#cfe8c0;
  font-size:17px; line-height:36px; text-align:center; cursor:pointer; pointer-events:auto; user-select:none; }
#btn-corner:hover { background:rgba(60,80,60,.85); }

/* —— 通用模态（暂停面板/世界大战选载具，样式收敛出 JS 内联） —— */
.modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:200; }
.modal-card { background:rgba(20,28,20,.95); border:2px solid rgba(100,180,100,.4); border-radius:14px; padding:26px 36px; text-align:center; color:#eee; min-width:250px; }
.modal-title { font-size:24px; margin-bottom:6px; }
.modal-sub { font-size:13px; color:#aab; margin-bottom:18px; }
.modal-btn { display:block; width:100%; margin:6px 0; padding:10px; font-size:15px; color:#fff; border:none; border-radius:8px; cursor:pointer; }
.modal-btn.green { background:rgba(80,140,80,.9); }
.modal-btn.neutral { background:rgba(70,90,70,.85); }
.modal-btn.red { background:rgba(120,60,60,.9); }
.modal-btn:hover { filter:brightness(1.15); }
.ww-panel { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,.9);
  border:2px solid rgba(100,180,100,.4); border-radius:12px; padding:20px 24px; z-index:100; max-width:80vw; max-height:80vh; overflow-y:auto; color:#eee; }
.ww-cols { display:flex; gap:20px; }
.ww-kind { font-size:14px; margin-bottom:8px; }
.ww-row { margin:4px 0; padding:8px 14px; background:rgba(40,60,40,.6); border:1px solid #555; border-radius:6px; cursor:pointer; }
.ww-row.plane { background:rgba(40,50,70,.6); }
.ww-row.cant { opacity:.45; cursor:not-allowed; }
.ww-row:hover { filter:brightness(1.3); }
.ww-cost { color:#ffd86b; float:right; }

/* —— 科技树：顶栏钱包 / 工具行 / 二次确认条 / 卡片 tooltip —— */
.tt-wallet { font-size:15px; font-weight:700; letter-spacing:1px; white-space:nowrap; }
.tt-tools { display:flex; gap:8px; align-items:center; flex-wrap:wrap; width:100%; max-width:920px; margin:-4px 0 12px; }
.tt-tools .diff-btn { padding:4px 12px; font-size:12px; }
.tt-tools .sep2 { flex:1; }
#tt-confirm { width:100%; max-width:920px; margin:0 0 12px; padding:8px 14px; border-radius:10px;
  border:1px solid rgba(255,216,107,.5); background:rgba(60,50,20,.55); display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:13px; }
#tt-confirm .cbtn { padding:4px 14px; font-size:12px; border-radius:7px; border:1px solid rgba(150,180,150,.4); background:rgba(60,80,60,.8); color:#fff; cursor:pointer; }
#tt-confirm .cbtn.ok { background:rgba(120,90,30,.9); border-color:rgba(255,216,107,.6); }
.tt-card.confirm { box-shadow:0 0 0 2px #ffd86b inset; }
.tt-card:hover::after { content:attr(data-tip); position:absolute; left:50%; bottom:calc(100% + 6px); transform:translateX(-50%);
  background:rgba(10,14,12,.95); border:1px solid rgba(150,180,150,.4); border-radius:8px; padding:8px 10px;
  font-size:11px; line-height:1.7; color:#cfe8c0; white-space:pre; pointer-events:none; z-index:5; text-align:left; }

/* —— 金币（旧，保留） —— */
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin: 10px 0 2px;
}
.quests { display: flex; flex-direction: column; gap: 4px; margin: 6px 0 2px; width: 100%; }
.quest { display: flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 8px;
  background: rgba(38, 50, 42, 0.55); border: 1px solid rgba(150, 180, 150, 0.22); font-size: 12px; }
.quest .q-ico { font-size: 15px; }
.quest .q-body { flex: 1; text-align: left; min-width: 0; }
.quest .q-name { color: #dfe8d8; font-weight: 600; }
.quest .q-desc { color: #9fb0a0; font-size: 11px; margin-top: 1px; }
.quest .q-prog { height: 4px; border-radius: 3px; background: rgba(0, 0, 0, 0.4); margin-top: 3px; overflow: hidden; }
.quest .q-bar { height: 100%; background: linear-gradient(90deg, #7CFC00, #c8e878); border-radius: 3px; }
.quest .q-rw { color: #ffd870; font-size: 12px; white-space: nowrap; }
.quest.done { opacity: 0.62; }
.quest.done .q-name::after { content: ' ✓'; color: #7CFC00; }
.best { font-size: 13px; color: #ffd86b; letter-spacing: 0.5px; }
.money {
  margin-top: 10px;
  font-size: 18px;
  font-weight: 700;
  color: #ffd86b;
  letter-spacing: 1px;
  text-shadow: 0 1px 6px rgba(0,0,0,0.5);
}

/* —— 车库 / 商店 —— */
.garage-wrap { margin: 18px 0 6px; }
.garage-label { font-size: 13px; color: #9fb0a0; margin-bottom: 8px; letter-spacing: 1px; }
.garage {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
  max-width: 560px;
  margin: 0 auto;
}
.garage-card {
  padding: 10px 6px;
  border-radius: 10px;
  border: 1px solid rgba(150,180,150,0.3);
  background: rgba(30,40,35,0.7);
  color: #cddccd;
  cursor: pointer;
  text-align: center;
  transition: transform 0.12s, border-color 0.12s, background 0.12s;
}
.garage-card:hover { transform: translateY(-2px); border-color: rgba(180,220,170,0.6); }
.garage-card.selected {
  background: linear-gradient(160deg, rgba(80,120,80,0.9), rgba(50,75,50,0.9));
  border-color: rgba(180,220,170,0.9);
  color: #fff;
}
.garage-card.locked { opacity: 0.92; }
.g-icon { font-size: 22px; }
.g-name { font-size: 11px; margin-top: 2px; }
.g-state { font-size: 11px; color: #ffd86b; margin-top: 2px; }
.garage-card.selected .g-state { color: #9fe0b0; }

/* —— toast —— */
.toast {
  margin-top: 12px;
  font-size: 14px;
  color: #ff8a8a;
  opacity: 0;
  transition: opacity 0.2s;
  height: 18px;
}
.toast.show { opacity: 1; }

/* —— 难度选择 —— */
.difficulty {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 22px 0 4px;
}
.diff-label { font-size: 14px; color: #9fb0a0; letter-spacing: 2px; }
.diff-btn {
  padding: 6px 18px;
  font-size: 14px;
  border-radius: 18px;
  border: 1px solid rgba(150, 180, 150, 0.3);
  background: rgba(30, 40, 35, 0.7);
  color: #cddccd;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s, transform 0.12s;
}
.diff-btn:hover { transform: translateY(-1px); border-color: rgba(180, 220, 170, 0.6); }
.diff-btn.active {
  background: linear-gradient(160deg, rgba(80, 120, 80, 0.9), rgba(50, 75, 50, 0.9));
  border-color: rgba(180, 220, 170, 0.85);
  color: #fff;
}

/* —— 游戏内 HUD —— */
#hud {
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

#crosshair {
  position: absolute;
  top: 50%; left: 50%;
  width: 30px; height: 30px;
  transform: translate(-50%, -50%);
  pointer-events: none;
}
#crosshair::before, #crosshair::after {
  content: "";
  position: absolute;
  left: 50%; top: 50%;
  background: rgba(255, 230, 120, 0.95);
  box-shadow: 0 0 4px rgba(0,0,0,0.8);
}
#crosshair::before { width: 2px; height: 30px; transform: translate(-50%, -50%); }
#crosshair::after  { width: 30px; height: 2px; transform: translate(-50%, -50%); }

/* 命中标记（X），跟随准星，命中时闪现 */
#hitmarker {
  position: absolute;
  top: 50%; left: 50%;
  width: 30px; height: 30px;
  transform: translate(-50%, -50%);
  opacity: 0;
  transition: opacity 0.15s ease;
  pointer-events: none;
}
#hitmarker::before, #hitmarker::after {
  content: "";
  position: absolute;
  top: 50%; left: 50%;
  width: 18px; height: 3px;
  background: #ffe066;
  border-radius: 2px;
  box-shadow: 0 0 4px rgba(0,0,0,0.7);
}
#hitmarker::before { transform: translate(-50%, -50%) rotate(45deg); }
#hitmarker::after  { transform: translate(-50%, -50%) rotate(-45deg); }
#hitmarker.crit::before, #hitmarker.crit::after { background: #ff9d3a; width: 22px; }
#hitmarker.kill::before, #hitmarker.kill::after { background: #ff5555; width: 26px; height: 4px; }
#hitmarker.nopen::before, #hitmarker.nopen::after { background: #7a9ab8; width: 18px; }
#hitmarker.bounce::before, #hitmarker.bounce::after { background: #ffffff; width: 14px; }

/* 装填环（战雷式）：套在准星外的圆环，装填进度顺时针充满，充满即隐藏 */
#reload-ring {
  position: absolute;
  top: 50%; left: 50%;
  width: 66px; height: 66px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  pointer-events: none;
  display: none;
  background: conic-gradient(#ffd76a calc(var(--p, 0) * 1%), rgba(255,255,255,0.12) 0);
  -webkit-mask: radial-gradient(circle, transparent 26px, #000 27px);
          mask: radial-gradient(circle, transparent 26px, #000 27px);
  filter: drop-shadow(0 0 3px rgba(0,0,0,0.8));
}

/* 受击方向指示：屏幕边缘红色弧块，指向伤害来源；fade 自带 1.4s 淡出 */
#dmg-dir { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
#dmg-dir .dmg-arrow {
  position: absolute; left: 0; top: 0;
  width: 110px; height: 30px;
  margin-left: -55px; margin-top: -15px;
  border-radius: 50% 50% 8px 8px;
  background: linear-gradient(to bottom, rgba(255,45,45,0.92), rgba(255,45,45,0));
  box-shadow: 0 0 14px rgba(255,40,40,0.55);
  animation: dmgFade 1.4s ease-out forwards;
}
@keyframes dmgFade { 0% { opacity: 1; } 70% { opacity: 0.75; } 100% { opacity: 0; } }

/* AI 代打仪表：屏幕左下小状态行（模式/目标/阶段） */
#ai-status {
  position: absolute;
  left: 14px; bottom: 120px;
  font: 12px/1.5 "Microsoft YaHei", sans-serif;
  color: #9fe0b0;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  pointer-events: none;
  display: none;
  white-space: pre-line;
}

/* 队友面板：右侧存活/血量/目标列表 */
#squad-panel {
  position: absolute;
  right: 14px; top: 46%;
  width: 168px;
  font: 11px/1.6 "Microsoft YaHei", sans-serif;
  color: #bcd8c0;
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  pointer-events: none;
}
#squad-panel .sq-row {
  margin-bottom: 3px;
  padding: 2px 6px;
  background: rgba(0,0,0,0.35);
  border-radius: 5px;
}
#squad-panel .sq-hp {
  height: 3px; border-radius: 2px;
  background: #57c46a; margin-top: 2px;
  transition: width 0.3s ease;
}

/* 火箭 CCIP 落点圈：橙色虚线圈=火箭弹会落在哪（直升机手动模式） */
#ccip-ring {
  position: absolute;
  width: 44px; height: 44px;
  margin: -22px 0 0 -22px;
  border: 2px dashed rgba(255, 160, 60, 0.9);
  border-radius: 50%;
  pointer-events: none;
  display: none;
  box-shadow: 0 0 8px rgba(255, 140, 40, 0.4);
}
#ccip-ring::after {
  content: "";
  position: absolute;
  left: 50%; top: 50%;
  width: 4px; height: 4px;
  margin: -2px 0 0 -2px;
  background: rgba(255, 200, 120, 0.95);
  border-radius: 50%;
}

/* 导弹来袭警告（RWR）：顶部红字闪烁 + 全屏红色边框脉冲 */
#msl-warn {
  position: absolute;
  left: 50%; top: 16%;
  transform: translateX(-50%);
  font: bold 24px/1 "Microsoft YaHei", sans-serif;
  color: #ff4040;
  text-shadow: 0 0 12px rgba(255, 40, 40, 0.9), 0 2px 4px rgba(0,0,0,0.9);
  letter-spacing: 3px;
  pointer-events: none;
  display: none;
  animation: mslBlink 0.5s steps(2) infinite;
}
#msl-vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: 12px;
  box-shadow: inset 0 0 120px rgba(255, 30, 30, 0.55);
  opacity: 0;
  transition: opacity 0.25s ease;
}
#msl-vignette.on { animation: mslPulse 0.7s ease-in-out infinite; }
@keyframes mslBlink { 0% { opacity: 1; } 50% { opacity: 0.25; } 100% { opacity: 1; } }
@keyframes mslPulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.85; } }

/* 跳弹提示：屏幕中下方独立浮动字（不进 feed 流，速射炮下也看得清），连续跳弹聚合计数 */
#bounce-tip {
  position: absolute;
  left: 50%; bottom: 26%;
  transform: translateX(-50%);
  font: bold 26px/1 "Microsoft YaHei", sans-serif;
  color: #ffffff;
  text-shadow: 0 0 10px rgba(120,180,255,0.9), 0 2px 4px rgba(0,0,0,0.9);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s ease;
}
#bounce-tip.pop { animation: bouncePop 0.3s ease; }
@keyframes bouncePop { 0% { transform: translateX(-50%) scale(1.35); } 100% { transform: translateX(-50%) scale(1); } }

#stats {
  position: absolute;
  left: 18px; bottom: 18px;
  width: 260px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 13px;
}

.bar { display: flex; align-items: center; gap: 8px; }
.bar .lbl { width: 34px; color: #b9cbb9; }
.bar-bg {
  flex: 1;
  height: 14px;
  background: rgba(0,0,0,0.5);
  border: 1px solid rgba(150,180,150,0.4);
  border-radius: 7px;
  overflow: hidden;
}
.bar-fg {
  height: 100%;
  width: 100%;
  border-radius: 7px;
  transition: width 0.08s linear;
}
.bar-fg.hp { background: linear-gradient(90deg, #3aa0ff, #6fe0a0); }
.bar-fg.rl { background: linear-gradient(90deg, #ffb84d, #ffe28a); }

#score {
  color: #ffe9a0;
  font-weight: 600;
  letter-spacing: 1px;
}

#missiles { color: #ff8866; font-size: 13px; font-weight: 600; }

#minimap {
  position: absolute;
  right: 18px; bottom: 18px;
  border-radius: 10px;
  border: 1px solid rgba(150,180,150,0.4);
  opacity: 0.95;
}

#hint {
  position: absolute;
  top: 14px; left: 50%;
  transform: translateX(-50%);
  padding: 6px 14px;
  background: rgba(0,0,0,0.45);
  border-radius: 16px;
  font-size: 13px;
  color: #cddccd;
  letter-spacing: 0.5px;
}

/* —— 击杀提示 / 中央信息 —— */
#feed {
  position: absolute;
  top: 60px;   /* 避开右上角 ⏸/⚙ 常驻按钮（14~52px） */
  right: 18px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  font-size: 13px;
  transition: top 0.3s ease;   /* 回放小窗出现时整体下移避让 */
}
/* 命中回放小窗占据右上（top 46~283px）时，feed 挪到小窗正下方防互相遮挡 */
#feed.below-cam { top: 296px; }
.feed-line {
  background: rgba(0, 0, 0, 0.45);
  padding: 3px 10px;
  border-radius: 8px;
  transition: opacity 1s ease;
  letter-spacing: 0.5px;
}
.feed-kill { color: #ffe9a0; }
.feed-death { color: #ff8a8a; }
.feed-info { color: #9fe0b0; }

#center-msg {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  color: #fff;
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
  pointer-events: none;
  letter-spacing: 2px;
}

/* lock-prompt: click-to-lock hint shown when pointer is unlocked (enables infinite turret rotation) */
#lock-prompt {
  position: absolute;
  left: 50%;
  top: 62%;
  transform: translate(-50%, -50%);
  display: none;
  padding: 14px 30px;
  font-size: 19px;
  color: #ffe08a;
  letter-spacing: 1px;
  background: rgba(20, 28, 22, 0.72);
  border: 1px solid rgba(255, 225, 120, 0.5);
  border-radius: 12px;
  text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
  pointer-events: none;
  z-index: 8;
  animation: lockPulse 1.4s ease-in-out infinite;
  white-space: nowrap;
}
@keyframes lockPulse {
  0%, 100% { opacity: 0.55; }
  50%      { opacity: 1; }
}

/* —— 结果面板 —— */
#result {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(8, 10, 12, 0.6);
  pointer-events: auto;
}
.result-card {
  text-align: center;
  padding: 40px 56px;
  border-radius: 16px;
  background: rgba(25, 32, 28, 0.92);
  border: 1px solid rgba(150,180,150,0.35);
}
.result-card h2 { font-size: 40px; margin-bottom: 8px; }
.result-card p { color: #b9cbb9; margin-bottom: 24px; }
.result-card button {
  margin: 0 8px;
  padding: 10px 20px;
  font-size: 15px;
  border-radius: 10px;
  border: 1px solid rgba(150,180,150,0.4);
  background: rgba(60,80,60,0.7);
  color: #e8f0e2;
  cursor: pointer;
  transition: background 0.12s;
}
.result-card button:hover { background: rgba(90,120,90,0.85); }
.set-row { display:flex; align-items:center; gap:12px; margin:12px 0; font-size:15px; }
.set-row label { flex:0 0 130px; color:#cfe8c0; }
.set-row input[type=range] { flex:1; accent-color:#7CFC00; }
.set-val { flex:0 0 46px; text-align:right; color:#9fb0a0; font-variant-numeric:tabular-nums; }
#lead-reticle { position:absolute; display:none; transform:translate(-50%,-50%); width:30px; height:30px;
  border:2px solid rgba(255,225,120,.9); border-radius:50%; pointer-events:none; z-index:6;
  box-shadow:0 0 8px rgba(255,200,80,.45); }
#lead-reticle::after { content:''; position:absolute; inset:11px; border:1px solid rgba(255,225,120,.9); border-radius:50%; }
#aim-circle { position:absolute; display:none; transform:translate(-50%,-50%); width:34px; height:34px;
  border:2px solid rgba(255,90,90,.95); border-radius:50%; pointer-events:none; z-index:6;
  box-shadow:0 0 8px rgba(255,80,80,.4); transition:left .05s linear, top .05s linear; }
#aim-circle::before { content:''; position:absolute; inset:13px; border:1px solid rgba(255,90,90,.8); border-radius:50%; }
.modules { margin-top:6px; color:#ffb84d; font-size:13px; font-weight:600; min-height:16px; letter-spacing:1px;
  text-shadow:0 1px 2px #000; }

  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="menu" class="overlay">
    <div class="menu-card">
      <h1>陆空对战</h1>
      <p class="subtitle">类战争雷霆 · 单机 3D 版</p>
      <div class="wallet">
        <span id="money" class="money">💰 0</span>
        <span id="rp" class="rp">🔬 0</span>
      </div>
      <div class="modes">
        <button id="btn-tank" class="mode-btn">
          <span class="mode-icon">🛡</span>
          <span class="mode-title">陆战 · 坦克</span>

        </button>
        <button id="btn-plane" class="mode-btn">
          <span class="mode-icon">✈</span>
          <span class="mode-title">空战 · 飞机</span>

          <span class="mode-icon">🌍</span>
          <span class="mode-title">世界大战</span>

        </button>
      </div>
      <div class="difficulty">
        <span class="diff-label">难度</span>
        <button class="diff-btn" data-level="easy">简单</button>
        <button class="diff-btn active" data-level="normal">普通</button>
        <button class="diff-btn" data-level="hard">困难</button>
      </div>
      <div class="toggle-row">
        <span id="best" class="best"></span>
      </div>
      <div id="quests" class="quests"></div>
      <div id="menu-actions">
        <button id="btn-tut" class="mode-btn tech-btn">🎓 新手教学</button>
        <button id="btn-daily" class="mode-btn tech-btn">📅 每日挑战</button>
        <button id="btn-tech" class="mode-btn tech-btn">🔬 科技树</button>
        <button id="btn-settings" class="mode-btn tech-btn">⚙️ 设置</button>
      </div>
      <p class="tip">点坦克/飞机 → 出战选择页 → 开始战斗。打仗赚 🔬研发点 与 💰金币，到科技树解锁更多载具。</p>
      <div id="toast" class="toast"></div>
    </div>
  </div>

  <div id="techtree" class="overlay hidden"></div>

  <div id="settings" class="overlay hidden">
    <div class="menu-card" style="max-width:440px;text-align:left">
      <h2 style="text-align:center;letter-spacing:3px;margin-bottom:18px">⚙️ 设置</h2>
      <div class="set-row"><label>音量</label><input id="set-volume" type="range" min="0" max="1" step="0.05" value="0.8"><span id="set-volume-v" class="set-val">80%</span></div>
      <div class="set-row"><label>引擎音量</label><input id="set-engvol" type="range" min="0" max="1" step="0.05" value="0.8"><span id="set-engvol-v" class="set-val">80%</span></div>
      <div class="set-row"><label>音乐</label><input id="set-music" type="range" min="0" max="1" step="0.05" value="0.5"><span id="set-music-v" class="set-val">50%</span></div>
      <div class="set-row"><label>阴影（画质）</label><label class="switch"><input id="set-shadows" type="checkbox"><span class="sw-track"></span></label><span id="set-shadows-v" class="set-val">开</span></div>
      <div class="set-row"><label>胶片颗粒</label><label class="switch"><input id="set-grain" type="checkbox"><span class="sw-track"></span></label><span id="set-grain-v" class="set-val">开</span></div>
      <div class="set-row"><label>帧率显示</label><label class="switch"><input id="set-fps" type="checkbox"><span class="sw-track"></span></label><span id="set-fps-v" class="set-val">开</span></div>
      <div class="set-row"><label>画质等级</label><input id="set-quality" type="range" min="0" max="3" step="1" value="3"><span id="set-quality-v" class="set-val">自动</span></div>
      <div class="set-row"><label>游戏节奏</label><input id="set-pace" type="range" min="0" max="2" step="1" value="0"><span id="set-pace-v" class="set-val">正常</span></div>
      <div class="set-row"><label>飞行辅助（自动改平）</label><label class="switch"><input id="set-fassist" type="checkbox"><span class="sw-track"></span></label><span id="set-fassist-v" class="set-val">开</span></div>
      <div class="set-row"><label>拟真节奏（战雷式）</label><label class="switch"><input id="set-sim" type="checkbox"><span class="sw-track"></span></label><span id="set-sim-v" class="set-val">关</span></div>
      <div class="set-row"><label>飞机 Y 轴反转</label><label class="switch"><input id="set-inverty" type="checkbox"><span class="sw-track"></span></label><span id="set-inverty-v" class="set-val">关</span></div>
      <div class="set-row"><label>飞机瞄准灵敏度</label><input id="set-planegain" type="range" min="0.4" max="2" step="0.05" value="1"><span id="set-planegain-v" class="set-val">1.00</span></div>
      <div class="set-row"><label>坦克炮塔灵敏度</label><input id="set-tankgain" type="range" min="0.4" max="2" step="0.05" value="1"><span id="set-tankgain-v" class="set-val">1.00</span></div>
      <div style="text-align:center;margin-top:22px"><button id="set-reset" class="diff-btn" style="padding:10px 20px">↺ 恢复默认</button><button id="set-close" class="diff-btn active" style="padding:10px 28px;margin-left:10px">返回</button></div>
      <p class="tip" style="margin-top:14px">音量/灵敏度立即生效；画质（阴影）下一局生效。战斗中可从暂停面板打开本页。</p>
    </div>
  </div>

  <div id="loadout" class="overlay hidden">
    <div class="loadout-card">
      <h2 id="lo-mode">陆战 · 坦克</h2>
      <div class="lo-vehicle">
        <button id="lo-prev" class="lo-nav">◀</button>
        <canvas id="lo-preview3d" width="220" height="220" style="border-radius:12px;background:rgba(20,28,22,0.6);border:1px solid rgba(150,180,150,0.25)"></canvas>
        <div class="lo-info">
          <div id="lo-icon" class="lo-icon">🛡️</div>
          <div id="lo-name" class="lo-name">中型坦克</div>
          <div id="lo-weapon" class="lo-weapon"></div>
          <div id="lo-stats" class="lo-stats"></div>
        </div>
        <button id="lo-next" class="lo-nav">▶</button>
      </div>
      <div id="lo-summary" class="lo-summary"></div>
      <div id="lo-veh-ops">
        <button id="btn-nation" class="diff-btn">🏳 国家：全部</button>
      </div>
      <div class="lo-group-label">对 局 设 置</div>
      <div id="lo-toggles">
        <button id="btn-objective" class="diff-btn">🎯 目标：歼灭</button>
        <button id="btn-map" class="diff-btn">🗺 地图</button>
        <button id="btn-endless" class="diff-btn">♾ 无尽模式：关闭</button>
        <button id="btn-solo" class="diff-btn">👥 队友：有</button>
        <button id="btn-ammo" class="diff-btn">📦 弹药：无限</button>
        <button id="btn-more" class="diff-btn">⚙ 更多选项 ▸</button>
      </div>
      <p id="lo-hint" class="tip">点击 ◀ ▶ 切换已拥有的载具 · ←/→ 键也可以</p>
      <div class="lo-actions">
        <button id="lo-back" class="lo-btn">返回</button>
        <button id="lo-start" class="lo-btn primary">开始战斗 ▶</button>
      </div>
    </div>
  </div>

  <div id="lo-more" class="overlay hidden">
    <div class="loadout-card" style="max-width:420px">
      <h2 style="letter-spacing:3px">⚙ 更多选项</h2>
      <div style="display:flex;flex-direction:column;gap:10px;margin:18px 0 8px">
        <button id="btn-worldwar" class="diff-btn">🌍 世界大战：关闭</button>
        <button id="btn-bcai" class="diff-btn">🤖 学习型人机：关闭</button>
        <button id="btn-rlai" class="diff-btn">🧪 第六代实验体：关闭</button>
      </div>
      <p class="tip" style="margin:6px 0 14px">世界大战=坦克+飞机混战；两个 🤖/🧪 为 AI 实验开关（尝鲜功能，可能影响平衡）</p>

  <script type="importmap">
  { "imports": { "three": "./three.module.js" } }
  </script>
  <script src="./js/net-stub.js"></script><!-- 联机 E2E 测试钩子：?stub=1 才激活，平时空转 -->
  <script src="./js/agent-core.js"></script><!-- 智能体共享核心：obs 构造（录制/推理共用，始终加载、纯工具无副作用） -->
  <script src="./js/agent-recorder.js"></script><!-- BC 录制钩子：?record=1 才激活，平时空转 -->
  <script src="./js/agent-bc.js"></script><!-- BC 人机：?bc=1 或出战页开关(localStorage.wt_bc) 才激活，平时空转 -->
  <script src="./js/agent-dagger.js"></script><!-- DAgger 影子老师录制：?dagger=1 才激活，平时空转 -->
  <script src="./js/agent-rl.js"></script><!-- PPO 强化学习人机：?rl=1 / ?rl=ally 才激活，平时空转 -->
  <script>
    // 🤖 学习型人机开关（三态：关闭→敌方→队友）：只写 localStorage 供 agent-bc.js 读取，与 main.js 零耦合
    (function () {
      var b = document.getElementById('btn-bcai');
      if (!b) return;
      var v = '0'; try { v = localStorage.getItem('wt_bc') || '0'; } catch (e) { }
      if (v === '1') v = 'enemy';   // 旧值兼容
      var LABELS = { '0': '关闭', 'enemy': '敌方', 'ally': '队友' };
      var ORDER = ['0', 'enemy', 'ally'];
      var sync = function () { b.textContent = '🤖 学习型人机：' + LABELS[v]; };
      b.addEventListener('click', function () {
        v = ORDER[(ORDER.indexOf(v) + 1) % ORDER.length];
        try { localStorage.setItem('wt_bc', v); } catch (e) { }
        sync();
      });
      sync();
    })();
    // 🧪 第六代实验体开关（三态：关闭→敌方→队友）：写 localStorage.wt_rl 供 agent-rl.js 读取。
    // 实验体=第六代 PPO（确定性推理，静态权重）；与学习型人机同开时同一辆车先到先得、互不干扰。
    (function () {
      var b = document.getElementById('btn-rlai');
      if (!b) return;
      var v = '0'; try { v = localStorage.getItem('wt_rl') || '0'; } catch (e) { }
      var LABELS = { '0': '关闭', 'enemy': '敌方', 'ally': '队友' };
      var ORDER = ['0', 'enemy', 'ally'];
      var sync = function () { b.textContent = '🧪 第六代实验体：' + LABELS[v]; };
      b.addEventListener('click', function () {
        v = ORDER[(ORDER.indexOf(v) + 1) % ORDER.length];
        try { localStorage.setItem('wt_rl', v); } catch (e) { }
        sync();
      });
      sync();
    })();
  </script>
  <script type="module" src="./js/main.js"></script>
</body>
